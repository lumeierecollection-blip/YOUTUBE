name: Long-form Render

# Renders long-form episodes (platform/longform/v2/episodes/<slug>.mjs) as 1920x1080 MP4s with thumbnails and publishing metadata, then runs the file QA.
# Shorts are NOT made here: they come from the existing Shorts system. Holds no YouTube credentials, has no upload step, cannot post.
# Push to lfr/<slug>: lfr/hidden-past-hormuz, lfr/hidden-past-msh or lfr/ai-tested-trust renders exactly that episode (any other branch name renders all).
# Speed: the beats of an episode are split over 5 parallel jobs (beat index modulo 5), each on its own runner, then one job joins them,
# mixes the sound, makes the thumbnails and the metadata and runs the QA.
on:
  push:
    branches:
      - "lfr/**"

permissions:
  contents: read

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        episode: [hidden-past-msh, hidden-past-hormuz, ai-tested-trust, ai-tested-gemini4, ai-tested-nvidia-chip-trail, rival-lines-leicester]
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Skip episodes this branch did not ask for
        id: want
        run: |
          b="${GITHUB_REF_NAME#lfr/}"; ch="${{ matrix.episode }}"
          if [[ ( "$b" == hidden-past* || "$b" == ai-tested* || "$b" == rival-lines* ) && "$b" != "$ch" ]]; then echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.want.outputs.run == 'yes'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/skills/remotion-render/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.want.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Install tools
        if: steps.want.outputs.run == 'yes'
        run: |
          retry() { for pause in 20 60 120 0; do "$@" && return 0; [ "$pause" = 0 ] && return 1; echo "retrying in ${pause}s"; sleep "$pause"; done; }
          install() { npm ci --no-audit --no-fund || npm install --no-audit --no-fund; }
          retry install
          cd src/skills/remotion-render
          retry install
          cd "$GITHUB_WORKSPACE"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip3 install --quiet edge-tts faster-whisper "av==15.1.0"
      - uses: browser-actions/setup-chrome@v1
        if: steps.want.outputs.run == 'yes'
        id: chrome
        with:
          chrome-version: stable
      - name: Eligibility gate (channel credentials configured in GitHub and validated)
        if: steps.want.outputs.run == 'yes'
        env:
          # every slot 01-60 is passed; empty ones are simply not configured (discovery stays automatic)
          CHANNEL_01_CLIENT_ID: ${{ secrets.CHANNEL_01_CLIENT_ID }}
          CHANNEL_01_CLIENT_SECRET: ${{ secrets.CHANNEL_01_CLIENT_SECRET }}
          CHANNEL_01_REFRESH_TOKEN: ${{ secrets.CHANNEL_01_REFRESH_TOKEN }}
          CHANNEL_02_CLIENT_ID: ${{ secrets.CHANNEL_02_CLIENT_ID }}
          CHANNEL_02_CLIENT_SECRET: ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
          CHANNEL_02_REFRESH_TOKEN: ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
          CHANNEL_03_CLIENT_ID: ${{ secrets.CHANNEL_03_CLIENT_ID }}
          CHANNEL_03_CLIENT_SECRET: ${{ secrets.CHANNEL_03_CLIENT_SECRET }}
          CHANNEL_03_REFRESH_TOKEN: ${{ secrets.CHANNEL_03_REFRESH_TOKEN }}
          CHANNEL_04_CLIENT_ID: ${{ secrets.CHANNEL_04_CLIENT_ID }}
          CHANNEL_04_CLIENT_SECRET: ${{ secrets.CHANNEL_04_CLIENT_SECRET }}
          CHANNEL_04_REFRESH_TOKEN: ${{ secrets.CHANNEL_04_REFRESH_TOKEN }}
