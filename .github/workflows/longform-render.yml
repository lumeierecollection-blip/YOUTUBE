          CHANNEL_59_CLIENT_ID: ${{ secrets.CHANNEL_59_CLIENT_ID }}
          CHANNEL_59_CLIENT_SECRET: ${{ secrets.CHANNEL_59_CLIENT_SECRET }}
          CHANNEL_59_REFRESH_TOKEN: ${{ secrets.CHANNEL_59_REFRESH_TOKEN }}
          CHANNEL_60_CLIENT_ID: ${{ secrets.CHANNEL_60_CLIENT_ID }}
          CHANNEL_60_CLIENT_SECRET: ${{ secrets.CHANNEL_60_CLIENT_SECRET }}
          CHANNEL_60_REFRESH_TOKEN: ${{ secrets.CHANNEL_60_REFRESH_TOKEN }}
        run: |
          e="${{ matrix.episode }}"; ch=$([[ "$e" == hidden-past* ]] && echo hidden-past || ([[ "$e" == ai-tested* ]] && echo ai-tested || ([[ "$e" == rival-lines* ]] && echo rival-lines || echo "$e")))
          node platform/production/eligibility.mjs --require "$ch"
      - name: Render this shard's beats
        if: steps.want.outputs.run == 'yes'
        timeout-minutes: 170
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          REMOTION_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CONC: "3"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: node platform/longform/v2/render-episode.mjs "${{ matrix.episode }}" --shard "${{ matrix.shard }}/5" 2>&1 | { grep -v composed-scene || true; }
