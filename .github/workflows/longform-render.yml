name: Long-form Render

# Renders long-form episodes (platform/longform/v2/episodes/<slug>.mjs) as 1920x1080 MP4s with thumbnails and publishing metadata, then runs the file QA.
# Shorts are NOT made here: they come from the existing Shorts system. Holds no YouTube credentials, has no upload step, cannot post.
# Push to lfr/<slug>: lfr/hidden-past-hormuz, lfr/hidden-past-msh or lfr/ai-tested-trust renders exactly that episode (any other branch name renders all).
# Speed: the beats of an episode are split over 5 parallel jobs (beat index modulo 5), each on its own runner, then one job joins them,
# mixes the sound, makes the thumbnails and the metadata and runs the QA.
on:
  push:
    branches:
      - "lfr/**"

permissions:
  contents: read

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        episode: [hidden-past-msh, hidden-past-hormuz, ai-tested-trust]
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Skip episodes this branch did not ask for
        id: want
        run: |
          b="${GITHUB_REF_NAME#lfr/}"; ch="${{ matrix.episode }}"
          if [[ ( "$b" == hidden-past* || "$b" == ai-tested* ) && "$b" != "$ch" ]]; then echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.want.outputs.run == 'yes'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/skills/remotion-render/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.want.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Install tools
        if: steps.want.outputs.run == 'yes'
        run: |
          retry() { for pause in 20 60 120 0; do "$@" && return 0; [ "$pause" = 0 ] && return 1; echo "retrying in ${pause}s"; sleep "$pause"; done; }
          install() { npm ci --no-audit --no-fund || npm install --no-audit --no-fund; }
          retry install
          cd src/skills/remotion-render
          retry install
          cd "$GITHUB_WORKSPACE"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip3 install --quiet edge-tts faster-whisper "av==15.1.0"
      - uses: browser-actions/setup-chrome@v1
        if: steps.want.outputs.run == 'yes'
        id: chrome
        with:
          chrome-version: stable
      - name: Render this shard's beats
        if: steps.want.outputs.run == 'yes'
        timeout-minutes: 170
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          REMOTION_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CONC: "3"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: node platform/longform/v2/render-episode.mjs "${{ matrix.episode }}" --shard "${{ matrix.shard }}/5" 2>&1 | { grep -v composed-scene || true; }
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == 'yes'
        with:
          name: beats-${{ matrix.episode }}-${{ matrix.shard }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            output/longform-prod/${{ matrix.episode }}/beats/*.mp4
            output/longform-prod/${{ matrix.episode }}/voice/*

  finish:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        episode: [hidden-past-msh, hidden-past-hormuz, ai-tested-trust]
    steps:
      - name: Skip episodes this branch did not ask for
        id: want
        run: |
          b="${GITHUB_REF_NAME#lfr/}"; ch="${{ matrix.episode }}"
          if [[ ( "$b" == hidden-past* || "$b" == ai-tested* ) && "$b" != "$ch" ]]; then echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.want.outputs.run == 'yes'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/skills/remotion-render/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.want.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Install tools
        if: steps.want.outputs.run == 'yes'
        run: |
          retry() { for pause in 20 60 120 0; do "$@" && return 0; [ "$pause" = 0 ] && return 1; echo "retrying in ${pause}s"; sleep "$pause"; done; }
          install() { npm ci --no-audit --no-fund || npm install --no-audit --no-fund; }
          retry install
          cd src/skills/remotion-render
          retry install
          cd "$GITHUB_WORKSPACE"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip3 install --quiet edge-tts faster-whisper "av==15.1.0"
      - uses: browser-actions/setup-chrome@v1
        if: steps.want.outputs.run == 'yes'
        id: chrome
        with:
          chrome-version: stable
      - name: Collect the shards' beats and voices
        if: steps.want.outputs.run == 'yes'
        uses: actions/download-artifact@v4
        with:
          pattern: beats-${{ matrix.episode }}-*
          merge-multiple: true
          path: output/longform-prod/${{ matrix.episode }}
      - name: Join and mix the sound (a beat that is still missing is rendered here)
        if: steps.want.outputs.run == 'yes'
        timeout-minutes: 100
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          REMOTION_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CONC: "3"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          ls output/longform-prod/${{ matrix.episode }}/beats | wc -l
          node platform/longform/v2/render-episode.mjs "${{ matrix.episode }}" 2>&1 | { grep -v composed-scene || true; }
      - name: Thumbnails
        if: steps.want.outputs.run == 'yes'
        timeout-minutes: 30
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          REMOTION_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node platform/longform/v2/make-thumbs.mjs "${{ matrix.episode }}" 2>&1 | { grep -v composed-scene || true; }
      - name: Publishing metadata
        if: steps.want.outputs.run == 'yes'
        timeout-minutes: 10
        run: node platform/longform/v2/make-meta.mjs "${{ matrix.episode }}"
      - name: File QA
        if: always() && steps.want.outputs.run == 'yes'
        run: node platform/longform/v2/qa-outputs.mjs "${{ matrix.episode }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == 'yes'
        with:
          name: longform-${{ matrix.episode }}-${{ github.run_id }}
          retention-days: 30
          path: |
            output/longform-prod/${{ matrix.episode }}/episode.mp4
            output/longform-prod/${{ matrix.episode }}/episode-meta.json
            output/longform-prod/${{ matrix.episode }}/render-log.json
            output/longform-prod/${{ matrix.episode }}/qa.json
            output/longform-prod/${{ matrix.episode }}/thumbnails/*.jpg
            output/longform-prod/${{ matrix.episode }}/thumbnails/*.json
