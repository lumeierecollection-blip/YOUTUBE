name: visual-qa-loop

# Renders a short sample of the MotionGraphicsShorts composition, checks it for
# free, and only escalates to a paid vision call when the free check is clean.
# Hard-capped at 3 attempts so a failing composition can never drain the credit
# budget. Renders through qa-sample.js — real Root.jsx entry, props via
# inputProps, scale 0.5 (DEL-14 refactor 2026-08-30): frames 0-179 at 540x960.

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: Channel id from config/channels.json
        required: true
      srt_path:
        description: Path to the TTS script SRT to QA against
        required: true
      max_attempts:
        description: Hard cap on fix iterations
        default: "3"

concurrency:
  group: visual-qa-${{ github.ref }}-${{ inputs.channel_id }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/skills/remotion-render/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install render deps + QA tooling
        run: |
          pip install pillow numpy
          cd src/skills/remotion-render
          npm ci
          npx remotion browser ensure
          # audio.js statically imports ./vo.mp3; real renders stage it from TTS.
          ffmpeg -v error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 1 vo.mp3

      - name: Attempt loop
        env:
          VISION_API_BASE: ${{ vars.VISION_API_BASE }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          MAX="${{ inputs.max_attempts }}"
          CHANNEL_ID="${{ inputs.channel_id }}"
          SRT="${{ inputs.srt_path }}"
          mkdir -p qa out

          for i in $(seq 1 "$MAX"); do
            echo "::group::attempt $i"

            # Sample render only — 6 seconds at half scale. Never full length in QA.
            cd src/skills/remotion-render
            node qa-sample.js "$CHANNEL_ID" "$SRT" ../out/qa.mp4 180 || exit 1
            cd ..

            # Free deterministic pass.
            python scripts/qa_frames.py \
              --video out/qa.mp4 --report "qa/report-$i.json" --sheet "qa/sheet-$i.jpg"
            FREE=$?

            if [ $FREE -eq 0 ]; then
              # Only now is a paid call justified.
              if [ -n "$VISION_MODEL" ]; then
                python scripts/vision_critic.py \
                  --sheet "qa/sheet-$i.jpg" --context "qa/report-$i.json" \
                  --out "qa/critique-$i.json"
                [ $? -eq 0 ] && echo "PASSED on attempt $i" && echo "::endgroup::" && exit 0
              else
                echo "no vision model configured; free checks passed" && exit 0
              fi
            fi

            # Hand the findings back to the agent to fix, then loop.
            npx opencode run \
              "Read qa/report-$i.json and qa/critique-$i.json if it exists. Fix ONLY the
               highest-severity defect listed, in the MotionGraphicsShorts composition
               (src/skills/remotion-render/compositions/motion-graphics.jsx), using
               parameters from a video-shotcraft shot recipe card. Change nothing else.
               Do not render."

            echo "::endgroup::"
          done

          echo "still failing after $MAX attempts — see qa/ artifacts"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ inputs.channel_id }}
          path: |
            qa/
            out/qa.mp4
          retention-days: 7
