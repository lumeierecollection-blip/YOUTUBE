# Fetches a real, license-verified Pixabay Music track for the whole-video
# background underscore bed. See src/skills/music-sourcing/SKILL.md for why
# this runs here rather than in the interactive session (pixabay.com is
# blocked by that session's egress proxy — confirmed live, same failure
# mode build-asset-library.yml's photo sources hit before moving here) and
# why it drives a real browser rather than calling an API (Pixabay Music
# has no documented/public API endpoint, only a download-from-the-page
# flow).
#
# KNOWN LIMITATION, confirmed via 12 real runs of this workflow (see
# SKILL.md's full run log): the page-load Cloudflare challenge can be
# worked around, but the download BUTTON itself is separately gated by a
# Cloudflare Turnstile widget, and Turnstile's own verification request
# (.../challenge-platform/h/b/pat/...) returns 401 for this automated
# browser every time — the download never completes as a result. That is
# Cloudflare's anti-bot protection working as intended; defeating it would
# mean CAPTCHA-solving or IP-reputation laundering, neither of which this
# script attempts. This workflow is kept, dispatchable, as an honestly-
# documented attempt (and it does everything up to the actual file
# transfer correctly), not because it currently succeeds end-to-end.
# Sourcing the real audio file needs a one-time manual download by a
# human — see SKILL.md for the specific recommended track.

name: Fetch Underscore Track

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Pixabay Music search query"
        required: false
        default: "kalimba"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch track
        # xvfb-run: fetch-underscore.mjs launches Chromium headed
        # (headless: false), not headless — a real run showed Cloudflare's
        # bot-check interstitial in place of Pixabay's actual search
        # results, and headless Chromium's fingerprint is a common trigger
        # for that specific challenge tier. A headed browser needs a real
        # X display, which this runner doesn't have by default; xvfb-run
        # provides a virtual one (xvfb itself is already installed here as
        # a Playwright OS dependency from the previous step).
        run: |
          QUERY="${{ github.event.inputs.query }}"
          QUERY="${QUERY:-kalimba}"
          xvfb-run -a node src/skills/music-sourcing/fetch-underscore.mjs "$QUERY"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-underscore-debug
          path: data/music/_debug-*
          if-no-files-found: ignore

      - name: Commit track + metadata
        run: |
          git config user.name "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/music/ src/skills/remotion-render/public/music/
          if git diff --cached --quiet; then
            echo "No new track — nothing to commit."
          else
            git commit -m "music-sourcing: fetch-underscore.mjs run [${{ github.run_id }}]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
