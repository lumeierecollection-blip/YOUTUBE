# OpenRouter probe (2026-10-10 brief). Read-only: it calls OpenRouter and Edge-TTS, writes no cache and changes no file.
#  - raw HTTP: one 16x16 PNG to the vision model, and one text control, with the status code printed
#  - scripts/edge-variants.mjs: four texts of one production sentence on Edge-TTS (no key), scored by the acoustic measure
#  - scripts/openrouter-probe.mjs: catalog, text and image gates through the real chain with Gemini forced to fail,
#    flip rate (N runs per gate, OpenRouter only), one mp3 to an audio-input model if the catalog has one
# Gemini is forced to fail with a key that is not valid (a hard error, not a 429). No Groq or Ollama key is set.
name: openrouter-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY_1: invalid-probe-key-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - name: Check out the board-frames branch (identity images)
        uses: actions/checkout@v4
        with:
          ref: board-frames
          path: board
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install edge-tts and numpy
        run: python3 -m pip install --quiet edge-tts numpy
      - name: "Raw HTTP, one image and one text control to OpenRouter, status printed"
        run: |
          python3 - <<'PY'
          import zlib, struct, base64, json, os, subprocess
          w = h = 16
          raw = b"".join(b"\x00" + b"\xff\x00\x00" * w for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          b64 = base64.b64encode(png).decode()
          key = os.environ.get("OPENROUTER_API_KEY", "")
          if not key:
              print("OPENROUTER_API_KEY: NOT SET"); raise SystemExit(0)
          cases = {
              "image": {"model": "qwen/qwen3-vl-32b-instruct", "max_tokens": 16, "temperature": 0, "messages": [{"role": "user", "content": [
                  {"type": "text", "text": "Reply with one word: what colour is this image?"},
                  {"type": "image_url", "image_url": {"url": f"data:image/png;base64,{b64}"}}]}]},
              "text": {"model": "openai/gpt-oss-120b", "max_tokens": 16, "temperature": 0, "messages": [
                  {"role": "user", "content": "Reply with one word: what colour is a clear sky?"}]},
          }
          for name, body in cases.items():
              open(f"{name}.json", "w").write(json.dumps(body))
              out = subprocess.run(["curl", "-sS", "-o", f"{name}-resp.json", "-w", "%{http_code}", "-H", "Content-Type: application/json",
                  "-H", f"Authorization: Bearer {key}", "-d", f"@{name}.json", "https://openrouter.ai/api/v1/chat/completions"],
                  capture_output=True, text=True).stdout.strip()
              try:
                  j = json.load(open(f"{name}-resp.json"))
              except Exception as e:
                  print(f"{name} ({body['model']}): HTTP {out}, unreadable body: {e}"); continue
              if "error" in j:
                  print(f"{name} ({body['model']}): HTTP {out}, error: {str(j['error'].get('message', ''))[:200]}")
              else:
                  print(f"{name} ({body['model']}): HTTP {out}, answer: {j.get('choices', [{}])[0].get('message', {}).get('content', '')[:120]!r}")
          PY
      - name: "Edge-TTS variants, four texts of one production sentence, scored acoustically"
        run: node scripts/edge-variants.mjs --out probe/edge
      - name: OpenRouter probe (catalog, text and image gates, flip rate, audio)
        run: node scripts/openrouter-probe.mjs --image board/identity/Chase_Sui_Wonders_wikidata.jpg --audio probe/edge/b.mp3 --n 9
      - name: Upload the variant audio and acoustic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-probe-edge
          path: probe/edge
          retention-days: 7
          if-no-files-found: warn
