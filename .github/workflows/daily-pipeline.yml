# YouTube Automation — Fully Autonomous Daily Pipeline
# Runs daily, picks fresh topics, researches, scripts, renders, publishes
# No manual intervention required after initial setup

name: Daily Pipeline — Autonomous

on:
  schedule:
    # Run at 6:00 AM UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        type: boolean
        default: false
      channel_override:
        description: "Process specific channel ID only (leave empty for all)"
        required: false

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # PHASE 1: Pick topics for each channel
  # ============================================================
  pick-topics:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.topics.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pick fresh topics for all channels
        id: topics
        run: |
          CHANNEL_OVERRIDE="${{ github.event.inputs.channel_override }}"

          # Get channel IDs (using numeric "id" field, not "channel_id")
          if [ -n "$CHANNEL_OVERRIDE" ]; then
            CHANNELS="[\"$CHANNEL_OVERRIDE\"]"
          else
            CHANNELS=$(node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('config/channels.json'));
              const channels = data.channels || data;
              console.log(JSON.stringify(channels.map(c => String(c.id))));
            ")
          fi

          echo "Channels to process: $CHANNELS"

          # Build task list — each channel gets a topic from content pillars
          TASKS="[]"
          for CH in $(echo $CHANNELS | jq -r '.[]'); do
            echo "--- Topic selection: $CH ---"

            # Pick first unused topic from channel's content_pillars
            RESULT=$(node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('config/channels.json'));
              const channels = data.channels || data;
              const ch = channels.find(c => String(c.id) === '$CH');
              if (!ch) { console.log(JSON.stringify({topic: 'unknown', slug: 'unknown'})); process.exit(); }

              const topicLog = JSON.parse(fs.readFileSync('data/topic-log.json', 'utf8'));
              const used = (topicLog.channel_history?.['$CH'] || []).map(t => t.topic);
              const pillars = ch.content_pillars || [];
              const available = pillars.filter(p => !used.includes(p));
              const topic = available.length > 0 ? available[0] : pillars[0] || 'General topic';
              const slug = topic.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 60);
              console.log(JSON.stringify({topic, slug}));
            " 2>/dev/null || echo '{"topic":"general","slug":"general"}')

            TASKS=$(echo $TASKS | jq --arg ch "$CH" --argjson r "$RESULT" '. + [{channel_id: $ch, topic_info: $r}]')
          done

          echo "matrix={\"include\":$(echo $TASKS | jq -c .)}" >> $GITHUB_OUTPUT
          echo "Total channels: $(echo $TASKS | jq length)"

  # ============================================================
  # PHASE 2: Research + Script + TTS (per channel, parallel)
  # ============================================================
  research-and-script:
    needs: pick-topics
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.pick-topics.outputs.matrix) }}
      max-parallel: 5
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install EdgeTTS
        run: pip install edge-tts

      - name: Ensure output directories
        run: |
          CH="${{ matrix.channel_id }}"
          mkdir -p data/research/$CH data/tts/$CH data/thumbnails/$CH

      - name: Generate script
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG="${{ matrix.topic_info.slug }}"
          echo "=== SCRIPT: $CH — $SLUG ==="

          # Script-writer reads existing research from data/research/<ch>/
          # If no research exists yet, create a minimal research file first
          if [ ! -f "data/research/$CH/$SLUG.json" ]; then
            echo "No research file found — creating placeholder"
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('config/channels.json','utf8'));
              const ch = (data.channels||data).find(c => String(c.id)==='$CH');
              const topic = '${SLUG}'.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
              const research = {
                topic: topic,
                topic_slug: '$SLUG',
                channel_id: '$CH',
                strongest_angle: topic + ' — what most people get wrong',
                key_facts: [{fact: topic + ' is commonly misunderstood. Here is what actually matters.', source: 'General knowledge'}],
                sources: []
              };
              fs.writeFileSync('data/research/$CH/$SLUG.json', JSON.stringify(research, null, 2));
            "
          fi

          # Run script-writer
          node src/skills/script-writer/run.js "$CH" "$SLUG"

      - name: Generate TTS voiceover
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG="${{ matrix.topic_info.slug }}"
          echo "=== TTS: $CH — $SLUG ==="

          # Find the script file
          SCRIPT="data/research/$CH/${SLUG}-script.json"
          if [ -f "$SCRIPT" ]; then
            node src/utils/tts.js "$CH" "$SCRIPT"
          else
            echo "WARN: Script not found at $SCRIPT — skipping TTS"
          fi

      - name: Generate thumbnail
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG="${{ matrix.topic_info.slug }}"
          echo "=== THUMBNAIL: $CH — $SLUG ==="

          SCRIPT="data/research/$CH/${SLUG}-script.json"
          if [ -f "$SCRIPT" ]; then
            node src/skills/thumbnail-maker/generate.js "$CH" "$SCRIPT" || echo "WARN: thumbnail spec failed"
            node src/skills/thumbnail-maker/render-thumb.js "$CH" || echo "WARN: thumbnail render failed"
          else
            echo "WARN: Script not found — skipping thumbnail"
          fi

      - name: Generate SEO + metadata
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG="${{ matrix.topic_info.slug }}"
          echo "=== METADATA: $CH — $SLUG ==="

          # Run pipeline steps 5-15 (SEO through render settings) for this channel
          node src/utils/pipeline.js "$CH" --step 5 || echo "WARN: metadata generation had issues"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/research/${{ matrix.channel_id }}/
            data/tts/${{ matrix.channel_id }}/
            data/thumbnails/${{ matrix.channel_id }}/
          retention-days: 7

  # ============================================================
  # PHASE 3: Render videos
  # ============================================================
  render:
    needs: research-and-script
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Remotion dependencies
        working-directory: src/skills/remotion-render
        run: npm ci

      - name: Download all research artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: research-*

      - name: Render all videos
        run: |
          CHANNEL_OVERRIDE="${{ github.event.inputs.channel_override }}"

          if [ -n "$CHANNEL_OVERRIDE" ]; then
            CHANNELS="[\"$CHANNEL_OVERRIDE\"]"
          else
            CHANNELS=$(node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('config/channels.json'));
              const channels = data.channels || data;
              console.log(JSON.stringify(channels.map(c => String(c.id))));
            ")
          fi

          for CH in $(echo $CHANNELS | jq -r '.[]'); do
            echo "=== RENDER: $CH ==="

            # Find all script files (JSON format)
            SCRIPTS=$(ls data/research/$CH/*-script.json 2>/dev/null || true)
            for SCRIPT in $SCRIPTS; do
              echo "Rendering: $SCRIPT"
              node src/skills/remotion-render/render.js longform "$CH" "$SCRIPT" || echo "WARN: render failed for $SCRIPT"
            done
          done

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ github.run_id }}
          path: data/renders/
          retention-days: 7

  # ============================================================
  # PHASE 4: Publish to YouTube
  # ============================================================
  publish:
    needs: render
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Download all render artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: renders-*

      - name: Publish to YouTube
        run: |
          CHANNEL_OVERRIDE="${{ github.event.inputs.channel_override }}"

          if [ -n "$CHANNEL_OVERRIDE" ]; then
            CHANNELS="[\"$CHANNEL_OVERRIDE\"]"
          else
            CHANNELS=$(node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('config/channels.json'));
              const channels = data.channels || data;
              console.log(JSON.stringify(channels.map(c => String(c.id))));
            ")
          fi

          for CH in $(echo $CHANNELS | jq -r '.[]'); do
            echo "=== PUBLISH: $CH ==="
            node src/skills/youtube-publish/run.js "$CH" || echo "WARN: publish failed (API creds needed)"
          done

      - name: Update topic log
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const logPath = 'data/topic-log.json';
            const log = JSON.parse(fs.readFileSync(logPath, 'utf8'));
            log.last_run = new Date().toISOString();
            fs.writeFileSync(logPath, JSON.stringify(log, null, 2));
          " || true

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: data/run-logs/
          retention-days: 30

  # ============================================================
  # PHASE 5: Log results
  # ============================================================
  log-results:
    needs: [pick-topics, research-and-script, render, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate run report
        run: |
          echo "=== PIPELINE RUN REPORT ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Triggered: ${{ github.event_name }}"
          echo "Dry Run: ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Channels: ${{ github.event.inputs.channel_override || 'ALL' }}"
          echo "Date: $(date -u)"
          echo ""
          echo "=== STATUS ==="
          echo "Pick Topics: ${{ needs.pick-topics.result }}"
          echo "Research+Script: ${{ needs.research-and-script.result }}"
          echo "Render: ${{ needs.render.result }}"
          echo "Publish: ${{ needs.publish.result }}"
