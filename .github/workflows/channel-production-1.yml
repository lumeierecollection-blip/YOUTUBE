name: Channel Production — Hidden Past (ch-1)

# Generic production pipeline for one YouTube channel, based on the verified
# Margaret Clitherow benchmark (run 41739016672, commit 647d5c59 + follow-ups).
#
# Job sequence:
#   setup -> source-historical-images, generate-narration (parallel)
#   build-timeline (needs setup + images + narration)
#   render-video (needs setup + timeline + images + narration)
#   run-quality-assurance (needs render-video + setup)
#   publish-preparation (needs render-video + QA + images + timeline)
#
# All cross-job files move via actions/upload-artifact + actions/download-artifact.
# Jobs never share runner filesystems. Every gate hard-fails; no silent placeholders.
# Nothing goes public: uploads are private only; owner publishes manually.

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render + QA only, no upload'
        required: false
        default: 'true'
      channel_id:
        description: 'Channel ID'
        required: false
        default: '1'

permissions:
  contents: read
  pages: write

concurrency:
  group: channel-prod-1-${{ github.ref }}
  cancel-in-progress: false

env:
  CHANNEL_ID: 1
  SCRIPT_PATH: data/research/1/hidden-past-1586-york-shorts-script.json
  STEM: hidden-past-1586-york-shorts
  TTS_TOPIC: hidden-past-1586-york-shorts-script
  VISUAL_PACK: data/editor/visual-packs/ch1-hidden-past.json
  REQUIRED_IMAGES: 9
  MIN_PEOPLE_RATIO: 0.0

jobs:
  setup:
    name: Environment Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.vars.outputs.channel }}
      stem: ${{ steps.vars.outputs.stem }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache and Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund 2>/dev/null || npm install)

      - name: Install System Tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg poppler-utils python-is-python3 curl jq
          fi
          ffmpeg -version | head -1

      - name: Setup Chrome for Remotion
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python edge-tts (free TTS)
        run: |
          pip3 install edge-tts --quiet 2>/dev/null || pip install edge-tts --quiet
          python3 -c "import edge_tts; print('edge-tts installed successfully')" 2>/dev/null || echo "warning: edge-tts not available"

      - name: Output Variables
        id: vars
        run: |
          echo "channel=${{ env.CHANNEL_ID }}" >> $GITHUB_OUTPUT
          echo "stem=${{ env.STEM }}" >> $GITHUB_OUTPUT

  source-historical-images:
    name: Source Historical Images (Wikimedia Commons)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      asset_count: ${{ steps.assets.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create asset directories
        run: |
          mkdir -p data/editor/assets/${{ env.CHANNEL_ID }}
          mkdir -p src/skills/remotion-render/public/editor/assets/${{ env.CHANNEL_ID }}
          mkdir -p scripts/assets

      - name: Download curated image pack
        id: assets
        run: |
          node scripts/assets/download-historical-images.mjs --channel "${{ env.CHANNEL_ID }}"

      - name: Report image count
        id: count
        run: |
          COUNT=$(node -e "const m=require('./data/editor/assets/${{ env.CHANNEL_ID }}/asset-manifest.json'); console.log(m.total_downloaded)")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "[images] Downloaded $COUNT/${{ env.REQUIRED_IMAGES }} images"

      - name: Upload historical images artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-images-${{ env.CHANNEL_ID }}
          path: |
            data/editor/assets/${{ env.CHANNEL_ID }}/asset-manifest.json
            data/editor/assets/${{ env.CHANNEL_ID }}/provenance-manifest.json
            data/editor/assets/${{ env.CHANNEL_ID }}/ATTRIBUTIONS.md
            data/editor/assets/${{ env.CHANNEL_ID }}/hist-*.jpg
            data/editor/assets/${{ env.CHANNEL_ID }}/hist-*.png
          retention-days: 30

  check-script-clarity:
    name: Script Clarity Review
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install

      - name: Run Script Clarity Check
        id: clarity
        run: |
          echo "[clarity] Reviewing script for viewer understanding"
          node scripts/check-script-clarity.mjs "${{ env.SCRIPT_PATH }}" 2>&1 | tee /tmp/clarity-output.json
          CLARITY_EXIT=${PIPESTATUS[0]}
          if [ $CLARITY_EXIT -ne 0 ]; then
            echo "::error::Script clarity check failed with exit code $CLARITY_EXIT"
            echo "clarity_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          UNCLEAR_COUNT=$(node -e "const r=require('/tmp/clarity-output.json'); console.log(r.unclear?.length||0)")
          echo "unclear_count=$UNCLEAR_COUNT" >> $GITHUB_OUTPUT
          echo "[clarity] Unclear sentences: $UNCLEAR_COUNT"

      - name: Fail on Substantive Clarity Problems
        if: steps.clarity.outputs.unclear_count > 0
        run: |
          echo "::error::Script has ${{ steps.clarity.outputs.unclear_count }} unclear sentence(s) - revise before narration"
          exit 1

  generate-narration:
    name: Generate Voiceover (Free EdgeTTS)
    needs: [setup, check-script-clarity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Python edge-tts (free TTS)
        run: |
          pip3 install edge-tts --quiet 2>/dev/null || pip install edge-tts --quiet
          python3 -c "import edge_tts; print('edge-tts installed successfully')" 2>/dev/null || echo "warning: edge-tts not available"

      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install

      - name: Install FFmpeg and bc
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg bc
          fi
          ffmpeg -version | head -1

      - name: Generate TTS
        id: tts
        run: |
          echo "[tts] Generating narration for channel ${{ env.CHANNEL_ID }}"
          mkdir -p data/tts/${{ env.CHANNEL_ID }}

          set +e
          node src/utils/tts.js ${{ env.CHANNEL_ID }} ${{ env.SCRIPT_PATH }} 2>&1
          TTS_EXIT_CODE=$?
          set -e

          echo "=== TTS Output ==="
          ls -la data/tts/${{ env.CHANNEL_ID }}/ 2>/dev/null || echo "No TTS directory created"

          if [ $TTS_EXIT_CODE -ne 0 ]; then
            echo "::error::TTS generation failed with exit code $TTS_EXIT_CODE"
            echo "tts_success=false" >> $GITHUB_OUTPUT
          else
            echo "tts_success=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify TTS Audio
        if: steps.tts.outputs.tts_success != 'true' || always()
        run: |
          EXPECTED_AUDIO="data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo.mp3"

          if [ ! -f "$EXPECTED_AUDIO" ]; then
            echo "::error::TTS audio file not generated at $EXPECTED_AUDIO"
            echo "::error::No audio file exists - cannot proceed with video render"
            echo "tts_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          if ! ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$EXPECTED_AUDIO" > /tmp/tts_duration.txt 2>&1; then
            echo "::error::TTS audio file is not valid/parsable"
            echo "tts_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          DURATION=$(cat /tmp/tts_duration.txt)
          echo "[tts] TTS audio verified: $DURATION seconds"

          if [ "$(echo "$DURATION < 5" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "::error::TTS audio duration ($DURATION seconds) is too short - likely silent or corrupted"
            echo "tts_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          SRT_FILE="data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo.srt"
          if [ ! -f "$SRT_FILE" ]; then
            echo "::warning::SRT file not generated, but audio file is valid"
          else
            echo "[tts] SRT file verified: $SRT_FILE"
          fi

          cp "data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo.mp3" "data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo.mp3"
          cp "data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo.srt" "data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo.srt"
          cp "data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo-words.json" "data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo-words.json"

          echo "tts_failed=false" >> $GITHUB_OUTPUT

      - name: Upload TTS Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-${{ env.CHANNEL_ID }}
          path: |
            data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo.mp3
            data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo.mp3
            data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo.srt
            data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo.srt
            data/tts/${{ env.CHANNEL_ID }}/${{ env.TTS_TOPIC }}-vo-words.json
            data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo-words.json
          retention-days: 30

  build-timeline:
    name: Build Visual Timeline
    needs: [setup, source-historical-images, generate-narration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDITOR_ENGINE: "1"
      EDITOR_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund 2>/dev/null || npm install)

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Download TTS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tts-audio-${{ env.CHANNEL_ID }}
          path: data/tts/${{ env.CHANNEL_ID }}

      - name: Download Historical Images
        uses: actions/download-artifact@v4
        with:
          name: historical-images-${{ env.CHANNEL_ID }}
          path: data/editor/assets/${{ env.CHANNEL_ID }}

      - name: Build Coverage Timeline
        run: |
          echo "[timeline] Building timeline for ${{ env.STEM }} with curated visual pack"
          node scripts/editor/auto-timeline.mjs \
            --channel "${{ env.CHANNEL_ID }}" \
            --script "${{ env.SCRIPT_PATH }}" \
            --visual-pack "${{ env.VISUAL_PACK }}" \
            --github-env 2>&1

          echo "=== Timeline Files ==="
          ls -la data/editor/auto/${{ env.TTS_TOPIC }}/ 2>/dev/null || echo "No timeline directory created"

      - name: Generate Visual Reports
        run: |
          echo "[reports] Building narration-to-visual mapping and repetition reports"
          node scripts/editor/visual-reports.mjs \
            --plan data/editor/auto/${{ env.TTS_TOPIC }}/plan.json \
            --manifest "${{ env.VISUAL_PACK }}" \
            --out-dir data/editor/auto/${{ env.TTS_TOPIC }}

          echo "=== Report Files ==="
          ls -la data/editor/auto/${{ env.TTS_TOPIC }}/visual-repetition-report.json \
            data/editor/auto/${{ env.TTS_TOPIC }}/narration-visual-mapping.json \
            data/editor/auto/${{ env.TTS_TOPIC }}/visual-repetition-report.md \
            data/editor/auto/${{ env.TTS_TOPIC }}/narration-visual-mapping.md 2>/dev/null

      - name: Validate Timeline
        run: |
          TL="data/editor/auto/${{ env.TTS_TOPIC }}/timeline.json"
          if [ -f "$TL" ]; then
            echo "[timeline] Timeline structure:"
            node -e "
              import { readFileSync } from 'fs';
              const tl = JSON.parse(readFileSync('$TL'));
              console.log('Duration:', tl.durationInFrames, 'frames');
              console.log('Layers:', tl.layers?.length || 0);
              console.log('Assets:', Object.keys(tl.assets || {}).length);
              console.log('Captions:', tl.captions?.length || 0);
              console.log('Visual pack:', JSON.stringify(tl.visual_pack));
            "
          else
            echo "::error::Timeline file not found at $TL"
            exit 1
          fi

      - name: Upload Timeline + Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-${{ env.CHANNEL_ID }}
          path: |
            data/editor/auto/${{ env.TTS_TOPIC }}/plan.json
            data/editor/auto/${{ env.TTS_TOPIC }}/timeline.json
            data/editor/auto/${{ env.TTS_TOPIC }}/transcript.json
            data/editor/auto/${{ env.TTS_TOPIC }}/visual-repetition-report.json
            data/editor/auto/${{ env.TTS_TOPIC }}/narration-visual-mapping.json
            data/editor/auto/${{ env.TTS_TOPIC }}/visual-repetition-report.md
            data/editor/auto/${{ env.TTS_TOPIC }}/narration-visual-mapping.md
            data/editor/auto/${{ env.TTS_TOPIC }}/card-*.svg
          retention-days: 30

  render-video:
    name: Render Video (Remotion)
    needs: [setup, build-timeline, source-historical-images, generate-narration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REMOTION_CHROME_PATH: /usr/bin/google-chrome
      EDITOR_COVERAGE: "1"
      EDITOR_ENGINE: "1"
      EDITOR_STRICT: "1"
      RENDER_CONCURRENCY: "2"
      RENDER_CRF: "20"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache and Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund 2>/dev/null || npm install)

      - name: Install System Tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg python-is-python3
          fi
          ffmpeg -version | head -1

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Download TTS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tts-audio-${{ env.CHANNEL_ID }}
          path: data/tts/${{ env.CHANNEL_ID }}

      - name: Download Timeline Artifacts
        uses: actions/download-artifact@v4
        with:
          name: timeline-${{ env.CHANNEL_ID }}
          path: data/editor/auto/${{ env.TTS_TOPIC }}

      - name: Download Historical Images
        uses: actions/download-artifact@v4
        with:
          name: historical-images-${{ env.CHANNEL_ID }}
          path: data/editor/assets/${{ env.CHANNEL_ID }}

      - name: Render Video
        run: |
          TL="data/editor/auto/${{ env.TTS_TOPIC }}/timeline.json"
          AUDIO="data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo.mp3"
          OUT="data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4"

          mkdir -p "$(dirname "$OUT")"

          if [ ! -f "$AUDIO" ]; then
            echo "::error::Audio file not found: $AUDIO"
            exit 1
          fi

          echo "[render] Starting render..."
          echo "[render] Timeline: $TL"
          echo "[render] Audio: $AUDIO"
          echo "[render] Output: $OUT"

          node --input-type=module -e "
            import { renderEditor } from './src/skills/remotion-render/render-editor.js';
            try {
              await renderEditor({
                timelinePath: '$TL',
                audioPath: '$AUDIO',
                outputPath: '$OUT',
                scale: 1
              });
              console.log('[render] Video rendered successfully');
            } catch (e) {
              console.error('[render] Render failed:', e.message);
              process.exit(1);
            }
          "

      - name: Verify Rendered Video
        run: |
          if [ -f "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4" ]; then
            SIZE=$(stat -c%s "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4")
            echo "✓ Video file exists: $SIZE bytes"

            ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height -of json data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4 | jq '.'
          else
            echo "::error::Video was not rendered"
            exit 1
          fi

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ env.CHANNEL_ID }}
          path: data/renders/${{ env.CHANNEL_ID }}/
          retention-days: 30

  run-quality-assurance:
    name: Technical Quality Assurance
    needs: [render-video, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download TTS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tts-audio-${{ env.CHANNEL_ID }}
          path: data/tts/${{ env.CHANNEL_ID }}

      - name: Download Timeline Artifacts
        uses: actions/download-artifact@v4
        with:
          name: timeline-${{ env.CHANNEL_ID }}
          path: data/editor/auto/${{ env.TTS_TOPIC }}

      - name: Download Rendered Video
        uses: actions/download-artifact@v4
        with:
          name: rendered-video-${{ env.CHANNEL_ID }}
          path: data/renders/${{ env.CHANNEL_ID }}

      - name: Download Historical Images
        uses: actions/download-artifact@v4
        with:
          name: historical-images-${{ env.CHANNEL_ID }}
          path: data/editor/assets/${{ env.CHANNEL_ID }}

      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg jq
          fi
          ffmpeg -version | head -1

      - name: Run Video QA
        run: |
          TL="data/editor/auto/${{ env.TTS_TOPIC }}/timeline.json"
          VID="data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4"
          OUT="data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-qa.json"
          CONTACT="data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-contact.jpg"
          FRAMES="data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-frames"

          if [ -f "$VID" ] && [ -f "$TL" ]; then
            node scripts/editor/video-qa.js --video "$VID" --timeline "$TL" --out "$OUT" --contact "$CONTACT" --frames "$FRAMES"
          else
            echo "::error::Skipping QA - video or timeline not found"
            exit 1
          fi

      - name: Display QA Results
        run: |
          if [ -f "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-qa.json" ]; then
            echo "=== QA Results ==="
            cat data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-qa.json | jq '.'
          fi

      - name: Upload QA + Contact Sheet Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-and-contact-${{ env.CHANNEL_ID }}
          path: |
            data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-qa.json
            data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-contact.jpg
          retention-days: 30

  publish-preparation:
    name: Prepare for Review
    needs: [render-video, run-quality-assurance, source-historical-images, build-timeline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all review artifacts
        run: |
          mkdir -p .cache/review-artifacts

      - name: Download Historical Images
        uses: actions/download-artifact@v4
        with:
          name: historical-images-${{ env.CHANNEL_ID }}
          path: data/editor/assets/${{ env.CHANNEL_ID }}

      - name: Download Timeline + Reports
        uses: actions/download-artifact@v4
        with:
          name: timeline-${{ env.CHANNEL_ID }}
          path: data/editor/auto/${{ env.TTS_TOPIC }}

      - name: Download Rendered Video
        uses: actions/download-artifact@v4
        with:
          name: rendered-video-${{ env.CHANNEL_ID }}
          path: data/renders/${{ env.CHANNEL_ID }}

      - name: Download QA + Contact Sheet
        uses: actions/download-artifact@v4
        with:
          name: qa-and-contact-${{ env.CHANNEL_ID }}
          path: data/renders/${{ env.CHANNEL_ID }}

      - name: Download TTS Audio
        uses: actions/download-artifact@v4
        with:
          name: tts-audio-${{ env.CHANNEL_ID }}
          path: data/tts/${{ env.CHANNEL_ID }}

      - name: Collect review package
        run: |
          mkdir -p .cache/review-artifacts

          # Video
          if [ -f "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4" ]; then
            cp "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4" .cache/review-artifacts/
          fi

          # Contact sheet + QA
          if [ -f "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-contact.jpg" ]; then
            cp "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-contact.jpg" .cache/review-artifacts/
          fi
          if [ -f "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-qa.json" ]; then
            cp "data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-qa.json" .cache/review-artifacts/
          fi

          # Historical images + provenance
          if [ -d "data/editor/assets/${{ env.CHANNEL_ID }}" ]; then
            cp -r "data/editor/assets/${{ env.CHANNEL_ID }}" .cache/review-artifacts/historical-images
          fi

          # Timeline + reports
          if [ -d "data/editor/auto/${{ env.TTS_TOPIC }}" ]; then
            cp -r "data/editor/auto/${{ env.TTS_TOPIC }}" .cache/review-artifacts/timeline
          fi

          # TTS audio + word timings
          if [ -f "data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo.mp3" ]; then
            cp "data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo.mp3" .cache/review-artifacts/
          fi
          if [ -f "data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo-words.json" ]; then
            cp "data/tts/${{ env.CHANNEL_ID }}/${{ env.STEM }}-vo-words.json" .cache/review-artifacts/
          fi

          # Thumbnail (committed to the repo, checked out above)
          if [ -f "data/thumbnails/${{ env.CHANNEL_ID }}/${{ env.STEM }}-thumb.png" ]; then
            cp "data/thumbnails/${{ env.CHANNEL_ID }}/${{ env.STEM }}-thumb.png" .cache/review-artifacts/
            cp "data/thumbnails/${{ env.CHANNEL_ID }}/${{ env.STEM }}-thumb-spec.json" .cache/review-artifacts/ 2>/dev/null || true
          fi

          echo "=== Review Artifacts ==="
          ls -laR .cache/review-artifacts/

      - name: Generate Review Summary
        run: |
          cat > .cache/review-artifacts/REVIEW_SUMMARY.md << 'EOF'
          # Hidden Past Video Review Package

          ## Produced by GitHub Actions
          - Workflow: .github/workflows/channel-production-1.yml
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Date: ${{ github.event.head_commit.timestamp }}

          ## Contents
          ```
          $(ls -laR .cache/review-artifacts/ 2>/dev/null || echo "Files collected")
          ```

          ## Deliverables
          - MP4: ${{ env.STEM }}-rework.mp4 (9:16 cinematic Short)
          - Thumbnail: ${{ env.STEM }}-thumb.png
          - Narration audio: ${{ env.STEM }}-vo.mp3 (real EdgeTTS)
          - Historical images + provenance-manifest.json + ATTRIBUTIONS.md
          - Timeline JSON: plan.json + timeline.json
          - Technical QA: *-qa.json + contact sheet
          - Narration-to-visual mapping: narration-visual-mapping.json / .md
          - Visual repetition report: visual-repetition-report.json / .md

          ## Next Review Steps
          1. Verify historical images are correctly sourced and licensed
          2. Check people-focused imagery (75% target)
          3. Review narration-to-visual alignment
          4. Check contact sheet for visual variety
          5. Confirm no repeated images

          ## Technical Status
          - Rendered: ${{ env.STEM }}-rework.mp4
          - Duration: Check QA report
          - Format: 1080x1920, H.264/AAC
          EOF

          cat .cache/review-artifacts/REVIEW_SUMMARY.md

      - name: Upload Review Package
        uses: actions/upload-artifact@v4
        with:
          name: review-package-${{ env.CHANNEL_ID }}-${{ github.run_number }}
          path: .cache/review-artifacts/
          retention-days: 30

  publish-private:
    name: Upload to YouTube (Private)
    needs: publish-preparation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download Rendered Video
        uses: actions/download-artifact@v4
        with:
          name: rendered-video-${{ env.CHANNEL_ID }}
          path: data/renders/${{ env.CHANNEL_ID }}

      - name: Download Timeline + Reports
        uses: actions/download-artifact@v4
        with:
          name: timeline-${{ env.CHANNEL_ID }}
          path: data/editor/auto/${{ env.TTS_TOPIC }}

      - name: Materialize OAuth credentials from secrets
        id: creds-materialize
        env:
          CHANNEL_ID_NUM: ${{ env.CHANNEL_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            const id = process.env.CHANNEL_ID_NUM;
            let ch;
            try { ch = resolveChannel(id); } catch (e) { console.error('::error::' + e.message); process.exit(1); }
            const publishSet = JSON.parse(fs.readFileSync('config/priority-channels.json', 'utf8')).channels.map(String);
            if (!publishSet.includes(id)) {
              console.log('::notice::channel ' + id + ' is not in config/priority-channels.json: upload skipped');
              process.exit(0);
            }
            const own = 'config/creds/' + ch.channel_id + '.json';
            const declared = ch.youtube_credentials_path || own;
            if (declared !== own) { console.error('::error::channel ' + id + ' declares ' + declared + ', not its own credentials file ' + own); process.exit(1); }
            const n = String(ch.channel_id).replace(/^ch-0*/, '').padStart(2, '0');
            const clientId = process.env['CH' + n + '_CLIENT_ID'];
            const clientSecret = process.env['CH' + n + '_CLIENT_SECRET'];
            const refreshToken = process.env['CH' + n + '_REFRESH_TOKEN'];
            if (!(clientId && clientSecret && refreshToken)) {
              console.log('::warning::No credentials configured for ' + ch.channel_id + ' — upload skipped');
              process.exit(0);
            }
            fs.mkdirSync('config/creds', { recursive: true });
            fs.writeFileSync(own, JSON.stringify({client_id:clientId, client_secret:clientSecret, refresh_token:refreshToken}, null, 2));
            console.log('Credentials materialized for ' + ch.channel_id + ' (dispatch key ' + id + ')');
            process.exit(0);
          "

      - name: Check Credentials and Channel Identity
        id: creds
        run: |
          node -e "
            const fs = require('fs');
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            const id = '${{ env.CHANNEL_ID }}';
            let ch;
            try { ch = resolveChannel(id); } catch (e) { console.error('::error::' + e.message); process.exit(1); }
            const own = 'config/creds/' + ch.channel_id + '.json';
            if (!fs.existsSync(own)) {
              console.log('::warning::No credentials for ' + ch.channel_id + ' — upload skipped, video stays in review package');
              console.log('upload=skipped');
              process.exit(0);
            }
            const creds = JSON.parse(fs.readFileSync(own, 'utf8'));
            if (!(creds.client_id && creds.client_secret && creds.refresh_token)) {
              console.log('::warning::Incomplete credentials for ' + ch.channel_id + ' — upload skipped');
              console.log('upload=skipped');
              process.exit(0);
            }
            console.log('Credentials verified for ' + ch.channel_name + ' (' + ch.channel_id + ')');
            console.log('upload=ready');
          "

      - name: Upload to YouTube (Private)
        if: steps.creds.outputs.upload == 'ready'
        run: |
          MP4="data/renders/${{ env.CHANNEL_ID }}/${{ env.STEM }}-rework.mp4"
          if [ ! -f "$MP4" ]; then
            echo "::error::No MP4 found to upload"
            exit 1
          fi
          # Read title from timeline or use stem
          TITLE=$(node -e "const t=require('./data/editor/auto/${{ env.TTS_TOPIC }}/plan.json'); console.log(t.title||'${{ env.STEM }}')")
          node scripts/youtube-upload.cjs --file "$MP4" --title "$TITLE" --channel ${{ env.CHANNEL_ID }}
          echo "✓ Private upload complete for ${{ env.CHANNEL_ID }}"

      - name: Record Upload Result
        if: always()
        run: |
          echo "## Private Upload Status" >> $GITHUB_STEP_SUMMARY
          echo "- Channel: ${{ env.CHANNEL_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- Video: ${{ env.STEM }}-rework.mp4" >> $GITHUB_STEP_SUMMARY
          echo "- Visibility: private (owner must publish manually)" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY



