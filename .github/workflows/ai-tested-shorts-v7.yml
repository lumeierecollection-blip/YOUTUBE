name: AI Tested Shorts V7 - Reference-led render

# Heavy rendering runs on GitHub. Reference standard: data/ai-tested/production-v7/reference/REFERENCE-ANALYSIS.md.
# mode=stills renders a half-scale preview and dense contact sheets for review (never a deliverable).
# mode=full renders the final 1080x1920 files, masters audio and writes QA reports. Nothing here swallows a failure.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'stills (half-scale preview + contact sheets) or full (final render + QA)'
        required: true
        default: 'stills'
        type: choice
        options: [stills, full]
      only_ids:
        description: 'Comma list of video ids (blank = all of 21-25)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ai-tested-shorts-v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      V5: data/ai-tested/shorts-v5
      STILLS_ONLY: ${{ inputs.mode == 'stills' && '1' || '0' }}
      ONLY_IDS: ${{ inputs.only_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libpango-1.0-0 libcairo2 fonts-dejavu-core

      - name: Install Remotion
        working-directory: ${{ env.V5 }}/render
        run: |
          set -euo pipefail
          npm install
          npx remotion browser ensure

      - name: Licensed audio library
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          python fetch-audio.py
          ls -la assets/music assets/sfx2 assets/ambience

      - name: Build and validate timed plans
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          mkdir -p logs
          PLAN_ONLY=1 node render7.mjs 2>&1 | tee logs/plan7.log

      - name: Render
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          node render7.mjs 2>&1 | tee logs/render7.log

      - name: Dense contact sheets and beat stills (preview mode)
        if: ${{ inputs.mode == 'stills' }}
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          mkdir -p qa-preview
          for f in out-preview/*.mp4; do
            base=$(basename "$f" .mp4)
            ffmpeg -hide_banner -loglevel error -y -i "$f" -vf "fps=2,scale=330:-1,tile=6x2" -q:v 3 "qa-preview/${base}.sheet-%02d.jpg"
          done
          ls -la qa-preview

      - name: Verify final files (full mode)
        if: ${{ inputs.mode == 'full' }}
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          for f in out/*.mp4; do
            echo "== $f"
            ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,duration:format=duration -of default=nw=1 "$f"
            ffmpeg -v error -i "$f" -f null - 
            sha256sum "$f" | tee -a out/SHA256SUMS.txt
          done

      - name: Upload render
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-tested-shorts-v7-${{ inputs.mode }}
          overwrite: true
          path: |
            ${{ env.V5 }}/out/*
            ${{ env.V5 }}/out-preview/*
            ${{ env.V5 }}/qa-preview/*
            ${{ env.V5 }}/plans-timed/*.plan7.json
            ${{ env.V5 }}/logs/*
          if-no-files-found: warn
          retention-days: 21
