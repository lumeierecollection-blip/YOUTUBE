# YouTube Automation ΓÇö Daily Pipeline (v2)
#
# Scope: ONLY the channels in config/priority-channels.json (currently 1, 2, 48).
# Other channels are deferred until that file changes.
#
#   setup   -> channel matrix from config/priority-channels.json
#   channel -> per channel, .github/workflows/channel-pipeline.yml:
#              prep   (Discover -> Reserve -> Research -> Script -> TTS -> Thumbnail -> SEO)
#              render (Plan -> Render -> gates -> Publish (private)), needs only ITS OWN prep
#
# Budget: every job's timeout is the dispatch input timeout_minutes (default
# 90 ΓÇö the daily schedule uses the default, so production gets the full
# budget; a manual iteration can pass 20). Each model call is capped at a share of it (JOB_TIMEOUT_MIN in
# scripts/ollama-client.cjs: plan 40%, challenger 15%, vision 20%). Every model call goes to Gemini
# first and to local Ollama when Gemini cannot answer (src/lib/llm.js), and a
# 7B / 3B model on a CPU runner needs far more than 18 minutes; a render that
# Gemini answers still finishes in ~10-15 min. Concurrency cancels an older
# run on the same ref, so runs never pile up.

name: Daily Pipeline ΓÇö Optimized v2

on:
  # schedule: HUMAN-REVIEW POSTING, enabled 2026-10-13. Policy changed: the
  # pipeline no longer waits for a green board. It uploads whatever passes as
  # PRIVATE and the owner clicks Publish in Studio. Previously "held until most
  # channels are green", which held posting at zero for the whole life of the
  # project: every gate is a stop, and nothing had ever reached approved/.
  #
  # Nothing goes public from this schedule. review-publish uploads
  # approved-review/ as private (line ~1435: "Publishing approved-review videos
  # of run N ... (private)"); only the owner publishes.
  #
  # 08:15 UTC, not 06:00: the Gemini free-tier daily quota resets at midnight
  # Pacific (07:00 UTC in summer, 08:00 UTC in winter). At 06:00 the run shared
  # the PREVIOUS quota day with any board run that day, and on 2026-10-16 every
  # key was spent: props, beat checks and scripts all fell to the 3B fallback.
  # 08:15 is after the reset in both seasons, so the daily run always starts
  # on a full quota whatever was run by hand the day before.
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render, but no publish)"
        type: boolean
        default: false
      channels:
        description: "Comma-separated channel IDs ΓÇö must be priority channels"
        type: string
        default: "1,2,48"
      render_only:
        description: "DEBUG: skip discover/research/script; render the channel's latest committed script (never publishes)"
        type: boolean
        default: false
      timeout_minutes:
        description: "Every job's timeout in minutes (90 = default/production, room for the local-model fallback; 20 = fast iteration)"
        type: string
        default: "90"
      force_planner:
        description: "'ollama' = answer EVERY model call with local Ollama; Gemini is never called (the fallback test)"
        type: string
        default: ""
      publish:
        description: "PUBLISH ONLY: upload the approved-review videos of run review_run_id (private) for `channels`; nothing is rendered"
        type: boolean
        default: false
      review_run_id:
        description: "With publish: the pipeline run whose approved-review videos to upload"
        type: string
        default: ""
      hold_public:
        description: "Skip process-queue: nothing is flipped public by this run (uploads stay private)"
        type: boolean
        default: false
      eval_loop_mode:
        description: 'Eval loop mode: off (default), dry (decide and record), live (act)'
        required: false
        default: 'off'
        # type: string, not choice: GitHub's dispatch API rejected the default
        # ('off') against the allowed-values list even with options declared, so the
        # dropdown never dispatched. evalLoopMode() throws on any value outside
        # off/dry/live and is unit-tested for exactly that, so validation lives there.
        type: string
      ollama_first:
        description: "Ask Ollama Cloud FIRST in every model chain (planner, props, image checks, frame review); Gemini becomes the fallback. Needs the OLLAMA_API_KEY secret."
        type: boolean
        default: false

concurrency:
  group: daily-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # Eval loop mode. Default off; the schedule trigger leaves inputs empty, which
  # evalLoopMode() reads as "off", so cron never enters the loop.
  EVAL_LOOP_MODE: ${{ inputs.eval_loop_mode }}
  PYTHON_VERSION: "3.11"
  OLLAMA_MODEL: "qwen2.5:3b"
  OLLAMA_URL: "http://127.0.0.1:11434"
  # Ollama Cloud (ollama.com hosted models, owner 2026-10-17): the second provider after Gemini in src/lib/llm.js, the image verifiers and the
  # script/research runner ("ollama-cloud/<model>" specs below). Empty secret = skipped at once, the chain is unchanged.
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  # ollama_first (dispatch input): scripts/ollama-client.cjs ollamaFirst() puts Ollama Cloud ahead of Gemini everywhere. Empty on the cron = off.
  OLLAMA_FIRST: ${{ inputs.ollama_first && '1' || '' }}
  # Ollama's default context is 4096 tokens; the research/script prompts are
  # longer, and a truncated prompt is how llama3.2 ended up answering
  # "To print Hello World in PythonΓÇª". opencode.json declares 16384 to match.
  OLLAMA_CONTEXT_LENGTH: "16384"
  OPENCODE_MODELS_RESEARCH: "ollama-cloud/gpt-oss:120b,ollama/qwen2.5:3b"
  OPENCODE_MODELS_REASONING: "ollama-cloud/gpt-oss:120b,ollama/qwen2.5:3b"
  OPENCODE_MODELS: "ollama/qwen2.5:3b"
  OPENCODE_ENABLE_EXA: "1"
  PREP_CALL_TIMEOUT_S: "300"
  RENDER_SCALE: "0.75"
  RENDER_CONCURRENCY: "4"

jobs:
  # ============================================================
  # SETUP: channel matrix from config/priority-channels.json
  # ============================================================
  setup:
    # A publish dispatch renders nothing: setup (and so prep) is skipped; render, preview and
    # log-results check the same input.
    if: github.event.inputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '90') }}
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: channels
        name: Build channel matrix
        env:
          # The dispatch INPUT. 8f18b76d's blanket replace pointed this at steps.target (a step of the review-publish job, absent here), so a dispatch's
          # channel list was always empty and every priority channel ran (run 39012478515: channels=26 started all ten). Schedule events have no inputs -> priority set.
          REQUESTED: ${{ github.event.inputs.channels }}
        run: |
          MATRIX=$(node -e "
            const fs = require('fs');
            const priority = JSON.parse(fs.readFileSync('config/priority-channels.json', 'utf-8')).channels.map(String);
            const req = (process.env.REQUESTED || '').split(',').map(s => s.trim().replace(/^ch-?/i, '').replace(/^0+/, '')).filter(Boolean);
            const ids = req.length ? req : priority;
            const notPriority = ids.filter(id => !priority.includes(id));
            if (notPriority.length) {
              console.error('Not priority channels: ' + notPriority.join(',') + ' (priority: ' + priority.join(',') + ')');
              process.exit(1);
            }
            console.log(JSON.stringify({ include: ids.map(id => ({ channel_id: id })) }));
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Channels in this run: $MATRIX"

      # THE SFX JUDGE RUNS ONCE PER BOARD, HERE (owner, 2026-10-10). It ran in every channel's render job; the runner cache has a static key, so the
      # verdicts never came back, and every channel re-sent three recordings to the audio judge (nine calls per channel). The judge needs the
      # recordings, so it fetches them first. Verdicts reach the render jobs as an artifact (a matrix job checks out the run's starting commit, not a
      # commit made during the run) and the repository, so the next board starts from them.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch CC0 SFX (once per board)
        continue-on-error: true
        run: node scripts/sfx-cc0.mjs fetch
      - name: Judge SFX once per board (recorded or robotic)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: node scripts/sfx-cc0.mjs judge
      - name: Commit SFX verdicts to the branch
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          git config user.name "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/sfx/verdicts.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "SFX verdicts unchanged"; exit 0; fi
          git commit -m "sfx: verdicts (run ${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
            git fetch -q origin "${{ github.ref_name }}" && git rebase -q "origin/${{ github.ref_name }}" || git rebase --abort
            sleep $((attempt * 3))
          done
      - name: Upload SFX verdicts (for the render jobs)
        uses: actions/upload-artifact@v4
        with:
          name: sfx-verdicts
          path: data/sfx/verdicts.json
          if-no-files-found: warn
          retention-days: 2

  # ============================================================
  # PER CHANNEL: prep -> render (.github/workflows/channel-pipeline.yml)
  # ============================================================
  # One reusable-workflow call per channel, so a channel renders as soon as ITS prep ends
  # instead of waiting for every channel's prep (audit 2026-10-22 #6). The matrix, max-parallel
  # and fail-fast that were on prep and render are here, unchanged.
  channel:
    needs: setup
    if: github.event.inputs.publish != 'true'
    # The called jobs ask for contents: write (topic/script/queue commits); a called workflow can
    # only narrow the caller's token, so the caller grants exactly that.
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 6
      fail-fast: false
    uses: ./.github/workflows/channel-pipeline.yml
    with:
      channel_id: ${{ matrix.channel_id }}
    secrets: inherit
  # ============================================================
  # REVIEW-PUBLISH (manual only): upload a past run's approved-review
  # videos, PRIVATE, to the six publish channels. Never on cron ΓÇö the
  # schedule event has no inputs, so this `if` is false there. Replaces
  # the deprecated review-publish workflow (.github/workflows-deprecated/).
  #   gh workflow run daily-pipeline-v2.yml --ref main \
  #     -f publish=true -f review_run_id=<run> -f channels=44
  # ============================================================
  review-publish:
    # THE CRON REACHES THIS JOB. It used to require
    # `github.event_name == 'workflow_dispatch' && inputs.publish == 'true'`, the
    # only gate in the workflow keyed on event_name, so a SCHEDULE event skipped
    # it outright: the 06:00 cron rendered every day and uploaded nothing, ever.
    #
    # A schedule has no inputs, so the two things this job needs come from the
    # run itself: the channel from the matrix, and the review run id from
    # github.run_id (this run's own artifacts, which is where a daily run's
    # queues are). A dispatch still takes both from inputs, unchanged - note
    # render is skipped when inputs.publish == 'true', so a dispatch publish
    # deliberately re-publishes an EARLIER run rather than running one.
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')) }}
    needs: [setup, channel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve what to publish
        id: target
        env:
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          # The RAW inputs, read from the event. These must NOT point at this
          # step's own outputs: 468e0531 did that with a blanket search-and-
          # replace, so RUN and CHANNELS resolved to their own empty output and
          # the publish step failed with "no channels given" on a dispatch that
          # had passed both flags correctly. Only steps DOWNSTREAM read the outputs.
          REQUESTED: ${{ github.event.inputs.channels }}
          INPUT_RUN: ${{ github.event.inputs.review_run_id }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # One source of truth for the two things every later step needs.
          if [ "$IS_SCHEDULE" = "true" ]; then
            # A daily run publishes what THIS run just produced. Its channels are
            # the priority set the render job was given; there are no inputs.
            RUN="$THIS_RUN"
            CHANNELS=$(node -e "console.log(require('./config/priority-channels.json').channels.join(','))")
            echo "SCHEDULE event: publishing this run's approved-review videos (run $RUN) for channels $CHANNELS"
          else
            RUN="$INPUT_RUN"
            CHANNELS="$REQUESTED"
            echo "DISPATCH event: publishing run $RUN for channels $CHANNELS"
          fi
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"

      - name: Check inputs (approved channels only)
        env:
          REQUESTED: ${{ steps.target.outputs.channels }}
          REVIEW_RUN: ${{ steps.target.outputs.run_id }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          node -e "
            const PUBLISH_CHANNELS = require('./config/priority-channels.json').channels.map(Number);
            const ids = (process.env.REQUESTED || '').split(',').map(s => s.trim().replace(/^ch-?/i, '')).filter(Boolean).map(Number);
            const bad = ids.filter(id => !PUBLISH_CHANNELS.includes(id));
            if (!ids.length) { console.error('::error::no channels given'); process.exit(1); }
            if (bad.length) { console.error('::error::not a publish channel: ' + bad.join(', ') + ' ΓÇö uploads are allowed only to ' + PUBLISH_CHANNELS.join(', ')); process.exit(1); }
            if (!/^[0-9]+$/.test(process.env.REVIEW_RUN || '')) { console.error('::error::review_run_id must be the numeric id of a pipeline run'); process.exit(1); }
            console.log('Publishing approved-review videos of run ' + process.env.REVIEW_RUN + ' for channel(s) ' + ids.join(', ') + ' (private)');
          "

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # qa-queues-* holds approved/, approved-review/, rejected/ (artifact root data/renders/).
      - name: Download the run's review queues
        uses: actions/download-artifact@v4
        with:
          pattern: qa-queues-*-${{ steps.target.outputs.run_id }}
          path: data/renders/
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # data/renders/<ch>/ (image credits, needed for CC-BY attribution in the description).
      - name: Download the run's render folders
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: rendered-*-${{ steps.target.outputs.run_id }}
          path: .
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # SEO metadata + thumbnails. prep-* artifacts are kept 1 day: after that this step finds
      # nothing and run.js uploads with the channel's fallback title (it logs a WARNING).
      - name: Download the run's prep folders (SEO, thumbnails)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: prep-*-${{ steps.target.outputs.run_id }}
          path: data/
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize OAuth credentials
        id: creds
        env:
          REQUESTED: ${{ steps.target.outputs.channels }}
          CH01_CLIENT_ID:       ${{ secrets.CHANNEL_01_CLIENT_ID }}
          CH01_CLIENT_SECRET:   ${{ secrets.CHANNEL_01_CLIENT_SECRET }}
          CH01_REFRESH_TOKEN:   ${{ secrets.CHANNEL_01_REFRESH_TOKEN }}
          CH02_CLIENT_ID:       ${{ secrets.CHANNEL_02_CLIENT_ID }}
          CH02_CLIENT_SECRET:   ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
          CH02_REFRESH_TOKEN:   ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
          CH09_CLIENT_ID:       ${{ secrets.CHANNEL_09_CLIENT_ID }}
          CH09_CLIENT_SECRET:   ${{ secrets.CHANNEL_09_CLIENT_SECRET }}
          CH09_REFRESH_TOKEN:   ${{ secrets.CHANNEL_09_REFRESH_TOKEN }}
          CH26_CLIENT_ID:       ${{ secrets.CHANNEL_26_CLIENT_ID }}
          CH26_CLIENT_SECRET:   ${{ secrets.CHANNEL_26_CLIENT_SECRET }}
          CH26_REFRESH_TOKEN:   ${{ secrets.CHANNEL_26_REFRESH_TOKEN }}
          CH44_CLIENT_ID:       ${{ secrets.CHANNEL_44_CLIENT_ID }}
          CH44_CLIENT_SECRET:   ${{ secrets.CHANNEL_44_CLIENT_SECRET }}
          CH44_REFRESH_TOKEN:   ${{ secrets.CHANNEL_44_REFRESH_TOKEN }}
          CH05_CLIENT_ID:       ${{ secrets.CHANNEL_05_CLIENT_ID }}
          CH05_CLIENT_SECRET:   ${{ secrets.CHANNEL_05_CLIENT_SECRET }}
          CH05_REFRESH_TOKEN:   ${{ secrets.CHANNEL_05_REFRESH_TOKEN }}
          CH06_CLIENT_ID:       ${{ secrets.CHANNEL_06_CLIENT_ID }}
          CH06_CLIENT_SECRET:   ${{ secrets.CHANNEL_06_CLIENT_SECRET }}
          CH06_REFRESH_TOKEN:   ${{ secrets.CHANNEL_06_REFRESH_TOKEN }}
          CH08_CLIENT_ID:       ${{ secrets.CHANNEL_08_CLIENT_ID }}
          CH08_CLIENT_SECRET:   ${{ secrets.CHANNEL_08_CLIENT_SECRET }}
          CH08_REFRESH_TOKEN:   ${{ secrets.CHANNEL_08_REFRESH_TOKEN }}
          CH10_CLIENT_ID:       ${{ secrets.CHANNEL_10_CLIENT_ID }}
          CH10_CLIENT_SECRET:   ${{ secrets.CHANNEL_10_CLIENT_SECRET }}
          CH10_REFRESH_TOKEN:   ${{ secrets.CHANNEL_10_REFRESH_TOKEN }}
          CH49_CLIENT_ID:       ${{ secrets.CHANNEL_49_CLIENT_ID }}
          CH49_CLIENT_SECRET:   ${{ secrets.CHANNEL_49_CLIENT_SECRET }}
          CH49_REFRESH_TOKEN:   ${{ secrets.CHANNEL_49_REFRESH_TOKEN }}
          CH48_CLIENT_ID:       ${{ secrets.CHANNEL_48_CLIENT_ID }}
          CH48_CLIENT_SECRET:   ${{ secrets.CHANNEL_48_CLIENT_SECRET }}
          CH48_REFRESH_TOKEN:   ${{ secrets.CHANNEL_48_REFRESH_TOKEN }}
          
        # A channel with no OAuth secrets is SKIPPED with a warning, not fatal: exiting on the first one stopped the whole upload, so the 2026-10-16
        # cron (run 38890511624) uploaded nothing for 1/2/9/26/44, which have secrets, because ch-49 (6th in the list) has none.
        run: |
          mkdir -p config/creds
          # Same resolution as the render job: the key is the upload slot, resolved through
          # channel-lookup, never by config id. A row pointing at another channel's credentials
          # file is skipped with a warning, as is a row with no secrets.
          node -e "
            const fs = require('fs');
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            const ok = [];
            for (const id of process.env.REQUESTED.split(',').map(s => s.trim().replace(/^ch-?/i, '')).filter(Boolean)) {
              const n = String(Number(id));
              let ch;
              try { ch = resolveChannel(n); } catch (e) { console.log('::warning::' + e.message + ' - skipped'); continue; }
              const own = 'config/creds/' + ch.channel_id + '.json';
              const declared = ch.youtube_credentials_path || own;
              if (declared !== own) { console.log('::warning::channel ' + n + ' declares ' + declared + ', not its own ' + own + ' - skipped'); continue; }
              const p = String(ch.channel_id).replace(/^ch-0*/, '').padStart(2, '0');
              const c = { client_id: process.env['CH' + p + '_CLIENT_ID'], client_secret: process.env['CH' + p + '_CLIENT_SECRET'], refresh_token: process.env['CH' + p + '_REFRESH_TOKEN'] };
              if (!(c.client_id && c.client_secret && c.refresh_token)) { console.log('::warning::No credentials configured for ' + ch.channel_id + ' (dispatch key ' + n + ') - its video stays in the review queue, not uploaded'); continue; }
              fs.writeFileSync(own, JSON.stringify(c, null, 2));
              console.log('Credentials materialized for ' + ch.channel_id + ' (dispatch key ' + n + ')');
              ok.push(n);
            }
            if (!ok.length) console.log('::warning::no requested channel has credentials - nothing can be uploaded');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'channels=' + ok.join(',') + '\\n');
          "

      # run.js --review: approved-review/ only, marker must match the channel, refuses any
      # channel outside config/priority-channels.json, uploads privacyStatus "private", and
      # queues the entry cancelled so process-queue never makes it public.
      - name: Publish approved-review videos (private)
        if: steps.creds.outputs.channels != ''
        env:
          REQUESTED: ${{ steps.creds.outputs.channels }}
        run: |
          # On a SCHEDULE run the render job has already uploaded (or tried to upload) every approved/ video of this very run. Its record of
          # that is the publish-queue it pushes, and when that push failed (run 39031532519 ch-1: "cannot rebase") this job uploaded the same
          # render a second time. approved/ belongs to the render job here; this job takes approved-review/ only. A dispatch keeps both queues.
          if [ "${{ github.event_name }}" = "schedule" ]; then rm -rf data/renders/approved; echo "schedule: approved/ was the render job's to upload ΓÇö approved-review/ only"; fi
          ls -la data/renders/approved-review/ || { echo "::error::run ${{ steps.target.outputs.run_id }} has no approved-review videos (or its artifacts expired after 14 days)"; exit 1; }
          FAIL=0
          for CH in $(echo "$REQUESTED" | tr ',' ' '); do
            CH=$(echo "$CH" | sed -E 's/^ch-?//I; s/^0+//')
            # each channel's own outcome, for the digest (it reported a rejected OAuth secret as "no credentials" ΓÇö run 39031532519 ch-9/26/44)
            node src/skills/youtube-publish/run.js "$CH" --review > "/tmp/publish-out-$CH.log" 2>&1 || FAIL=1
            cat "/tmp/publish-out-$CH.log"
          done
          exit $FAIL

      # THE MORNING DIGEST. One file the owner reads each morning: what went up,
      # as PRIVATE, with a Studio link to click through and publish. Built from
      # data/publish-queue/, which review-publish has just committed and which
      # already records video_id, title, privacy_status and source_queue.
      # Written even when nothing uploaded, with the reason, so a silent morning
      # is legible rather than just empty.
      - name: Write the daily upload digest
        if: always()
        env:
          REVIEW_RUN: ${{ steps.target.outputs.run_id }}
          REQUESTED: ${{ steps.target.outputs.channels }}
        run: |
          export TODAY=$(date -u +%F)
          node -e '
            const fs = require("fs"), path = require("path");
            const TODAY = process.env.TODAY.slice(0, 10);
            const RUN = process.env.REVIEW_RUN;
            const dir = "data/publish-queue";
            const uploads = [];
            // The queues live in PER-CHANNEL folders (data/publish-queue/<ch>/publish-queue.json). The digest read only top-level files, found none, and
            // reported "Nothing was uploaded" and "no OAuth secrets" for a channel whose video had just gone up (run 38724865619, ch-2, zttQB2Wxeqc).
            const queueFiles = [];
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir)) {
                const full = path.join(dir, f);
                if (fs.statSync(full).isDirectory()) { for (const g of fs.readdirSync(full)) if (g.endsWith(".json")) queueFiles.push(path.join(full, g)); }
                else if (f.endsWith(".json")) queueFiles.push(full);
              }
            }
            {
              for (const full of queueFiles) {
                let rows = []; try { rows = JSON.parse(fs.readFileSync(full, "utf8")); } catch { continue; }
                if (!Array.isArray(rows)) continue;
                for (const e of rows) {
                  if (RUN && e.source_run && String(e.source_run) !== String(RUN)) continue;
                  if (!e.uploaded_at || String(e.uploaded_at).slice(0, 10) !== TODAY) continue;
                  uploads.push({
                    channel: e.channel_id, title: e.title, video_id: e.video_id,
                    privacy_status: e.privacy_status || "private",
                    source_queue: e.source_queue || "approved",
                    studio_link: "https://studio.youtube.com/video/" + e.video_id + "/edit",
                  });
                }
              }
            }
            uploads.sort((a, b) => String(a.channel).localeCompare(String(b.channel)));
            const requested = String(process.env.REQUESTED || "").split(",").map(s => s.trim()).filter(Boolean);
            const uploaded = (c) => uploads.some(u => String(u.channel).replace(/^0+/, "") === c.replace(/^0+/, ""));
            // What the publish step said for each channel it tried (no log = it had no credentials, so it was never tried).
            const outcome = {};
            for (const c of requested) {
              const n = c.replace(/^0+/, "");
              let log = null; try { log = fs.readFileSync("/tmp/publish-out-" + n + ".log", "utf8"); } catch {}
              if (uploaded(c)) continue;
              const err = log && (log.match(/ERROR: ([^\n]+)/) || [])[1];
              outcome[n] = !log ? "no OAuth credentials configured"
                : err ? "upload FAILED: " + err.slice(0, 160)
                : /No approved-review\/ or approved\/ renders found|No approved-review/.test(log) ? "no video passed QA this run"
                : /already uploaded as/.test(log) ? "already uploaded (" + ((log.match(/already uploaded as (\S+)/) || [])[1] || "") + ")"
                : "not uploaded (see the review-publish log)";
            }
            const noCreds = Object.keys(outcome).filter((c) => outcome[c] === "no OAuth credentials configured");
            const digest = {
              date: TODAY,
              review_run_id: RUN || null,
              generated_at: new Date().toISOString(),
              uploads,
              not_uploaded: outcome,
              no_credentials: noCreds,
              note: uploads.length
                ? "Everything above is PRIVATE. Open each Studio link and click Publish to make it public."
                : "Nothing was uploaded today ΓÇö see not_uploaded for each channel's reason.",
            };
            fs.mkdirSync("data/uploaded", { recursive: true });
            fs.writeFileSync("data/uploaded/" + TODAY + ".json", JSON.stringify(digest, null, 2) + "\n");
            console.log("digest: data/uploaded/" + TODAY + ".json ΓÇö " + uploads.length + " uploaded");
          '

      - name: Commit the daily upload digest
        if: always()
        run: |
          git config user.name  "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          TODAY=$(date -u +%F)
          git add data/uploaded
          if git diff --cached --quiet; then echo "No digest changes."; exit 0; fi
          git commit -m "uploaded: digest for $TODAY (review-publish of run ${{ steps.target.outputs.run_id }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            # downloaded artifacts (data/research, data/renders, ...) are untracked copies of files main may already hold: they block the rebase
            git clean -fdq -- data ':!data/uploaded' ':!data/publish-queue'
            git rebase --autostash "origin/${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
            if [ "$attempt" -eq 5 ]; then echo "::error::Could not push the digest"; exit 1; fi
            sleep $((attempt * 2))
          done

      - name: Commit publish queue
        if: always()
        run: |
          git config user.name  "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/publish-queue
          if git diff --cached --quiet; then echo "Publish queue unchanged."; exit 0; fi
          git commit -m "publish-queue: review-publish of run ${{ steps.target.outputs.run_id }} [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            # downloaded artifacts (data/research, data/renders, ...) are untracked copies of files main may already hold: they block the rebase
            git clean -fdq -- data ':!data/uploaded' ':!data/publish-queue'
            git rebase --autostash "origin/${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
            if [ "$attempt" -eq 5 ]; then echo "::error::Could not push the publish queue"; exit 1; fi
            sleep $((attempt * 2))
          done

  # ============================================================
  # PREVIEW: per-channel 6s clip, 8 frames, contact sheets, one
  # master sheet ΓÇö built on the runner, uploaded as one artifact.
  # Only rendered-* (MP4s + qa-counts.json) and qa-queues-* (queued
  # MP4s + verdict markers) are downloaded; prep-* is not needed.
  # ============================================================
  preview:
    needs: [channel]
    if: always() && github.event.inputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --no-install-recommends: with recommends this pulled 130 MB and a
      # slow Azure mirror ran it past the old 15-min timeout (run 36906932610).
      - name: Install ffmpeg and ImageMagick
        # fonts-dejavu-core: without recommends no font is installed and
        # montage's sheet title failed "unable to read font (null)" (run 36915319430).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg imagemagick fonts-dejavu-core

      - name: Download rendered MP4s
        uses: actions/download-artifact@v4
        with:
          pattern: rendered-*-${{ github.run_id }}
          path: data/preview/raw

      - name: Download QA queues
        uses: actions/download-artifact@v4
        with:
          pattern: qa-queues-*-${{ github.run_id }}
          path: data/preview/raw

      - name: Build preview bundle
        env:
          PREVIEW_CHANNELS: ${{ github.event.inputs.channels }}
        run: node scripts/build-preview-bundle.mjs

      - name: Upload preview bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: data/preview/bundle/
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # LOG RESULTS
  # ============================================================
  log-results:
    needs: [setup, channel]
    if: always() && github.event.inputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '90') }}
    steps:
      # Stalled-job table (scripts/jobs/stalled.mjs). Sparse checkout of the branch tip, so this run's job commits are visible.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            scripts/jobs
            data/jobs
      - name: Stalled jobs
        run: |
          { echo "### Stalled jobs"; node scripts/jobs/stalled.mjs; } >> "$GITHUB_STEP_SUMMARY" || echo "::warning::stalled.mjs failed"

      - name: Generate run report
        run: |
          echo "=== PIPELINE RUN REPORT ==="
          echo "Run ID:    ${{ github.run_id }}"
          echo "Triggered: ${{ github.event_name }}"
          echo "Dry Run:   ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Channels:  ${{ github.event.inputs.channels || 'priority set' }}"
          echo "Setup:     ${{ needs.setup.result }}"
          echo "Channels:  ${{ needs.channel.result }} (prep -> render per channel, channel-pipeline.yml)"
