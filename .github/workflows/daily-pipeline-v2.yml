# YouTube Automation ΓÇö Daily Pipeline (v2)
#
# Scope: ONLY the channels in config/run-channels.json (prepared + rendered every day). Only those in config/priority-channels.json
# (currently 1, 2, 48: working OAuth) are UPLOADED; every other run channel stops after render + QA, with no credentials needed.
# Other channels are deferred until that file changes.
#
#   setup  ΓåÆ channel matrix from config/priority-channels.json
#   prep   ΓåÆ Discover ΓåÆ Reserve ΓåÆ Research ΓåÆ Script ΓåÆ TTS ΓåÆ Thumbnail ΓåÆ SEO
#   render ΓåÆ Plan ΓåÆ Render ΓåÆ silence/duration/frame gates ΓåÆ Publish (private)
#
# Budget: every job's timeout is the dispatch input timeout_minutes (default
# 90 ΓÇö the daily schedule uses the default, so production gets the full
# budget; a manual iteration can pass 20). Each model call is capped at a share of it (JOB_TIMEOUT_MIN in
# scripts/ollama-client.cjs: plan 40%, challenger 15%, vision 20%). Every model call goes to Gemini
# first and to local Ollama when Gemini cannot answer (src/lib/llm.js), and a
# 7B / 3B model on a CPU runner needs far more than 18 minutes; a render that
# Gemini answers still finishes in ~10-15 min. Concurrency cancels an older
# run on the same ref, so runs never pile up.

name: Daily Pipeline ΓÇö Optimized v2

on:
  # schedule: HUMAN-REVIEW POSTING, enabled 2026-10-13. Policy changed: the
  # pipeline no longer waits for a green board. It uploads whatever passes as
  # PRIVATE and the owner clicks Publish in Studio. Previously "held until most
  # channels are green", which held posting at zero for the whole life of the
  # project: every gate is a stop, and nothing had ever reached approved/.
  #
  # Nothing goes public from this schedule. review-publish uploads
  # approved-review/ as private (line ~1435: "Publishing approved-review videos
  # of run N ... (private)"); only the owner publishes.
  #
  # 08:15 UTC, not 06:00: the Gemini free-tier daily quota resets at midnight
  # Pacific (07:00 UTC in summer, 08:00 UTC in winter). At 06:00 the run shared
  # the PREVIOUS quota day with any board run that day, and on 2026-10-16 every
  # key was spent: props, beat checks and scripts all fell to the 3B fallback.
  # 08:15 is after the reset in both seasons, so the daily run always starts
  # on a full quota whatever was run by hand the day before.
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render, but no publish)"
        type: boolean
        default: false
      channels:
        description: "Comma-separated channel IDs from config/run-channels.json (empty = all of them, as the daily cron does)"
        type: string
        default: ""
      render_only:
        description: "DEBUG: skip discover/research/script; render the channel's latest committed script (never publishes)"
        type: boolean
        default: false
      timeout_minutes:
        description: "Every job's timeout in minutes (90 = default/production, room for the local-model fallback; 20 = fast iteration)"
        type: string
        default: "90"
      force_planner:
        description: "'ollama' = answer EVERY model call with local Ollama; Gemini is never called (the fallback test)"
        type: string
        default: ""
      publish:
        description: "PUBLISH ONLY: upload the approved-review videos of run review_run_id (private) for `channels`; nothing is rendered"
        type: boolean
        default: false
      review_run_id:
        description: "With publish: the pipeline run whose approved-review videos to upload"
        type: string
        default: ""
      hold_public:
        description: "Skip process-queue: nothing is flipped public by this run (uploads stay private)"
        type: boolean
        default: false
      eval_loop_mode:
        description: 'Eval loop mode: off (default), dry (decide and record), live (act)'
        required: false
        default: 'off'
        # type: string, not choice: GitHub's dispatch API rejected the default
        # ('off') against the allowed-values list even with options declared, so the
        # dropdown never dispatched. evalLoopMode() throws on any value outside
        # off/dry/live and is unit-tested for exactly that, so validation lives there.
        type: string
      is_retry:
        description: "Set by the pipeline itself: this run re-does only the channels that failed in the run before it. It never retries again."
        type: boolean
        default: false
      ollama_first:
        description: "Ask Ollama Cloud FIRST in every model chain (planner, props, image checks, frame review); Gemini becomes the fallback. Needs the OLLAMA_API_KEY secret."
        type: boolean
        default: false

concurrency:
  group: daily-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # Eval loop mode. Default off; the schedule trigger leaves inputs empty, which
  # evalLoopMode() reads as "off", so cron never enters the loop.
  EVAL_LOOP_MODE: ${{ inputs.eval_loop_mode }}
  PYTHON_VERSION: "3.11"
  OLLAMA_MODEL: "qwen2.5:3b"
  OLLAMA_URL: "http://127.0.0.1:11434"
  # Ollama Cloud (ollama.com hosted models, owner 2026-10-17): the second provider after Gemini in src/lib/llm.js, the image verifiers and the
  # script/research runner ("ollama-cloud/<model>" specs below). Empty secret = skipped at once, the chain is unchanged.
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  # ollama_first (dispatch input): scripts/ollama-client.cjs ollamaFirst() puts Ollama Cloud ahead of Gemini everywhere. Empty on the cron = off.
  OLLAMA_FIRST: ${{ inputs.ollama_first && '1' || '' }}
  # Ollama's default context is 4096 tokens; the research/script prompts are
  # longer, and a truncated prompt is how llama3.2 ended up answering
  # "To print Hello World in PythonΓÇª". opencode.json declares 16384 to match.
  OLLAMA_CONTEXT_LENGTH: "16384"
  OPENCODE_MODELS_RESEARCH: "ollama-cloud/gpt-oss:120b,ollama/qwen2.5:3b"
  OPENCODE_MODELS_REASONING: "ollama-cloud/gpt-oss:120b,ollama/qwen2.5:3b"
  OPENCODE_MODELS: "ollama/qwen2.5:3b"
  OPENCODE_ENABLE_EXA: "1"
  PREP_CALL_TIMEOUT_S: "300"
  RENDER_SCALE: "0.75"
  RENDER_CONCURRENCY: "4"
  # Persisted editor timelines (scripts/editor/timelines.json). Only scripts
  # with an entry use the editor; every other script keeps the existing
  # Gemini-plan pipeline unchanged.
  EDITOR_ENGINE: "1"
  EDITOR_TIMELINE_MAP: "scripts/editor/timelines.json"
  # A script with no persisted timeline is an ERROR, not a silent fall back to the legacy renderer (scripts/lib/editor-timeline-lookup.mjs).
  EDITOR_STRICT: "1"

jobs:
  # ============================================================
  # SETUP: channel matrix from config/priority-channels.json
  # ============================================================
  setup:
    # A publish dispatch renders nothing: setup (and so prep) is skipped; render, preview and
    # log-results check the same input.
    if: github.event.inputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '90') }}
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: channels
        name: Build channel matrix
        env:
          # The dispatch INPUT. 8f18b76d's blanket replace pointed this at steps.target (a step of the review-publish job, absent here), so a dispatch's
          # channel list was always empty and every priority channel ran (run 39012478515: channels=26 started all ten). Schedule events have no inputs -> priority set.
          REQUESTED: ${{ github.event.inputs.channels }}
        run: |
          MATRIX=$(node -e "
            const fs = require('fs');
            const priority = JSON.parse(fs.readFileSync('config/run-channels.json', 'utf-8')).channels.map(String);
            const req = (process.env.REQUESTED || '').split(',').map(s => s.trim().replace(/^ch-?/i, '').replace(/^0+/, '')).filter(Boolean);
            const ids = req.length ? req : priority;
            const notPriority = ids.filter(id => !priority.includes(id));
            if (notPriority.length) {
              console.error('Not run channels (config/run-channels.json): ' + notPriority.join(',') + ' (priority: ' + priority.join(',') + ')');
              process.exit(1);
            }
            console.log(JSON.stringify({ include: ids.map(id => ({ channel_id: id })) }));
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Channels in this run: $MATRIX"

      # THE SFX JUDGE RUNS ONCE PER BOARD, HERE (owner, 2026-10-10). It ran in every channel's render job; the runner cache has a static key, so the
      # verdicts never came back, and every channel re-sent three recordings to the audio judge (nine calls per channel). The judge needs the
      # recordings, so it fetches them first. Verdicts reach the render jobs as an artifact (a matrix job checks out the run's starting commit, not a
      # commit made during the run) and the repository, so the next board starts from them.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch CC0 SFX (once per board)
        continue-on-error: true
        run: node scripts/sfx-cc0.mjs fetch
      - name: Judge SFX once per board (recorded or robotic)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: node scripts/sfx-cc0.mjs judge
      - name: Commit SFX verdicts to the branch
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          git config user.name "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/sfx/verdicts.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "SFX verdicts unchanged"; exit 0; fi
          git commit -m "sfx: verdicts (run ${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
            git fetch -q origin "${{ github.ref_name }}" && git rebase -q "origin/${{ github.ref_name }}" || git rebase --abort
            sleep $((attempt * 3))
          done
      - name: Upload SFX verdicts (for the render jobs)
        uses: actions/upload-artifact@v4
        with:
          name: sfx-verdicts
          path: data/sfx/verdicts.json
          if-no-files-found: warn
          retention-days: 2

  # ============================================================
  # STAGE 1: PREP
  # ============================================================
  prep:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '90') }}
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 6
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-edge-tts-faster-whisper

      # The voiceover is Gemini TTS (src/utils/tts_gemini.py); faster-whisper aligns its words. edge-tts stays as the fallback.
      - name: Cache the word-alignment model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-align-${{ runner.os }}-faster-whisper-base.en

      - name: Install EdgeTTS + faster-whisper
        run: pip install --quiet edge-tts faster-whisper

      # Gemini TTS returns raw PCM; src/utils/tts_gemini.py writes the mp3 with ffmpeg (board 38033771445: missing here, every channel fell back to edge-tts).
      - name: Ensure ffmpeg (Gemini TTS)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      # —— Ollama —————————————————————————————————————————————————————————
      # .github/actions/ollama: one server per job, the only place one is
      # started (the "address already in use" fix), models from the cache.
      - name: Ollama (prep model)
        if: github.event.inputs.render_only != 'true'
        uses: ./.github/actions/ollama
        with:
          models: ${{ env.OLLAMA_MODEL }}
          cache-key: ollama-${{ runner.os }}-qwen2.5-3b

      # —— Stage A: discover topics for THIS channel ——————————————————————
      # —— Trending feed (YouTube Data API v3; scripts/fetch-trending.cjs) ——
      # A topic signal for discovery, cached 12 h per channel across runs
      # (the script checks fetched_at). Never fails the job: no key / 403 /
      # 429 / quota -> unseeded discovery. VidIQ is not used (paid API plan).
      - name: Restore trending cache
        if: github.event.inputs.render_only != 'true'
        uses: actions/cache@v4
        with:
          path: data/trending/
          key: trending-${{ matrix.channel_id }}-${{ github.run_id }}
          restore-keys: trending-${{ matrix.channel_id }}-

      - name: Trending feed
        if: github.event.inputs.render_only != 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-trending.cjs "${{ matrix.channel_id }}" || true

      - name: Discover topic
        if: github.event.inputs.render_only != 'true'
        id: discover
        env:
          # Discovery validation policy: unset/empty = advisory (checks reported, channel not stopped); "enforce" = skip the
          # channel when no candidate passes. Set it as a repository VARIABLE (not a secret); see scripts/validate-discovery.js.
          DISCOVERY_VALIDATION: ${{ vars.DISCOVERY_VALIDATION }}
          # The channel's niche_rules are enforced on every candidate (blocklist always; the model's niche-fit check with this on).
          NICHE_JUDGE: "1"
          # Answer step through Gemini first (scripts/ollama-agent.js searchGemini); Ollama is the fallback.
          FORCE_PLANNER: ${{ github.event.inputs.force_planner }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -u
          CH="${{ matrix.channel_id }}"
          node scripts/build-discovery-context.js --channel "$CH" > /tmp/context-base.json

          # Up to 3 discovery asks. When the validator rejects every candidate, the NEXT ask is told which titles were rejected and why
          # (context key previous_rejections), because the same model otherwise proposes the same kind of story again (run 41008440903:
          # ch-2 and ch-48 got product/announcement topics with no figure to draw; all 8 script attempts then failed SCR-17 STRICT).
          # The policy is unchanged: only the LAST ask is subject to DISCOVERY_VALIDATION (advisory forwards, enforce skips); earlier
          # asks that find nothing valid simply re-ask. A candidate that fails validation is never reserved as if it had passed.
          DISC_TRY=1
          while :; do
            cp /tmp/context-base.json /tmp/context.json
            if [ -s /tmp/prev-rejections.json ]; then
              jq --slurpfile r /tmp/prev-rejections.json '. + {previous_rejections: $r[0]}' /tmp/context-base.json > /tmp/context.json
            fi
            set +e
            cat /tmp/context.json | node scripts/ollama-agent.js               --prompt-file prompts/discover-topics.md               --append-system-prompt-file prompts/discover-candidates.md               --min-items topics=3 --reject-duplicates-for "$CH"               --schema-file schemas/topics.json               --search-budget 3               --agent pipeline-research               --model "$OPENCODE_MODELS_RESEARCH"               --task-label discover-topics --max-retries 4               > /tmp/topics-raw.json 2> >(tee /tmp/topics-err.log >&2)
            AGENT_EXIT=$?
            set -e

            if [ "$AGENT_EXIT" -ne 0 ]; then
              echo "::error::discover-topics failed for channel $CH"
              echo "--- stderr ---"; cat /tmp/topics-err.log 2>/dev/null || echo "(empty)"
              exit 1
            fi
            if ! jq -e '.structured_output.topics | length > 0' /tmp/topics-raw.json > /dev/null; then
              echo "::error::No topics discovered for channel $CH"
              cat /tmp/topics-raw.json
              exit 1
            fi
            jq '.structured_output' /tmp/topics-raw.json > /tmp/topics.json
            echo "Discovered $(jq '.topics | length' /tmp/topics.json) candidate topic(s) (ask $DISC_TRY/3)"
            node scripts/rank-topics-imagery.js /tmp/topics.json || echo "[imagery] ranking skipped"
            if [ "$DISC_TRY" -ge 3 ]; then break; fi
            # Ask 1 and 2: a trial validation on a COPY under enforce, only to decide whether to ask again. The real validation (under the
            # configured policy) runs once, after the loop, on the answer that is kept.
            cp /tmp/topics.json /tmp/topics-try.json
            TRY_RC=0
            DISCOVERY_VALIDATION=enforce node scripts/validate-discovery.js /tmp/topics-try.json "$CH" > /tmp/validate.log 2>&1 || TRY_RC=$?
            cat /tmp/validate.log
            if [ "$TRY_RC" -ne 1 ]; then break; fi
            echo "::warning::discovery ask $DISC_TRY/3 for channel $CH: every candidate rejected — asking again with the reasons"
            # The validator logged one 'REJECTED "<title>" — <reason>' line per candidate; those are the reasons the next ask is given.
            grep -o 'REJECTED ".*' /tmp/validate.log | sed 's/^REJECTED //' | jq -R -s -c 'split("\n") | map(select(length>0))' > /tmp/prev-rejections.json
            DISC_TRY=$((DISC_TRY + 1))
          done
          RC=0
          node scripts/validate-discovery.js /tmp/topics.json "$CH" || RC=$?
          if [ "$RC" -eq 1 ]; then
            echo "::warning::discovery validation REJECTED every candidate for channel $CH under DISCOVERY_VALIDATION=enforce — skipping this channel today"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$RC" -ne 0 ]; then
            echo "::error::discovery validator FAILED for channel $CH (exit $RC) — a fault, not a rejection; skipping this channel today"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi


      # —— Reserve the first NON-duplicate topic —————————————————————————
      - name: Reserve topic
        if: github.event.inputs.render_only != 'true'
        id: reserve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ matrix.channel_id }}"
          # Every later step gates on steps.reserve.outputs.skip, so a discovery skip has to be re-published HERE, before anything is reserved.
          if [ "${{ steps.discover.outputs.skip }}" = "true" ]; then
            echo "::warning::Channel $CH — discovery validation skipped this channel; no topic reserved"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "pipeline-bot"
          git config user.email "pipeline@youtube-automation.local"
          COUNT=$(jq '.topics | length' /tmp/topics.json)

          # Discovery returns several candidates. Only reserving topics[0]
          # turned every duplicate into a skipped channel (30 of 50 in run
          # 35763687213); walk the list and take the first non-duplicate.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"

            RESERVED=0
            for IDX in $(seq 0 $((COUNT - 1))); do
              TOPIC=$(jq -r ".topics[$IDX].topic" /tmp/topics.json)
              SLUG=$(jq -r ".topics[$IDX].slug" /tmp/topics.json)
              set +e
              node scripts/reserve-topic-single.js "$CH" "$TOPIC" "$SLUG"
              RESERVE_EXIT=$?
              set -e
              if [ "$RESERVE_EXIT" -eq 2 ]; then
                echo "Candidate $IDX is a duplicate ΓÇö trying the next one"
                continue
              fi
              if [ "$RESERVE_EXIT" -ne 0 ]; then
                echo "::error::Topic reservation error for channel $CH"
                exit 1
              fi
              jq ".topics[$IDX] | {topic, slug, angle, pillar, why_now}" /tmp/topics.json > /tmp/channel-topic.json
              RESERVED=1
              break
            done

            if [ "$RESERVED" -ne 1 ]; then
              echo "::warning::Channel $CH ΓÇö all $COUNT candidate topics are duplicates; skipping this channel today"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Dry runs check for duplicates but never push the reservation.
            # Pushing it made every debug run consume topics for 90 days
            # (11 were burned this way during the CI loop).
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "Dry run: \"$(jq -r .slug /tmp/channel-topic.json)\" passed the duplicate check; reservation not pushed"
              break
            fi

            git add data/topic-log.json
            if git diff --staged --quiet; then
              break
            fi
            git commit -m "topic: ch-$CH $(jq -r .slug /tmp/channel-topic.json)"
            if git push origin "${{ github.ref_name }}"; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Push conflict ΓÇö retrying ($attempt/5) ..."
              git reset --hard HEAD~1
              sleep $((attempt * 3))
            else
              echo "::error::Failed to push topic-log for channel $CH after 5 attempts"
              exit 1
            fi
          done
          if [ -f "data/trending/$CH.json" ]; then
            echo "[research] ch-$CH: trending topics loaded ($(jq '.videos[:5] | length' "data/trending/$CH.json")), chose: $(jq -r .topic /tmp/channel-topic.json)"
          else
            echo "[research] ch-$CH: no trending feed, chose (unseeded): $(jq -r .topic /tmp/channel-topic.json)"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "slug=$(jq -r .slug /tmp/channel-topic.json)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Render-only: use latest committed script"
        if: github.event.inputs.render_only == 'true'
        run: |
          # DEBUG path ΓÇö exercises render with a script that already exists
          # in git, so render failures can be fixed while prep is blocked.
          # Never publishes (every publish step is gated on render_only).
          CH="${{ matrix.channel_id }}"
          # checkout is depth 1; history (no blobs) is needed to find "latest".
          git fetch -q --unshallow --filter=blob:none origin "${{ github.ref_name }}"
          SCRIPT=$(git log --format= --name-only --diff-filter=AM -- "data/research/$CH/*-shorts-script.json" \
            | grep -v '^$' | while read -r f; do [ -f "$f" ] && echo "$f" && break; done)
          if [ -z "$SCRIPT" ]; then
            echo "::error::render_only: no committed shorts script for channel $CH"
            exit 1
          fi
          SLUG=$(basename "$SCRIPT" -shorts-script.json)
          echo "render_only: channel $CH ΓåÆ $SCRIPT"
          jq -n --arg s "$SLUG" '{slug:$s, topic:$s}' > /tmp/channel-topic.json

      - name: Ensure output directories
        if: steps.reserve.outputs.skip != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          mkdir -p data/research/$CH data/tts/$CH data/thumbnails/$CH
          echo "FORMATS=shorts" >> "$GITHUB_ENV"

      # —— Stage B: research ——————————————————————————————————————————————
      - name: Research topic
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        env:
          # Answer step through Gemini first (scripts/ollama-agent.js searchGemini); Ollama is the fallback.
          FORCE_PLANNER: ${{ github.event.inputs.force_planner }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -u
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r  '.slug'  /tmp/channel-topic.json)
          TOPIC=$(jq -r '.topic' /tmp/channel-topic.json)
          ANGLE=$(jq -r '.angle' /tmp/channel-topic.json)
          echo "=== RESEARCH: $CH ΓÇö $SLUG ==="

          # Trending entities (scripts/trending-entities.cjs, task 3): the named
          # people / places / organizations / numbers of this week's top trending
          # titles, as research subjects. null when the trending feed is
          # unavailable (no YOUTUBE_API_KEY) ΓÇö research.md then still requires
          # named facts.
          TE=null
          if [ -s "data/trending/$CH-entities.json" ]; then
            TE=$(jq -c '{people, places, organizations, names, numbers}' "data/trending/$CH-entities.json" 2>/dev/null || echo null)
            echo "[research] ch-$CH: trending entities fed to research: $TE"
          else
            echo "[research] ch-$CH: no trending entities (feed unavailable) ΓÇö research prompt requires named facts"
          fi

          set +e
          jq -n --arg t "$TOPIC" --arg a "$ANGLE" \
                --arg s "$SLUG"  --arg c "$CH" --argjson te "$TE" \
                '{topic:$t, angle:$a, slug:$s, channel_id:$c, trending_entities:$te}' \
            | node scripts/ollama-agent.js \
                --prompt-file prompts/research.md \
                --schema-file schemas/research.json \
                --agent pipeline-research \
                --model "$OPENCODE_MODELS_RESEARCH" \
                --task-label research --max-retries 4 --min-source-domains 2 --channel-id "$CH" --video-id "$SLUG" \
                --search-out "data/research/$CH/$SLUG-search.json" \
                > /tmp/research-raw.json 2> >(tee /tmp/research-err.log >&2)
          AGENT_EXIT=$?
          set -e

          if [ "$AGENT_EXIT" -ne 0 ]; then
            echo "::error::research failed for channel $CH"
            echo "--- stderr ---"; cat /tmp/research-err.log 2>/dev/null || echo "(empty)"
            exit 1
          fi
          if ! jq -e '.structured_output.key_facts | length >= 3' /tmp/research-raw.json > /dev/null; then
            echo "::error::research didn't meet the quality bar for channel $CH"
            cat /tmp/research-raw.json
            exit 1
          fi
          jq '.structured_output' /tmp/research-raw.json > "data/research/$CH/$SLUG.json"
          cp /tmp/research-raw.json "data/research/$CH/.agent-raw.json"

      - name: Gate research
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          node scripts/gate-research.js "$CH" "$SLUG"

      # —— Stage C: script (gate-feedback retry) ——————————————————————————
      - name: Write script
        id: script
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        env:
          # The script is written by Gemini (scripts/ollama-agent.js geminiAnswer, the
          # planner's src/lib/gemini-client.js): qwen2.5:3b copied the prompt's example and
          # repeated sentences (docs/V2-NARRATIVE-SCRIPT-GREEN.md). OPENCODE_MODELS_REASONING
          # (Ollama) is the fallback when Gemini cannot answer. force_planner=ollama skips Gemini.
          SCRIPT_GEMINI_MODEL: gemini-3.5-flash-lite
          FORCE_PLANNER: ${{ github.event.inputs.force_planner }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The one topic re-pick in the claims-gate path re-runs research for
          # the replacement topic, so this step needs the research model too.
          OPENCODE_MODELS_RESEARCH: "ollama-cloud/gpt-oss:120b,ollama/qwen2.5:3b"
          # This run script is 26k chars. As soon as a run block contains
          # `${{ }}`, GitHub parses the WHOLE scalar as one expression
          # template and rejects it above 21,000 chars ("Exceeded max
          # expression length 21000", line 540; push 749a7be7 failed to
          # parse and the workflow could not be dispatched). Keep the
          # matrix value in env so the script itself stays literal.
          CHANNEL_ID: ${{ matrix.channel_id }}
        run: |
          set -euo pipefail
          CH="$CHANNEL_ID"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          STYLE=$(node scripts/channel-style.js "$CH")
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            # Motion-graphics SHORTS render through DirectedShorts, which
            # builds visuals from the SRT + visual plan and never reads
            # sections[].beats ΓÇö so the writer isn't asked for beats, and the
            # style contract is cut before its beat/section-schema chapters.
            # (CHECK-REGISTER.md: SCR-03/04/05/06/07/15 scope.)
            CONTRACT=prompts/style-contract.md
            if [ "$STYLE" = "motion-graphics" ] && [ "$FORMAT" = "shorts" ] && [ "${USE_LEGACY_3D:-}" != "true" ]; then
              SCHEMA="schemas/script.directed.json"
              awk '/^## If you were given the motion-graphics beat schema/{exit} {print}' prompts/style-contract.md > /tmp/style-contract-directed.md
              CONTRACT=/tmp/style-contract-directed.md
            elif [ "$STYLE" = "motion-graphics" ]; then
              SCHEMA="schemas/script.mg.json"
            else
              SCHEMA="schemas/script.section.json"
            fi
            FEEDBACK=""
            PASSED=0
            SPEC_REASKED=0
            CLAIM_REASKED=0
            SKIP_GEN=0
            # ONE topic re-pick per channel per run, across all formats.
            REPICKED=0
            # Eight iterations, not five: a repair validation (SKIP_GEN) consumes
            # an iteration without a new generation, and three story repairs plus
            # one claims repair used to exhaust the budget before the ONE topic
            # re-pick could run (run 39300736182 ch-1 was skipped at attempt 5
            # with the re-pick still unused).
            for ATTEMPT in 1 2 3 4 5 6 7 8; do
              echo "=== SCRIPT: $CH ΓÇö $SCRIPT_SLUG (attempt $ATTEMPT/8) ==="
              # Attempts 1-3 use the cheap model. When the gate has refused three times (sloppy names, figures that name nothing), the writer and
              # the sentence repair switch to the stronger model for the rest of the budget: run 41020644767 lost 4 of 10 channels on the cheap model alone.
              if [ "$ATTEMPT" -ge 4 ]; then export SCRIPT_GEMINI_MODEL=gemini-3.5-flash; fi
              if [ "$SKIP_GEN" -eq 1 ]; then
              # The re-ask was a targeted repair (scripts/repair-sentences.mjs): the script
              # file was rewritten in place ΓÇö only the flagged sentences ΓÇö so there is no new
              # model call; every gate below runs again on the repaired script.
              SKIP_GEN=0
              echo "[script] ch-$CH: validating the repaired script"
              else
              PROMPT_FILE=prompts/write-script.md
              if [ -n "$FEEDBACK" ]; then
                cp prompts/write-script.md /tmp/write-script-feedback.md
                printf '\n\n## Quality gate rejected your previous script\n\n%s\n\nRewrite the FULL script JSON now, fixing exactly the problems above. Keep everything the gate did not flag identical ΓÇö same research grounding, same sources_used, same structure. Return only the JSON object.\n' "$FEEDBACK" >> /tmp/write-script-feedback.md
                PROMPT_FILE=/tmp/write-script-feedback.md
              fi
              set +e
              node scripts/build-script-context.js "$CH" "$SLUG" --format "$FORMAT" \
                | node scripts/ollama-agent.js \
                    --prompt-file "$PROMPT_FILE" \
                    --append-system-prompt-file "$CONTRACT" \
                    --schema-file "$SCHEMA" \
                    --agent pipeline-script \
                    --model "$OPENCODE_MODELS_REASONING" \
                    --task-label write-script --max-retries 4 --channel-id "$CH" --video-id "$SCRIPT_SLUG" \
                    > /tmp/script-raw-$FORMAT.json 2> >(tee /tmp/script-err-$FORMAT.log >&2)
              AGENT_EXIT=$?
              set -e
              if [ "$AGENT_EXIT" -ne 0 ]; then
                echo "::error::script model call failed for channel $CH format $FORMAT"
                echo "--- stderr ---"; cat /tmp/script-err-$FORMAT.log 2>/dev/null || echo "(empty)"
                exit 1
              fi
              jq '.structured_output' /tmp/script-raw-$FORMAT.json \
                > "data/research/$CH/${SCRIPT_SLUG}-script.json"
              fi
              # Too long for the gate (SCR-16 "CUT"): remove whole sentences
              # (scripts/fit-short.js ΓÇö deletion only, hook and payoff kept, every
              # remaining fact exactly as written) and gate again, instead of
              # spending a model attempt. Run 37125010644: ch-26 returned 121 words
              # four times against a 106-word ceiling and the channel failed prep.
              GATE_OK=0
              if node scripts/gate-script.js "$CH" "$SCRIPT_SLUG" "$SLUG" > /tmp/gate-out-$FORMAT.log 2>&1; then GATE_OK=1;
              elif grep -q "SCR-16:.*CUT at least" /tmp/gate-out-$FORMAT.log; then
                CEIL=$(grep -oE 'needs [0-9]+-[0-9]+ words' /tmp/gate-out-$FORMAT.log | head -1 | grep -oE '[0-9]+' | tail -1)
                if [ -n "$CEIL" ] && node scripts/fit-short.js "data/research/$CH/${SCRIPT_SLUG}-script.json" "$CEIL"; then
                  echo "[script] ch-$CH: trimmed to <= $CEIL words by removing whole sentences; gating again"
                  if node scripts/gate-script.js "$CH" "$SCRIPT_SLUG" "$SLUG" > /tmp/gate-out-$FORMAT.log 2>&1; then GATE_OK=1; fi
                fi
              fi
              # REPEATS (scripts/dedupe-sentences.js): a sentence that says what another already said is deleted (nothing reworded); one that
              # deletion cannot remove (both copies are their section's only sentence) is handed to the story repair below as a CLARITY line.
              # Board 39031532519 ch-44 narrated its hook twice and the setup's line again as the re-hook. A deletion re-runs the script gate.
              : > /tmp/dedupe-out-$FORMAT.log
              if [ "$GATE_OK" -eq 1 ]; then
                node scripts/dedupe-sentences.js "data/research/$CH/${SCRIPT_SLUG}-script.json" > /tmp/dedupe-out-$FORMAT.log 2>&1 || true
                cat /tmp/dedupe-out-$FORMAT.log
                if grep -q '^\[dedupe\] removed' /tmp/dedupe-out-$FORMAT.log && ! node scripts/gate-script.js "$CH" "$SCRIPT_SLUG" "$SLUG" > /tmp/gate-out-$FORMAT.log 2>&1; then GATE_OK=0; fi
              fi
              if [ "$GATE_OK" -eq 1 ]; then
                # STORY (scripts/validate-script-story.cjs): the narrative engine ΓÇö
                # hook / setup / re-hook / payoff / close (validate-script-narrative.cjs), the
                # voice rules ΓÇö banned openings, <= 25 words, at most one person-name start
                # (validate-script-voice.cjs) ΓÇö and specificity (validate-script.cjs). Any
                # failure -> ONE re-ask with every failing beat / sentence marked. Still failing:
                #   narrative / specificity (exit 2) -> logged to
                #     data/ci-runs/blocked-script-{narrative,specificity}-<ch>.txt, script continues;
                #   VOICE (exit 3) -> a hard gate (owner's ruling 2026-10-03): logged to
                #     data/ci-runs/blocked-voice-<ch>.txt and THIS CHANNEL IS SKIPPED this run ΓÇö
                #     skip=true, no TTS / render / upload; other channels are unaffected.
                set +e
                # Up to THREE targeted repairs (was one): the clarity reader (SCR-16) flags an unanswered question or an unexplained term that one
                # repair often leaves half-fixed (board 38877895872 ch-1: the payoff still did not answer "Where does worker confidence stand today?").
                if [ "$SPEC_REASKED" -lt 3 ] && [ "$ATTEMPT" -lt 8 ]; then
                  node scripts/validate-script-story.cjs "$CH" "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" > /tmp/spec-out-$FORMAT.log 2>&1
                else
                  node scripts/validate-script-story.cjs "$CH" "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" --blocked data/ci-runs > /tmp/spec-out-$FORMAT.log 2>&1
                fi
                SPEC_EXIT=$?
                set -e
                if grep -q '^  - CLARITY:' /tmp/dedupe-out-$FORMAT.log; then grep '^  - ' /tmp/dedupe-out-$FORMAT.log >> /tmp/spec-out-$FORMAT.log; [ "$SPEC_EXIT" -eq 0 ] && SPEC_EXIT=2; fi
                cat /tmp/spec-out-$FORMAT.log
                if [ "$SPEC_EXIT" -ne 0 ]; then
                  if [ "$SPEC_REASKED" -lt 3 ] && [ "$ATTEMPT" -lt 8 ]; then
                    SPEC_REASKED=$((SPEC_REASKED + 1))
                    # The one re-ask: repair only the flagged sentences in place (a full
                    # regeneration fixed them and broke others ΓÇö runs 37154369091, 37154668613).
                    grep -E '^  - ' /tmp/spec-out-$FORMAT.log > /tmp/repair-fb-$FORMAT.txt || true
                    if node scripts/repair-sentences.mjs "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" /tmp/repair-fb-$FORMAT.txt; then
                      echo "[script] ch-$CH: story checks FAIL ($(grep -c '^  - ' /tmp/spec-out-$FORMAT.log) marked), repaired the flagged sentences (the one re-ask)"
                      SKIP_GEN=1
                      continue
                    fi
                    echo "[script] ch-$CH: story checks FAIL ($(grep -c '^  - ' /tmp/spec-out-$FORMAT.log) marked), re-asking once"
                    FEEDBACK=$(printf '%s\n%s\n' "$FEEDBACK" "$(grep -E '^  - ' /tmp/spec-out-$FORMAT.log || true)" | grep -E '^  - ' | sort -u || true)
                    continue
                  fi
                  # VOICE IS A WARNING, NOT A GATE (owner, 2026-10-05). validate-script-story.cjs
                  # no longer returns 3 ΓÇö it logs "[voice] ch-N: N warnings, continuing" and the
                  # channel carries on. This branch is kept only so an unexpected 3 can never
                  # silently skip a channel: it logs and falls THROUGH instead of skipping.
                  if [ "$SPEC_EXIT" -eq 3 ]; then
                    echo "::warning::[script] ch-$CH: unexpected voice exit 3 ΓÇö treating as a warning, continuing (data/ci-runs/blocked-voice-$CH.txt)"
                  fi
                  echo "::warning::[script] ch-$CH: story checks still FAIL after the re-ask ΓÇö continuing with this script (logged to data/ci-runs/blocked-script-*-$CH.txt)"
                fi
                # CLAIMS (scripts/validate-script-claims.cjs, owner's Fix 4): every sentence's
                # (subject, verb, object) claims judged against THIS research by Gemini. An
                # INVENTED claim -> ONE re-ask with the sentences marked; still INVENTED ->
                # data/ci-runs/blocked-claims-<ch>.txt and the channel is SKIPPED (exit 2 with
                # --blocked). PARTIAL is logged and accepted. Gemini failing twice -> exit 4,
                # "claim check unavailable, proceeding without".
                set +e
                if [ "$CLAIM_REASKED" -eq 0 ] && [ "$ATTEMPT" -lt 8 ]; then
                  node scripts/validate-script-claims.cjs "$CH" "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" > /tmp/claims-out-$FORMAT.log 2>&1
                else
                  node scripts/validate-script-claims.cjs "$CH" "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" --blocked data/ci-runs > /tmp/claims-out-$FORMAT.log 2>&1
                fi
                CLAIM_EXIT=$?
                set -e
                cat /tmp/claims-out-$FORMAT.log
                if [ "$CLAIM_EXIT" -eq 2 ]; then
                  if [ "$CLAIM_REASKED" -eq 0 ] && [ "$ATTEMPT" -lt 8 ]; then
                    CLAIM_REASKED=1
                    grep -E '^  - CLAIM' /tmp/claims-out-$FORMAT.log > /tmp/repair-fb-$FORMAT.txt || true
                    if node scripts/repair-sentences.mjs "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" /tmp/repair-fb-$FORMAT.txt; then
                      echo "[script] ch-$CH: INVENTED claims ($(grep -c '^  - CLAIM' /tmp/claims-out-$FORMAT.log)), repaired those sentences (the one re-ask)"
                      SKIP_GEN=1
                      continue
                    fi
                    echo "[script] ch-$CH: INVENTED claims ($(grep -c '^  - CLAIM' /tmp/claims-out-$FORMAT.log)), re-asking once"
                    FEEDBACK=$(printf '%s\n%s\n' "$FEEDBACK" "$(grep -E '^  - CLAIM' /tmp/claims-out-$FORMAT.log || true)" | grep -E '^  - ' | sort -u || true)
                    continue
                  fi
                  # ONE TOPIC RE-PICK, NOT A CHANNEL FAILURE. The claims gate
                  # is right and is not loosened ΓÇö but a channel that simply
                  # cannot ground one topic has not failed: discovery returned a
                  # list, and the honest response to an ungroundable topic is
                  # the next one, not an empty channel. Board 38325399088 ch-44:
                  # "Apply these Harvard strategies to your next deal" was
                  # correctly rejected as INVENTED after the re-ask, and the
                  # channel shipped nothing.
                  #
                  # Once only. If the replacement topic is also rejected, the
                  # channel IS skipped ΓÇö two ungroundable topics in a row is a
                  # content problem, and re-picking forever would hide it.
                  if [ "$REPICKED" -eq 0 ] && [ "$ATTEMPT" -lt 8 ]; then
                    BURNED="${BURNED:-} $SLUG"
                    NEXT=""; NEXT_TOPIC=""; NEXT_ANGLE=""
                    N=$(jq '.topics | length' /tmp/topics.json 2>/dev/null || echo 0)
                    for IDX in $(seq 0 $((N - 1))); do
                      T=$(jq -r ".topics[$IDX].topic" /tmp/topics.json)
                      S=$(jq -r ".topics[$IDX].slug" /tmp/topics.json)
                      [ "$S" = "$SLUG" ] && continue
                      case " $BURNED " in *" $S "*) continue ;; esac
                      set +e
                      node scripts/reserve-topic-single.js "$CH" "$T" "$S" > /dev/null 2>&1
                      R=$?
                      set -e
                      [ "$R" -eq 0 ] || continue
                      NEXT="$S"; NEXT_TOPIC="$T"; NEXT_ANGLE=$(jq -r ".topics[$IDX].angle // \"\"" /tmp/topics.json)
                      break
                    done
                    if [ -n "$NEXT" ]; then
                      echo "[script] ch-$CH: claims gate held after the re-ask ΓÇö re-picking a topic: $SLUG -> $NEXT"
                      jq -n --arg s "$NEXT" --arg t "$NEXT_TOPIC" --arg a "$NEXT_ANGLE" '{slug:$s,topic:$t,angle:$a}' > /tmp/channel-topic.json
                      set +e
                      jq -n --arg t "$NEXT_TOPIC" --arg a "$NEXT_ANGLE" --arg s "$NEXT" --arg c "$CH" \
                            '{topic:$t, angle:$a, slug:$s, channel_id:$c, trending_entities:null}' \
                        | node scripts/ollama-agent.js \
                            --prompt-file prompts/research.md \
                            --schema-file schemas/research.json \
                            --agent pipeline-research \
                            --model "$OPENCODE_MODELS_RESEARCH" \
                            --task-label research --max-retries 4 --min-source-domains 2 --channel-id "$CH" --video-id "$NEXT" \
                            --search-out "data/research/$CH/$NEXT-search.json" \
                            > /tmp/research-repick.json 2> >(tee /tmp/research-repick-err.log >&2)
                      RP_EXIT=$?
                      set -e
                      if [ "$RP_EXIT" -eq 0 ] && jq -e '.structured_output.key_facts | length >= 3' /tmp/research-repick.json > /dev/null; then
                        jq '.structured_output' /tmp/research-repick.json > "data/research/$CH/$NEXT.json"
                        SLUG="$NEXT"; SCRIPT_SLUG="${SLUG}-${FORMAT}"
                        CLAIM_REASKED=0; SPEC_REASKED=0; SKIP_GEN=0; FEEDBACK=""
                        REPICKED=1
                        continue
                      fi
                      echo "::warning::[script] ch-$CH: research for the re-picked topic $NEXT failed ΓÇö falling through to the skip"
                    else
                      echo "::warning::[script] ch-$CH: no spare topic left to re-pick"
                    fi
                  fi
                  echo "::warning::[script] ch-$CH: invented claims after the re-ask ΓÇö channel skipped this run (data/ci-runs/blocked-claims-$CH.txt)"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  echo "skip_reason=claims" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                # REPEATS, last word before the voiceover (a claims repair can write a copy of another sentence ΓÇö ch-44 above). Deletion first;
                # a repeat deletion cannot fix gets one targeted repair while attempts remain, and otherwise the channel is skipped: a video that
                # narrates the same line twice is not shipped.
                set +e
                node scripts/dedupe-sentences.js "data/research/$CH/${SCRIPT_SLUG}-script.json" --strict > /tmp/dedupe-final-$FORMAT.log 2>&1
                DD_EXIT=$?
                set -e
                cat /tmp/dedupe-final-$FORMAT.log
                if [ "$DD_EXIT" -eq 3 ]; then
                  grep -E '^  - ' /tmp/dedupe-final-$FORMAT.log > /tmp/repair-fb-$FORMAT.txt || true
                  : > /tmp/repair-out-$FORMAT.log
                  if [ "$ATTEMPT" -lt 8 ] && node scripts/repair-sentences.mjs "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" /tmp/repair-fb-$FORMAT.txt > /tmp/repair-out-$FORMAT.log 2>&1; then
                    cat /tmp/repair-out-$FORMAT.log
                    echo "[script] ch-$CH: repeated sentences, repaired them"
                    SKIP_GEN=1
                    continue
                  fi
                  # WHY the repair did not happen is what the skip below used to hide (attempt cap, Gemini unavailable, an unusable
                  # answer, a CUT refused on a beat's only sentence). Print it; nothing about the check or the skip changes.
                  cat /tmp/repair-out-$FORMAT.log
                  if [ "$ATTEMPT" -ge 8 ]; then REPAIR_WHY="no repair attempted: attempt $ATTEMPT of 8"; else REPAIR_WHY="$(tail -n 2 /tmp/repair-out-$FORMAT.log | tr '\n' ' ' | cut -c1-300)"; fi
                  echo "::warning::[script] ch-$CH: sentence repair did not fix the repeat (${REPAIR_WHY:-no output from the repair})"
                  echo "::warning::[script] ch-$CH: the script repeats a sentence that deleting cannot fix ΓÇö channel skipped this run"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  echo "skip_reason=repeats" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                if [ "$DD_EXIT" -ne 0 ]; then echo "::warning::[script] ch-$CH: repeat check could not run (exit $DD_EXIT) ΓÇö continuing"; fi
                # LENGTH, measured on the real voiceover. render.js caps a
                # Short at 60s, so a longer narration is cut off mid-word ΓÇö
                # a since-cut channel's 61.06s voiceover in run 35830826546. Word count
                # doesn't predict it (131 words ran 32.8s, 87 words 50.6s),
                # so the audio is generated here and its SRT end is checked.
                if [ "$FORMAT" = "shorts" ]; then
                  SCRIPT_FILE="data/research/$CH/${SCRIPT_SLUG}-script.json"
                  FITS=0
                  # Up to 3 measure ΓåÆ trim rounds. Trimming only DELETES whole
                  # sentences (scripts/fit-short.js ΓÇö hook and payoff kept);
                  # qwen2.5:3b never converged on a length when asked to
                  # rewrite (ch-9 68/60/75s; one cut channel 70/66/64/90s).
                  for FIT in 1 2 3; do
                    TTS_DONE=0
                    for tts_try in 1 2 3; do
                      if node src/utils/tts.js "$CH" "$SCRIPT_FILE"; then TTS_DONE=1; break; fi
                      sleep 15
                    done
                    if [ "$TTS_DONE" -ne 1 ]; then
                      echo "::error::TTS failed after 3 attempts for $SCRIPT_SLUG"
                      exit 1
                    fi
                    VO_SRT="data/tts/$CH/${SCRIPT_SLUG}-script-vo.srt"
                    VO_END=$(node -e "
                      const t=require('fs').readFileSync(process.argv[1],'utf8').match(/\d+:\d+:\d+[,.]\d+(?=\s*\r?\n)/g)||[];
                      const [h,m,s]=(t.pop()||'0:0:0,0').replace(',','.').split(':');
                      console.log((+h*3600+ +m*60+ +s).toFixed(2));" "$VO_SRT")
                    echo "Voiceover length: ${VO_END}s (Short limit 58s)"
                    if ! awk "BEGIN{exit !($VO_END > 58)}"; then FITS=1; break; fi
                    # Word ceiling from this script's own measured words/second.
                    WORDS=$(node -e "const s=require('./'+process.argv[1]);console.log((s.sections||[]).map(x=>x.voiceover||'').join(' ').split(/\s+/).filter(Boolean).length)" "$SCRIPT_FILE")
                    MAXW=$(awk "BEGIN{printf \"%d\", $WORDS*52/$VO_END}")
                    rm -f "data/tts/$CH/${SCRIPT_SLUG}-script-vo."* "data/tts/$CH/${SCRIPT_SLUG}-script-vo-words.json"
                    echo "::warning::voiceover ${VO_END}s (${WORDS} words) is over the Short limit ΓÇö removing sentences to <= ${MAXW} words (fit $FIT/3)"
                    if ! node scripts/fit-short.js "$SCRIPT_FILE" "$MAXW"; then break; fi
                    if ! node scripts/gate-script.js "$CH" "$SCRIPT_SLUG" "$SLUG" > /tmp/gate-out-$FORMAT.log 2>&1; then
                      echo "::warning::script gate rejected the trimmed script"
                      cat /tmp/gate-out-$FORMAT.log
                      break
                    fi
                  done
                  if [ "$FITS" -ne 1 ]; then
                    # Trimming couldn't fit it (hook + payoff alone too long,
                    # or the trimmed script failed the gate): ask for a
                    # shorter script with a concrete word ceiling.
                    rm -f "data/tts/$CH/${SCRIPT_SLUG}-script-vo."* "data/tts/$CH/${SCRIPT_SLUG}-script-vo-words.json"
                    GATE_LINES=$(grep -E '^  - ' /tmp/gate-out-$FORMAT.log || true)
                    FEEDBACK=$( { printf '%s\n%s\n' "$FEEDBACK" "$GATE_LINES" | grep -v '  - LENGTH:'; printf '  - LENGTH: your voiceover is %s words and runs %ss; a Short must finish inside 58s. Rewrite it to AT MOST %s words in total across all sections (count them). Keep every sourced fact you keep worded exactly as before.\n' "$WORDS" "$VO_END" "$MAXW"; } | grep -E '^  - ' | sort -u)
                    continue
                  fi
                fi
                PASSED=1
                break
              fi
              echo "::warning::script gate rejected attempt $ATTEMPT/8 for $SCRIPT_SLUG"
              cat /tmp/gate-out-$FORMAT.log
              # STRICT SENTENCE REPAIR. Runs 40971151924 ch-2 / ch-48: the writer's research was sound (ch-2 had six sourced
              # figures) but every full regeneration produced a different rhetorical-question sentence that names no figure, so
              # SCR-17 STRICT failed all 8 attempts. Same fix the story and repeat checks already use: rewrite ONLY the flagged
              # sentences from the research (repair-sentences.mjs may answer CUT instead of inventing), then re-run every gate.
              # Nothing is loosened: the gate runs again on the result. Attempt 5 is left to the topic re-pick below.
              if [ "$ATTEMPT" -lt 8 ] && [ "$ATTEMPT" -ne 5 ] && [ "${STRICT_REPAIRED:-0}" -lt 3 ]                  && grep -q 'SCR-17 STRICT' /tmp/gate-out-$FORMAT.log; then
                STRICT_REPAIRED=$((${STRICT_REPAIRED:-0} + 1))
                grep -E '^  - SCR-17 STRICT' /tmp/gate-out-$FORMAT.log > /tmp/repair-fb-$FORMAT.txt || true
                if node scripts/repair-sentences.mjs "data/research/$CH/${SCRIPT_SLUG}-script.json" "data/research/$CH/$SLUG.json" /tmp/repair-fb-$FORMAT.txt; then
                  echo "[script] ch-$CH: strict visual gate FAIL, repaired the flagged sentences ($STRICT_REPAIRED/3)"
                  SKIP_GEN=1
                  continue
                fi
                echo "[script] ch-$CH: strict visual gate FAIL, the sentence repair could not fix it - regenerating"
              fi
              # STRICT STARVATION -> ONE TOPIC RE-PICK (SCR-19). The strict
              # rule can only be satisfied with sentences the RESEARCH can
              # support; when attempt 5 still fails it and nothing else, the
              # topic is the problem, not the wording. Run 39399514270 ch-48
              # burned all 8 attempts on a paper whose every fact was "X
              # analysed Y" - no rewrite can ground that without inventing.
              # Same machinery and one-per-run budget as the claims re-pick
              # (REPICKED/BURNED, ~45 lines above); the replacement topic
              # starts with a clean feedback slate and 3 attempts left.
              if [ "$ATTEMPT" -eq 5 ] && [ "$REPICKED" -eq 0 ] \
                 && grep -q 'SCR-17 STRICT' /tmp/gate-out-$FORMAT.log \
                 && [ -f /tmp/topics.json ]; then
                BURNED="${BURNED:-} $SLUG"
                NEXT=""; NEXT_TOPIC=""; NEXT_ANGLE=""
                N=$(jq '.topics | length' /tmp/topics.json 2>/dev/null || echo 0)
                for IDX in $(seq 0 $((N - 1))); do
                  T=$(jq -r ".topics[$IDX].topic" /tmp/topics.json)
                  S=$(jq -r ".topics[$IDX].slug" /tmp/topics.json)
                  [ "$S" = "$SLUG" ] && continue
                  case " $BURNED " in *" $S "*) continue ;; esac
                  set +e
                  node scripts/reserve-topic-single.js "$CH" "$T" "$S" > /dev/null 2>&1
                  R=$?
                  set -e
                  [ "$R" -eq 0 ] || continue
                  NEXT="$S"; NEXT_TOPIC="$T"; NEXT_ANGLE=$(jq -r ".topics[$IDX].angle // \"\"" /tmp/topics.json)
                  break
                done
                if [ -n "$NEXT" ]; then
                  echo "[script] ch-$CH: strict visual rule starved by this topic - re-picking: $SLUG -> $NEXT"
                  jq -n --arg s "$NEXT" --arg t "$NEXT_TOPIC" --arg a "$NEXT_ANGLE" '{slug:$s,topic:$t,angle:$a}' > /tmp/channel-topic.json
                  set +e
                  jq -n --arg t "$NEXT_TOPIC" --arg a "$NEXT_ANGLE" --arg s "$NEXT" --arg c "$CH" \
                        '{topic:$t, angle:$a, slug:$s, channel_id:$c, trending_entities:null}' \
                    | node scripts/ollama-agent.js \
                        --prompt-file prompts/research.md \
                        --schema-file schemas/research.json \
                        --agent pipeline-research \
                        --model "$OPENCODE_MODELS_RESEARCH" \
                        --task-label research --max-retries 4 --min-source-domains 2 --channel-id "$CH" --video-id "$NEXT" \
                        --search-out "data/research/$CH/$NEXT-search.json" \
                        > /tmp/research-repick.json 2> >(tee /tmp/research-repick-err.log >&2)
                  RP_EXIT=$?
                  set -e
                  if [ "$RP_EXIT" -eq 0 ] && jq -e '.structured_output.key_facts | length >= 3' /tmp/research-repick.json > /dev/null; then
                    jq '.structured_output' /tmp/research-repick.json > "data/research/$CH/$NEXT.json"
                    SLUG="$NEXT"; SCRIPT_SLUG="${SLUG}-${FORMAT}"
                    CLAIM_REASKED=0; SPEC_REASKED=0; SKIP_GEN=0; FEEDBACK=""
                    REPICKED=1
                    continue
                  fi
                  echo "::warning::[script] ch-$CH: research for the strict re-pick $NEXT failed - continuing with the current topic"
                else
                  echo "::warning::[script] ch-$CH: no spare topic left for the strict re-pick"
                fi
              fi
              # Accumulate violations across attempts (see run 35289507647).
              NEW_FEEDBACK=$(grep -E '^  - ' /tmp/gate-out-$FORMAT.log || true)
              FEEDBACK=$(printf '%s\n%s\n' "$FEEDBACK" "$NEW_FEEDBACK" \
                | grep -E '^  - ' | sort -u || true)
            done
            if [ "$PASSED" -ne 1 ]; then
              echo "::error::script gate still failing for $SCRIPT_SLUG after 8 attempts"
              exit 1
            fi
          done

      # —— Stage D: TTS voiceover —————————————————————————————————————————
      - name: Generate TTS voiceover
        if: steps.reserve.outputs.skip != 'true' && steps.script.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          set -euo pipefail
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            SCRIPT="data/research/$CH/${SCRIPT_SLUG}-script.json"
            if [ ! -f "$SCRIPT" ]; then
              echo "::error::Script not found: $SCRIPT"
              exit 1
            fi
            if [ -f "data/tts/$CH/${SCRIPT_SLUG}-script-vo.mp3" ] && [ -f "data/tts/$CH/${SCRIPT_SLUG}-script-vo.srt" ] && [ -f "data/tts/$CH/${SCRIPT_SLUG}-script-vo-words.json" ]; then
              echo "TTS for $SCRIPT_SLUG was generated by the script length check ΓÇö reusing it"
              continue
            fi
            echo "=== TTS: $CH ΓÇö $SCRIPT_SLUG ==="
            TTS_OK=0
            for tts_try in 1 2 3; do
              if node src/utils/tts.js "$CH" "$SCRIPT"; then
                TTS_OK=1; break
              fi
              if [ "$tts_try" -lt 3 ]; then
                echo "TTS attempt $tts_try failed ΓÇö retrying in 15s..."
                sleep 15
              fi
            done
            if [ "$TTS_OK" -ne 1 ]; then
              echo "::error::TTS failed after 3 attempts for $SCRIPT_SLUG"
              exit 1
            fi
          done

      # —— Stage E: Thumbnail —————————————————————————————————————————————
      - name: Generate thumbnail
        if: steps.reserve.outputs.skip != 'true' && steps.script.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            SCRIPT="data/research/$CH/${SCRIPT_SLUG}-script.json"
            echo "=== THUMBNAIL: $CH ΓÇö $SCRIPT_SLUG ==="
            node src/skills/thumbnail-maker/generate.js "$CH" "$SCRIPT" || echo "WARN: thumbnail spec failed"
            node src/skills/thumbnail-maker/render-thumb.js "$CH" "$SCRIPT_SLUG" || echo "WARN: thumbnail render failed"
          done

      # —— Stage F: SEO + metadata ————————————————————————————————————————
      - name: Generate SEO + metadata
        if: steps.reserve.outputs.skip != 'true' && steps.script.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          TOPIC=$(jq -r '.topic' /tmp/channel-topic.json)
          echo "=== METADATA: $CH ΓÇö $SLUG ==="
          jq -n --arg t "$TOPIC" --arg s "$SLUG" '{topic:$t, slug:$s}' \
            > "data/research/$CH/next-topic.json"
          node src/utils/pipeline.js "$CH" --step 5 || echo "WARN: metadata generation had issues"

      - name: Ollama request log
        if: always()
        run: |
          # One line per model request: status, duration, endpoint. Plus any
          # prompt-truncation warnings. This is where prep time actually goes.
          grep -E "\[GIN\]|truncat|error|level=WARN" /tmp/ollama.log | tail -60 || echo "(no ollama log)"

      # —— Commit this run's script (the record a fix is verified against) —
      # render_only re-renders the latest COMMITTED shorts script. Until this step, a
      # script existed only inside the prep upload-artifact bundle, so a render that
      # failed could not be reproduced from git. Pushed on dry runs too. Only when the
      # script gate passed (a blocked script is never committed).
      - name: Commit this run's script and research
        if: steps.reserve.outputs.skip != 'true' && steps.script.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          FILES=$(ls "data/research/$CH/${SLUG}-shorts-script.json" "data/research/$CH/$SLUG.json" 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "::warning::no script to commit for channel $CH"; exit 0; fi
          git config user.name  "pipeline-bot"
          git config user.email "pipeline@youtube-automation.local"
          git add -- $FILES
          if git diff --staged --quiet; then echo "script already committed"; exit 0; fi
          git commit -q -m "script: ch-$CH $SLUG (run ${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}"; then
              echo "committed $FILES"; exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push the script for channel $CH"; exit 1

      # —— Prep status + artifact (ALWAYS uploaded) ———————————————————————
      # A channel that skipped (all candidates duplicate) still uploads an
      # artifact carrying {"skipped": true}, so its render job can see WHY
      # there is nothing to render instead of failing on a missing artifact.
      - name: Write prep status
        if: always()
        run: |
          CH="${{ matrix.channel_id }}"
          mkdir -p data/prep-status
          if [ "${{ steps.reserve.outputs.skip }}" = "true" ]; then
            echo '{"skipped": true, "reason": "duplicate-topic"}' > "data/prep-status/$CH.json"
          elif [ "${{ steps.script.outputs.skip }}" = "true" ]; then
            echo '{"skipped": true, "reason": "${{ steps.script.outputs.skip_reason || 'script-validation' }}"}' > "data/prep-status/$CH.json"
          else
            echo "{\"skipped\": false, \"prep\": \"${{ job.status }}\"}" > "data/prep-status/$CH.json"
          fi
          cat "data/prep-status/$CH.json"

      - name: Upload prep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/prep-status/
            data/research/${{ matrix.channel_id }}/
            data/tts/${{ matrix.channel_id }}/
            data/thumbnails/${{ matrix.channel_id }}/
            data/ci-runs/blocked-script-specificity-${{ matrix.channel_id }}.txt
            data/ci-runs/blocked-voice-${{ matrix.channel_id }}.txt
            data/ci-runs/blocked-claims-${{ matrix.channel_id }}.txt
            data/ci-runs/blocked-script-narrative-${{ matrix.channel_id }}.txt
          retention-days: 1

      # A reservation whose video never gets made is released, so a failed
      # or cancelled prep ΓÇö or a channel skipped by the voice gate ΓÇö doesn't
      # block that topic for 90 days.
      - name: Release topic reservation (prep failed)
        if: (failure() || cancelled() || steps.script.outputs.skip == 'true') && steps.reserve.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG="${{ steps.reserve.outputs.slug }}"
          git config user.name  "pipeline-bot"
          git config user.email "pipeline@youtube-automation.local"
          git stash --include-untracked -q || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${{ github.ref_name }}"
            git reset -q --hard "origin/${{ github.ref_name }}"
            node scripts/release-topic.js "$CH" "$SLUG"
            git add data/topic-log.json
            if git diff --staged --quiet; then break; fi
            git commit -q -m "topic: release ch-$CH $SLUG (prep failed, run ${{ github.run_id }})"
            if git push -q origin "HEAD:${{ github.ref_name }}"; then break; fi
            sleep $((attempt * 3))
          done

  # ============================================================
  # STAGE 2: RENDER
  # ============================================================
  render:
    needs: [setup, prep]
    # !cancelled() stops renders when the RUN is cancelled. It no longer
    # also requires needs.prep.result != 'cancelled': that is the matrix's
    # AGGREGATE result, so one prep leg hitting its 18-min timeout
    # (run 36367836941, ch-2 research) skipped every channel's render. A
    # channel whose own prep died still fails its render leg at "Check prep
    # status" (no artifact) ΓÇö honestly, and only that channel.
    if: ${{ !cancelled() && github.event.inputs.publish != 'true' }}
    runs-on: ubuntu-latest
    # 20 min was not enough once six renders competed for runners alongside the Ollama model
    # pulls: run 37380168306 SIGTERMed ch-9, ch-44 and ch-49 at 22:16/22:17/22:18 - all three
    # at the job timeout, ~20 min after the 22:05 start - and exit 143 is indistinguishable
    # from a crash in the log. The fast render finished (ch-2, rejected on canvas checks); the
    # slow ones were killed. Raised to 45, then the dispatch input default to 90:
    # with a 20-min default the daily schedule killed ch-1 at 22% (run 39308784564).
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '90') }}
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      # 6 (2026-10-09): 4 made a ten-channel board an hour; the quota burn it was set against was mostly the SFX judge,
      # whose verdicts are cached per file now.
      max-parallel: 6
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)

      - name: Verify a single Remotion version
        run: |
          # The frame-0 AudioForRendering crash came from mixed remotion copies.
          V=$(find node_modules src/skills/remotion-render/node_modules -path '*/node_modules/remotion/package.json' -exec node -p "require('./{}').version" \; | sort -u)
          echo "remotion versions installed: $V"
          [ "$(echo "$V" | wc -l)" -eq 1 ] || { echo "::error::more than one remotion version installed"; exit 1; }

      - name: Download prep artifacts
        uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.channel_id }}-${{ github.run_id }}
          path: data/

      - name: Check prep status
        id: status
        run: |
          CH="${{ matrix.channel_id }}"
          F="data/prep-status/$CH.json"
          if [ ! -f "$F" ]; then
            echo "::error::prep artifact for channel $CH has no status file"
            exit 1
          fi
          cat "$F"
          if [ "$(jq -r .skipped "$F")" = "true" ]; then
            echo "::notice::Channel $CH skipped in prep ($(jq -r .reason "$F")) ΓÇö nothing to render"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure ffmpeg/ffprobe
        if: steps.status.outputs.skip != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - uses: browser-actions/setup-chrome@v1
        if: steps.status.outputs.skip != 'true'
        with:
          chrome-version: stable

      - uses: actions/setup-python@v5
        if: steps.status.outputs.skip != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # edge-tts too: a voiceover without word timings (from before
      # tts_words.py) is re-synthesized by render-and-qa.js before planning.
      - name: Install edge-tts
        if: steps.status.outputs.skip != 'true'
        run: pip install --quiet edge-tts

      # On-demand cutouts (scripts/fetch-cutout-once.cjs): each beat's cutout
      # is fetched, isolated (rembg u2net) and verified before the render.
      - name: Cache rembg (pip + u2net model)
        if: steps.status.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.u2net
          key: rembg-render-${{ runner.os }}-v1

      - name: Install rembg
        if: steps.status.outputs.skip != 'true'
        run: |
          pip install "rembg[cpu]" pillow numpy
          python -c "from rembg import remove; print('rembg ok')"
          python -c "from rembg import new_session; new_session('u2net'); print('u2net model cached')"

      - name: Cache Remotion Chrome
        if: steps.status.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-chrome-${{ runner.os }}

      # Layer 2 (scripts/eval-layer2-wire.js): CLIP weights (Xenova/clip-vit-base-patch32, ~350 MB).
      # The wire points @xenova/transformers' cacheDir at ~/.cache/huggingface/transformers-js, so
      # this path is where the weights actually land (the library's own default is
      # node_modules/@xenova/transformers/.cache, which this cache would not cover).
      - name: Cache HuggingFace models
        if: steps.status.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-clip-vit-base-patch32
          restore-keys: hf-${{ runner.os }}-

      # The local models behind every model call (src/lib/llm.js): Gemini
      # first, Ollama when Gemini cannot answer ΓÇö or Ollama only with
      # force_planner=ollama. qwen2.5:7b answers the text calls (planner,
      # challenger); qwen2.5vl:3b answers the calls that carry frames (beat
      # check, frame reviews, section-7 QA) ΓÇö qwen2.5:7b cannot see images.
      - name: Ollama (text + vision models)
        if: steps.status.outputs.skip != 'true'
        uses: ./.github/actions/ollama
        with:
          # qwen2.5:14b was dropped from this job (2026-10-08): warming it
          # (~9-12 GB with a 16k context) beside Chrome + rembg on the 15 GB
          # runner is what lost 4 of 10 render runners in run 37776924101
          # ("received a shutdown signal", exit 143, 1.5-5 min into the job).
          # The challenger's local tier is qwen2.5:7b (OLLAMA_CHALLENGER_MODEL).
          models: "qwen2.5:7b qwen2.5vl:3b"
          cache-key: ollama-${{ runner.os }}-qwen2.5-7b+qwen2.5vl-3b
          # Nothing stays resident: the render and Chromium need the RAM.
          unload-after-warm: "true"
          # Pull only; a model is loaded only when a fallback call reaches it.
          warm: "false"
          # Pull in the background: the job renders while 17 GB download
          # (the local models are the LAST tier ΓÇö Gemini, then Groq, first).
          background: "true"

      # SFX (scripts/sfx-cc0.mjs): five CC0 recordings from Remotion's library, no API key. Fetched
      # once and kept in the runner cache; every run re-judges them (Gemini listens: recorded or
      # robotic) and only "recorded" files play. A failed fetch or judge means a video with no SFX,
      # never a failed render and never an unjudged sound.
      # THE RESPONSE CACHE (owner, 2026-10-10: `.cache/gemini` was not in any cache path, so no gate's answer survived to the next board and every
      # identical request was paid for again). Keyed on the client and on the verifier that writes into it, so a client change starts clean.
      # save-always: a channel whose gate fails still saves the answers it paid for. A per-run key plus a prefix restore: the newest entry wins.
      - name: Cache Gemini responses
        if: steps.status.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/gemini
            .cache/cutout-verify
          key: gemini-resp-${{ runner.os }}-${{ hashFiles('src/lib/gemini-client.js', 'src/lib/llm.js', 'scripts/verify-cutout-image.cjs') }}-${{ github.run_id }}
          restore-keys: |
            gemini-resp-${{ runner.os }}-${{ hashFiles('src/lib/gemini-client.js', 'src/lib/llm.js', 'scripts/verify-cutout-image.cjs') }}-
          save-always: true

      - name: Cache CC0 SFX
        if: steps.status.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: src/skills/remotion-render/public/sfx/cc0
          key: sfx-cc0-v2   # bump when SFX_SOURCES changes; verdicts inside are keyed by each file's sha256

      - name: Fetch CC0 SFX
        if: steps.status.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/sfx-cc0.mjs fetch

      # The verdicts judged ONCE in setup (above). Copied where the render reads them; a missing file means no SFX play, never an unjudged one.
      - name: Use the SFX verdicts from setup
        if: steps.status.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sfx-verdicts
          path: sfx-verdicts-in
      - name: Place the SFX verdicts for the render
        if: steps.status.outputs.skip != 'true'
        continue-on-error: true
        run: |
          mkdir -p src/skills/remotion-render/public/sfx/cc0 data/sfx
          if [ -f sfx-verdicts-in/verdicts.json ]; then
            cp sfx-verdicts-in/verdicts.json src/skills/remotion-render/public/sfx/cc0/verdicts.json
            cp sfx-verdicts-in/verdicts.json data/sfx/verdicts.json
            echo "SFX verdicts placed from setup"
          else
            echo "::warning::no SFX verdicts from setup ΓÇö no SFX will play this board"
          fi

      # Editor timeline, built automatically from this run's script, research and voiceover (scripts/editor/auto-timeline.mjs): one
      # scene per spoken sentence, timed by the voiceover; a verified Wikimedia photo of a named entity, else a figure card (numbers
      # the research states) or a statement card. It exports EDITOR_TIMELINE_MAP for the render step. With EDITOR_STRICT=1 a script
      # that cannot get a valid timeline FAILS this job loudly; it never falls back to another renderer.
      - name: Build editor timeline
        if: steps.status.outputs.skip != 'true'
        run: node scripts/editor/auto-timeline.mjs --channel "${{ matrix.channel_id }}" --github-env

      - name: Render + QA
        if: steps.status.outputs.skip != 'true'
        env:
          RENDER_PROGRESS_MS: 10000
          # Local fallback (scripts/ollama-client.cjs). force_planner=ollama
          # routes EVERY model call to Ollama; Gemini is never called.
          OLLAMA_TEXT_MODEL: qwen2.5:7b
          OLLAMA_VISION_MODEL: qwen2.5vl:3b
          OLLAMA_CHALLENGER_MODEL: qwen2.5:7b
          # Second tier of the chain (Gemini ΓåÆ Groq ΓåÆ Ollama): scripts/groq-client.cjs.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # The models this account's key can call (GET /openai/v1/models);
          # llama-3.3-70b / llama-3.2-90b-vision answer 404 on it.
          # qwen3.8-27b takes at most 3 images per request.
          GROQ_TEXT_MODEL: openai/gpt-oss-120b
          GROQ_CHALLENGER_MODEL: openai/gpt-oss-120b
          GROQ_VISION_MODEL: qwen/qwen3.8-27b
          GROQ_MAX_IMAGES: "3"
          FORCE_PLANNER: ${{ github.event.inputs.force_planner }}
          # The job budget: render-and-qa.js stops correction attempts inside
          # it, and every model call is capped at a share of it. Must match the
          # render job's own timeout-minutes default (45, line ~905): at 20 the
          # budget was 15 min, so a 13-min first attempt (ch-9, run 38100803605)
          # refused the frame-review correction re-render that would have fit.
          # Confirmed still needed after this landed: run 38102260955 ch-9
          # logged "attempt 2 would take ~9.6 min at 10.0 min in" (19.6 total)
          # against a 15-min budget -> "no further attempt" again. Same
          # proxy/artifact split sizes the vision caps (gate-visual-qa.js:227,
          # ollama-client.cjs:145), which were likewise built for a job half
          # as long as the real one.
          JOB_TIMEOUT_MIN: ${{ github.event.inputs.timeout_minutes || '90' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # gemini-client makes ONE attempt (429 -> quota_exhausted at once,
          # 503 -> one retry after 5 s); any failure goes to Ollama.
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VISION_API_KEY: ${{ secrets.GEMINI_API_KEY_4 || secrets.GEMINI_API_KEY }}
          VISION_MODEL: gemini-3.5-flash-lite
          # OpenRouter is the second tier of every model chain (llm.js, the image verifiers, gemini-client's
          # quota fallback). It was never passed to THIS step, so on 2026-10-16 every render-side call went
          # Gemini 429 -> "openrouter: no_key" -> Groq rate limit -> a 3B Ollama model (board 38889577784).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Real-asset fetcher (scripts/fetch-assets.cjs). Unset secrets are
          # empty and that source is skipped with a logged reason ΓÇö
          # data/ci-runs/blocked-asset-api-keys.txt.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # QA is ON. --skip-qa was on every CI run until docs/AI-DECISION-AUDIT.md
        # showed 0 of 31 Gemini beats reached the screen while every gate
        # passed. The challenger (plan vs script) and the per-beat frame check
        # (frame vs sentence) now run on every video; so does the Gemini
        # review/correction loop.
        run: node scripts/render-and-qa.js --channel "${{ matrix.channel_id }}"

      # Backup QA (scripts/local-audit.cjs): a video an AI stage failed is
      # queued for a human, never uploaded. The queues live on the runner, so
      # they are uploaded as an artifact or they would vanish with the job.
      - name: QA counts
        if: always() && steps.status.outputs.skip != 'true'
        run: |
          if [ -f data/renders/qa-counts.json ]; then
            A=$(jq -r '.approved' data/renders/qa-counts.json)
          else
            A=0; echo "::warning::render-and-qa.js wrote no qa-counts.json (it did not reach its summary)"
          fi
          R=$(ls data/renders/approved-review/*.json 2>/dev/null | wc -l)
          J=$(ls data/renders/rejected/*.json 2>/dev/null | wc -l)
          echo "Approved: $A ┬╖ Approved-review: $R ┬╖ Rejected: $J"
          echo "### Channel ${{ matrix.channel_id }} ΓÇö Approved: $A ┬╖ Approved-review: $R ┬╖ Rejected: $J" >> "$GITHUB_STEP_SUMMARY"
          for f in data/renders/approved/*.json data/renders/approved-review/*.json data/renders/rejected/*.json; do
            [ -f "$f" ] && echo "  $f: $(jq -c '{verdict, failed_stage, failed_check, reason, duration_s}' "$f")"
          done
          # Nothing is deleted: an MP4 left in the channel's render dir is outside every queue.
          for f in data/renders/${{ matrix.channel_id }}/*.mp4; do
            [ -f "$f" ] && echo "::error::$f is in no queue (approved / approved-review / rejected)"
          done
          true

      - name: Upload QA review queues
        if: always() && steps.status.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-queues-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/renders/approved/
            data/renders/approved-review/
            data/renders/rejected/
          if-no-files-found: ignore
          retention-days: 14

      # The eval loop's JSONL (layer1_result, Layer 2 advisory, Layer 3 axes) and the Layer 3
      # provenance: gitignored runner state that was lost when the job ended.
      - name: Upload eval-loop audit
        if: always() && steps.status.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-audit-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/audit/eval-loop/
            data/audit/layer3/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload rendered video
        if: always() && steps.status.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/renders/${{ matrix.channel_id }}/
            data/visual-plans/${{ matrix.channel_id }}/
            data/renders/qa-counts.json
            src/skills/remotion-render/public/asset-library/manifest.json
          retention-days: 7

      # No-render must not pass (run 37380168306, ch-1).
      # ch-1's render job reported SUCCESS while rendering nothing. Its prep leg had
      # legitimately skipped the channel - the claims gate rejected the script
      # ("INVENTED claims after the re-ask ... nothing was rendered or uploaded",
      # prep-status/1.json = {"skipped": true, "reason": "claims"}) - and every render
      # step is gated on `skip != 'true'`, so all of them skipped and the job passed
      # vacuously. Same fail-loud principle as REVIEW_FAILED and PROVIDER_UNAVAILABLE: an
      # outcome that produced no video is not a pass.
      #
      # This softens nothing. It only refuses to report a vacuous success, and it reports
      # the two reasons separately so a legitimate content rejection stays
      # distinguishable from a render that completed and silently produced nothing - the
      # first is a content decision, the second is a defect.
      - name: Assert a video was rendered
        if: always()
        run: |
          MP4S=$(find data/renders -name '*.mp4' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "${{ steps.status.outputs.skip }}" = "true" ]; then
            echo "::error::NO RENDER - the prep leg skipped this channel (reason recorded in prep-status/*.json). Nothing was rendered or uploaded."
            exit 1
          fi
          if [ "$MP4S" -eq 0 ]; then
            echo "::error::NO RENDER - Render + QA ran but produced no MP4 under data/renders."
            exit 1
          fi
          echo "rendered $MP4S file(s) under data/renders"

      # —— Publish (private) ——————————————————————————————————————————————
      # main only (audit 2026-10-03): a dispatch with --ref <other branch> renders but never
      # reads the OAuth secrets or uploads. 135 v2 dispatches ran on a development branch.
      - name: Materialize OAuth credentials
        id: creds
        # always(): a failed render must not strand an ALREADY-uploaded private
        # video past its go_public_at (ch-1 hOYJOrB9lR4 sat private 8 h on
        # 2026-10-20 because the render step failed before this one ran).
        if: always() && github.ref == 'refs/heads/main' && steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true'
        env:
          CH01_CLIENT_ID:       ${{ secrets.CHANNEL_01_CLIENT_ID }}
          CH01_CLIENT_SECRET:   ${{ secrets.CHANNEL_01_CLIENT_SECRET }}
          CH01_REFRESH_TOKEN:   ${{ secrets.CHANNEL_01_REFRESH_TOKEN }}
          CH02_CLIENT_ID:       ${{ secrets.CHANNEL_02_CLIENT_ID }}
          CH02_CLIENT_SECRET:   ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
          CH02_REFRESH_TOKEN:   ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
          CH09_CLIENT_ID:       ${{ secrets.CHANNEL_09_CLIENT_ID }}
          CH09_CLIENT_SECRET:   ${{ secrets.CHANNEL_09_CLIENT_SECRET }}
          CH09_REFRESH_TOKEN:   ${{ secrets.CHANNEL_09_REFRESH_TOKEN }}
          CH26_CLIENT_ID:       ${{ secrets.CHANNEL_26_CLIENT_ID }}
          CH26_CLIENT_SECRET:   ${{ secrets.CHANNEL_26_CLIENT_SECRET }}
          CH26_REFRESH_TOKEN:   ${{ secrets.CHANNEL_26_REFRESH_TOKEN }}
          CH44_CLIENT_ID:       ${{ secrets.CHANNEL_44_CLIENT_ID }}
          CH44_CLIENT_SECRET:   ${{ secrets.CHANNEL_44_CLIENT_SECRET }}
          CH44_REFRESH_TOKEN:   ${{ secrets.CHANNEL_44_REFRESH_TOKEN }}
          CH05_CLIENT_ID:       ${{ secrets.CHANNEL_05_CLIENT_ID }}
          CH05_CLIENT_SECRET:   ${{ secrets.CHANNEL_05_CLIENT_SECRET }}
          CH05_REFRESH_TOKEN:   ${{ secrets.CHANNEL_05_REFRESH_TOKEN }}
          CH06_CLIENT_ID:       ${{ secrets.CHANNEL_06_CLIENT_ID }}
          CH06_CLIENT_SECRET:   ${{ secrets.CHANNEL_06_CLIENT_SECRET }}
          CH06_REFRESH_TOKEN:   ${{ secrets.CHANNEL_06_REFRESH_TOKEN }}
          CH08_CLIENT_ID:       ${{ secrets.CHANNEL_08_CLIENT_ID }}
          CH08_CLIENT_SECRET:   ${{ secrets.CHANNEL_08_CLIENT_SECRET }}
          CH08_REFRESH_TOKEN:   ${{ secrets.CHANNEL_08_REFRESH_TOKEN }}
          CH10_CLIENT_ID:       ${{ secrets.CHANNEL_10_CLIENT_ID }}
          CH10_CLIENT_SECRET:   ${{ secrets.CHANNEL_10_CLIENT_SECRET }}
          CH10_REFRESH_TOKEN:   ${{ secrets.CHANNEL_10_REFRESH_TOKEN }}
          CH49_CLIENT_ID:       ${{ secrets.CHANNEL_49_CLIENT_ID }}
          CH49_CLIENT_SECRET:   ${{ secrets.CHANNEL_49_CLIENT_SECRET }}
          CH49_REFRESH_TOKEN:   ${{ secrets.CHANNEL_49_REFRESH_TOKEN }}
          CH48_CLIENT_ID:       ${{ secrets.CHANNEL_48_CLIENT_ID }}
          CH48_CLIENT_SECRET:   ${{ secrets.CHANNEL_48_CLIENT_SECRET }}
          CH48_REFRESH_TOKEN:   ${{ secrets.CHANNEL_48_REFRESH_TOKEN }}
          
        run: |
          mkdir -p config/creds
          # The matrix key is the upload slot (the bare number from channel_id), so resolve it
          # through the shared channel-lookup ΓÇö never by config id, which is duplicated for legacy
          # rows. Padding the slot is what names the file; run.js requires the row's own path.
          node -e "
            const fs = require('fs');
            const id = String(Number('${{ matrix.channel_id }}'));
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            let ch;
            try { ch = resolveChannel(id); } catch (e) { console.error('::error::' + e.message); process.exit(1); }
            const publishSet = JSON.parse(fs.readFileSync('config/priority-channels.json', 'utf8')).channels.map(String);
            if (!publishSet.includes(id)) {
              console.log('::notice::channel ' + id + ' is not in config/priority-channels.json: it runs to the end (render + QA) and stops before upload; no credentials are needed');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
              process.exit(0);
            }
            const own = 'config/creds/' + ch.channel_id + '.json';
            const declared = ch.youtube_credentials_path || own;
            if (declared !== own) { console.error('::error::channel ' + id + ' declares ' + declared + ', not its own credentials file ' + own); process.exit(1); }
            const p = String(ch.channel_id).replace(/^ch-0*/, '').padStart(2, '0');
            const clientId = process.env['CH' + p + '_CLIENT_ID'];
            const clientSecret = process.env['CH' + p + '_CLIENT_SECRET'];
            const refreshToken = process.env['CH' + p + '_REFRESH_TOKEN'];
            if (!(clientId && clientSecret && refreshToken)) {
              console.error('::error::No credentials configured for ' + ch.channel_id + ' (dispatch key ' + id + '): missing CH' + p + '_* secrets');
              process.exit(1);
            }
            fs.writeFileSync(own, JSON.stringify({client_id:clientId, client_secret:clientSecret, refresh_token:refreshToken}, null, 2));
            console.log('Credentials materialized for ' + ch.channel_id + ' (dispatch key ' + id + ')');
          "

      - name: Publish to YouTube (private)
        if: steps.creds.outputs.publish != 'false' && github.ref == 'refs/heads/main' && steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true'
        run: node src/skills/youtube-publish/run.js "${{ matrix.channel_id }}"

      - name: Process publish queue
        # always(): this flips videos the DAILY RUN ALREADY UPLOADED private;
        # today's render failing has nothing to do with yesterday's queue entry
        # (the watch item behind the ch-1 hOYJOrB9lR4 delay, 2026-10-20).
        if: always() && steps.creds.outputs.publish != 'false' && github.ref == 'refs/heads/main' && steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true' && github.event.inputs.hold_public != 'true'
        run: node src/skills/youtube-publish/run.js process-queue

      - name: Commit publish queue
        if: always() && github.ref == 'refs/heads/main' && steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ matrix.channel_id }}"
          git config user.name  "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/publish-queue
          if git diff --cached --quiet; then
            echo "Publish queue unchanged ΓÇö nothing to commit."
            exit 0
          fi
          git commit -m "publish-queue: ch-$CH $(date -u +%F) [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git checkout -- data/research data/tts data/thumbnails data/renders 2>/dev/null || true
            # downloaded artifacts are untracked copies of files main may already hold: they block the rebase
            # (run 39344506422 ch-1: the queue entry was committed but never pushed; video stayed private)
            git clean -fdq -- data ':!data/publish-queue'
            # --autostash: the render leaves other tracked files modified (run 39031532519 ch-1: "cannot rebase: You have unstaged changes", queue never pushed)
            git rebase --autostash "origin/${{ github.ref_name }}" || git rebase --abort
            if git push origin "${{ github.ref_name }}"; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Push conflict ΓÇö retrying ($attempt/5) ..."
              sleep $((attempt * 2))
            else
              echo "::error::Could not push publish-queue for channel $CH after 5 attempts"
              exit 1
            fi
          done

  # ============================================================
  # REVIEW-PUBLISH (manual only): upload a past run's approved-review
  # videos, PRIVATE, to the six publish channels. Never on cron ΓÇö the
  # schedule event has no inputs, so this `if` is false there. Replaces
  # the deprecated review-publish workflow (.github/workflows-deprecated/).
  #   gh workflow run daily-pipeline-v2.yml --ref main \
  #     -f publish=true -f review_run_id=<run> -f channels=44
  # ============================================================
  review-publish:
    # THE CRON REACHES THIS JOB. It used to require
    # `github.event_name == 'workflow_dispatch' && inputs.publish == 'true'`, the
    # only gate in the workflow keyed on event_name, so a SCHEDULE event skipped
    # it outright: the 06:00 cron rendered every day and uploaded nothing, ever.
    #
    # A schedule has no inputs, so the two things this job needs come from the
    # run itself: the channel from the matrix, and the review run id from
    # github.run_id (this run's own artifacts, which is where a daily run's
    # queues are). A dispatch still takes both from inputs, unchanged - note
    # render is skipped when inputs.publish == 'true', so a dispatch publish
    # deliberately re-publishes an EARLIER run rather than running one.
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')) }}
    needs: [setup, prep, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve what to publish
        id: target
        env:
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          # The RAW inputs, read from the event. These must NOT point at this
          # step's own outputs: 468e0531 did that with a blanket search-and-
          # replace, so RUN and CHANNELS resolved to their own empty output and
          # the publish step failed with "no channels given" on a dispatch that
          # had passed both flags correctly. Only steps DOWNSTREAM read the outputs.
          REQUESTED: ${{ github.event.inputs.channels }}
          INPUT_RUN: ${{ github.event.inputs.review_run_id }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # One source of truth for the two things every later step needs.
          if [ "$IS_SCHEDULE" = "true" ]; then
            # A daily run publishes what THIS run just produced. Its channels are
            # the priority set the render job was given; there are no inputs.
            RUN="$THIS_RUN"
            CHANNELS=$(node -e "console.log(require('./config/priority-channels.json').channels.join(','))")
            echo "SCHEDULE event: publishing this run's approved-review videos (run $RUN) for channels $CHANNELS"
          else
            RUN="$INPUT_RUN"
            CHANNELS="$REQUESTED"
            echo "DISPATCH event: publishing run $RUN for channels $CHANNELS"
          fi
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"

      - name: Check inputs (approved channels only)
        env:
          REQUESTED: ${{ steps.target.outputs.channels }}
          REVIEW_RUN: ${{ steps.target.outputs.run_id }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          node -e "
            const PUBLISH_CHANNELS = require('./config/priority-channels.json').channels.map(Number);
            const ids = (process.env.REQUESTED || '').split(',').map(s => s.trim().replace(/^ch-?/i, '')).filter(Boolean).map(Number);
            const bad = ids.filter(id => !PUBLISH_CHANNELS.includes(id));
            if (!ids.length) { console.error('::error::no channels given'); process.exit(1); }
            if (bad.length) { console.error('::error::not a publish channel: ' + bad.join(', ') + ' ΓÇö uploads are allowed only to ' + PUBLISH_CHANNELS.join(', ')); process.exit(1); }
            if (!/^[0-9]+$/.test(process.env.REVIEW_RUN || '')) { console.error('::error::review_run_id must be the numeric id of a pipeline run'); process.exit(1); }
            console.log('Publishing approved-review videos of run ' + process.env.REVIEW_RUN + ' for channel(s) ' + ids.join(', ') + ' (private)');
          "

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # qa-queues-* holds approved/, approved-review/, rejected/ (artifact root data/renders/).
      - name: Download the run's review queues
        uses: actions/download-artifact@v4
        with:
          pattern: qa-queues-*-${{ steps.target.outputs.run_id }}
          path: data/renders/
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # data/renders/<ch>/ (image credits, needed for CC-BY attribution in the description).
      - name: Download the run's render folders
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: rendered-*-${{ steps.target.outputs.run_id }}
          path: .
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # SEO metadata + thumbnails. prep-* artifacts are kept 1 day: after that this step finds
      # nothing and run.js uploads with the channel's fallback title (it logs a WARNING).
      - name: Download the run's prep folders (SEO, thumbnails)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: prep-*-${{ steps.target.outputs.run_id }}
          path: data/
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize OAuth credentials
        id: creds
        env:
          REQUESTED: ${{ steps.target.outputs.channels }}
          CH01_CLIENT_ID:       ${{ secrets.CHANNEL_01_CLIENT_ID }}
          CH01_CLIENT_SECRET:   ${{ secrets.CHANNEL_01_CLIENT_SECRET }}
          CH01_REFRESH_TOKEN:   ${{ secrets.CHANNEL_01_REFRESH_TOKEN }}
          CH02_CLIENT_ID:       ${{ secrets.CHANNEL_02_CLIENT_ID }}
          CH02_CLIENT_SECRET:   ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
          CH02_REFRESH_TOKEN:   ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
          CH09_CLIENT_ID:       ${{ secrets.CHANNEL_09_CLIENT_ID }}
          CH09_CLIENT_SECRET:   ${{ secrets.CHANNEL_09_CLIENT_SECRET }}
          CH09_REFRESH_TOKEN:   ${{ secrets.CHANNEL_09_REFRESH_TOKEN }}
          CH26_CLIENT_ID:       ${{ secrets.CHANNEL_26_CLIENT_ID }}
          CH26_CLIENT_SECRET:   ${{ secrets.CHANNEL_26_CLIENT_SECRET }}
          CH26_REFRESH_TOKEN:   ${{ secrets.CHANNEL_26_REFRESH_TOKEN }}
          CH44_CLIENT_ID:       ${{ secrets.CHANNEL_44_CLIENT_ID }}
          CH44_CLIENT_SECRET:   ${{ secrets.CHANNEL_44_CLIENT_SECRET }}
          CH44_REFRESH_TOKEN:   ${{ secrets.CHANNEL_44_REFRESH_TOKEN }}
          CH05_CLIENT_ID:       ${{ secrets.CHANNEL_05_CLIENT_ID }}
          CH05_CLIENT_SECRET:   ${{ secrets.CHANNEL_05_CLIENT_SECRET }}
          CH05_REFRESH_TOKEN:   ${{ secrets.CHANNEL_05_REFRESH_TOKEN }}
          CH06_CLIENT_ID:       ${{ secrets.CHANNEL_06_CLIENT_ID }}
          CH06_CLIENT_SECRET:   ${{ secrets.CHANNEL_06_CLIENT_SECRET }}
          CH06_REFRESH_TOKEN:   ${{ secrets.CHANNEL_06_REFRESH_TOKEN }}
          CH08_CLIENT_ID:       ${{ secrets.CHANNEL_08_CLIENT_ID }}
          CH08_CLIENT_SECRET:   ${{ secrets.CHANNEL_08_CLIENT_SECRET }}
          CH08_REFRESH_TOKEN:   ${{ secrets.CHANNEL_08_REFRESH_TOKEN }}
          CH10_CLIENT_ID:       ${{ secrets.CHANNEL_10_CLIENT_ID }}
          CH10_CLIENT_SECRET:   ${{ secrets.CHANNEL_10_CLIENT_SECRET }}
          CH10_REFRESH_TOKEN:   ${{ secrets.CHANNEL_10_REFRESH_TOKEN }}
          CH49_CLIENT_ID:       ${{ secrets.CHANNEL_49_CLIENT_ID }}
          CH49_CLIENT_SECRET:   ${{ secrets.CHANNEL_49_CLIENT_SECRET }}
          CH49_REFRESH_TOKEN:   ${{ secrets.CHANNEL_49_REFRESH_TOKEN }}
          CH48_CLIENT_ID:       ${{ secrets.CHANNEL_48_CLIENT_ID }}
          CH48_CLIENT_SECRET:   ${{ secrets.CHANNEL_48_CLIENT_SECRET }}
          CH48_REFRESH_TOKEN:   ${{ secrets.CHANNEL_48_REFRESH_TOKEN }}
          
        # A channel with no OAuth secrets is SKIPPED with a warning, not fatal: exiting on the first one stopped the whole upload, so the 2026-10-16
        # cron (run 38890511624) uploaded nothing for 1/2/9/26/44, which have secrets, because ch-49 (6th in the list) has none.
        run: |
          mkdir -p config/creds
          # Same resolution as the render job: the key is the upload slot, resolved through
          # channel-lookup, never by config id. A row pointing at another channel's credentials
          # file is skipped with a warning, as is a row with no secrets.
          node -e "
            const fs = require('fs');
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            const ok = [];
            for (const id of process.env.REQUESTED.split(',').map(s => s.trim().replace(/^ch-?/i, '')).filter(Boolean)) {
              const n = String(Number(id));
              let ch;
              try { ch = resolveChannel(n); } catch (e) { console.log('::warning::' + e.message + ' - skipped'); continue; }
              const own = 'config/creds/' + ch.channel_id + '.json';
              const declared = ch.youtube_credentials_path || own;
              if (declared !== own) { console.log('::warning::channel ' + n + ' declares ' + declared + ', not its own ' + own + ' - skipped'); continue; }
              const p = String(ch.channel_id).replace(/^ch-0*/, '').padStart(2, '0');
              const c = { client_id: process.env['CH' + p + '_CLIENT_ID'], client_secret: process.env['CH' + p + '_CLIENT_SECRET'], refresh_token: process.env['CH' + p + '_REFRESH_TOKEN'] };
              if (!(c.client_id && c.client_secret && c.refresh_token)) { console.log('::warning::No credentials configured for ' + ch.channel_id + ' (dispatch key ' + n + ') - its video stays in the review queue, not uploaded'); continue; }
              fs.writeFileSync(own, JSON.stringify(c, null, 2));
              console.log('Credentials materialized for ' + ch.channel_id + ' (dispatch key ' + n + ')');
              ok.push(n);
            }
            if (!ok.length) console.log('::warning::no requested channel has credentials - nothing can be uploaded');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'channels=' + ok.join(',') + '\\n');
          "

      # run.js --review: approved-review/ only, marker must match the channel, refuses any
      # channel outside config/priority-channels.json, uploads privacyStatus "private", and
      # queues the entry cancelled so process-queue never makes it public.
      - name: Publish approved-review videos (private)
        if: steps.creds.outputs.channels != ''
        env:
          REQUESTED: ${{ steps.creds.outputs.channels }}
        run: |
          # On a SCHEDULE run the render job has already uploaded (or tried to upload) every approved/ video of this very run. Its record of
          # that is the publish-queue it pushes, and when that push failed (run 39031532519 ch-1: "cannot rebase") this job uploaded the same
          # render a second time. approved/ belongs to the render job here; this job takes approved-review/ only. A dispatch keeps both queues.
          if [ "${{ github.event_name }}" = "schedule" ]; then rm -rf data/renders/approved; echo "schedule: approved/ was the render job's to upload ΓÇö approved-review/ only"; fi
          # Every channel here HAS credentials (the creds step only passes those on). Leave each one a log saying why nothing was published, or the digest
          # reads "no log" as "no OAuth credentials" (runs 40712679484 and 40899483670 reported that for ch-1/2/48 when no render had passed QA).
          ls -la data/renders/approved-review/ || {
            for CH in $(echo "$REQUESTED" | tr ',' ' '); do
              echo "No approved-review/ or approved/ renders found - run ${{ steps.target.outputs.run_id }} has no approved-review videos" > "/tmp/publish-out-$(echo "$CH" | sed -E 's/^ch-?//I; s/^0+//').log"
            done
            echo "::error::run ${{ steps.target.outputs.run_id }} has no approved-review videos (or its artifacts expired after 14 days)"; exit 1;
          }
          FAIL=0
          for CH in $(echo "$REQUESTED" | tr ',' ' '); do
            CH=$(echo "$CH" | sed -E 's/^ch-?//I; s/^0+//')
            # each channel's own outcome, for the digest (it reported a rejected OAuth secret as "no credentials" ΓÇö run 39031532519 ch-9/26/44)
            node src/skills/youtube-publish/run.js "$CH" --review > "/tmp/publish-out-$CH.log" 2>&1 || FAIL=1
            cat "/tmp/publish-out-$CH.log"
          done
          exit $FAIL

      # THE MORNING DIGEST. One file the owner reads each morning: what went up,
      # as PRIVATE, with a Studio link to click through and publish. Built from
      # data/publish-queue/, which review-publish has just committed and which
      # already records video_id, title, privacy_status and source_queue.
      # Written even when nothing uploaded, with the reason, so a silent morning
      # is legible rather than just empty.
      - name: Write the daily upload digest
        if: always()
        env:
          REVIEW_RUN: ${{ steps.target.outputs.run_id }}
          REQUESTED: ${{ steps.target.outputs.channels }}
        run: |
          export TODAY=$(date -u +%F)
          node -e '
            const fs = require("fs"), path = require("path");
            const TODAY = process.env.TODAY.slice(0, 10);
            const RUN = process.env.REVIEW_RUN;
            const dir = "data/publish-queue";
            const uploads = [];
            // The queues live in PER-CHANNEL folders (data/publish-queue/<ch>/publish-queue.json). The digest read only top-level files, found none, and
            // reported "Nothing was uploaded" and "no OAuth secrets" for a channel whose video had just gone up (run 38724865619, ch-2, zttQB2Wxeqc).
            const queueFiles = [];
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir)) {
                const full = path.join(dir, f);
                if (fs.statSync(full).isDirectory()) { for (const g of fs.readdirSync(full)) if (g.endsWith(".json")) queueFiles.push(path.join(full, g)); }
                else if (f.endsWith(".json")) queueFiles.push(full);
              }
            }
            {
              for (const full of queueFiles) {
                let rows = []; try { rows = JSON.parse(fs.readFileSync(full, "utf8")); } catch { continue; }
                if (!Array.isArray(rows)) continue;
                for (const e of rows) {
                  if (RUN && e.source_run && String(e.source_run) !== String(RUN)) continue;
                  if (!e.uploaded_at || String(e.uploaded_at).slice(0, 10) !== TODAY) continue;
                  uploads.push({
                    channel: e.channel_id, title: e.title, video_id: e.video_id,
                    privacy_status: e.privacy_status || "private",
                    source_queue: e.source_queue || "approved",
                    studio_link: "https://studio.youtube.com/video/" + e.video_id + "/edit",
                  });
                }
              }
            }
            uploads.sort((a, b) => String(a.channel).localeCompare(String(b.channel)));
            const requested = String(process.env.REQUESTED || "").split(",").map(s => s.trim()).filter(Boolean);
            const uploaded = (c) => uploads.some(u => String(u.channel).replace(/^0+/, "") === c.replace(/^0+/, ""));
            // What the publish step said for each channel it tried (no log = it had no credentials, so it was never tried).
            const outcome = {};
            for (const c of requested) {
              const n = c.replace(/^0+/, "");
              let log = null; try { log = fs.readFileSync("/tmp/publish-out-" + n + ".log", "utf8"); } catch {}
              if (uploaded(c)) continue;
              const err = log && (log.match(/ERROR: ([^\n]+)/) || [])[1];
              outcome[n] = !log ? "no OAuth credentials configured"
                : err ? "upload FAILED: " + err.slice(0, 160)
                : /No approved-review\/ or approved\/ renders found|No approved-review/.test(log) ? "no video passed QA this run"
                : /already uploaded as/.test(log) ? "already uploaded (" + ((log.match(/already uploaded as (\S+)/) || [])[1] || "") + ")"
                : "not uploaded (see the review-publish log)";
            }
            const noCreds = Object.keys(outcome).filter((c) => outcome[c] === "no OAuth credentials configured");
            const digest = {
              date: TODAY,
              review_run_id: RUN || null,
              generated_at: new Date().toISOString(),
              uploads,
              not_uploaded: outcome,
              no_credentials: noCreds,
              note: uploads.length
                ? "Everything above is PRIVATE. Open each Studio link and click Publish to make it public."
                : "Nothing was uploaded today ΓÇö see not_uploaded for each channel reason.",
            };
            fs.mkdirSync("data/uploaded", { recursive: true });
            fs.writeFileSync("data/uploaded/" + TODAY + ".json", JSON.stringify(digest, null, 2) + "\n");
            console.log("digest: data/uploaded/" + TODAY + ".json ΓÇö " + uploads.length + " uploaded");
          '

      - name: Commit the daily upload digest
        if: always()
        run: |
          git config user.name  "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          TODAY=$(date -u +%F)
          git add data/uploaded
          if git diff --cached --quiet; then echo "No digest changes."; exit 0; fi
          git commit -m "uploaded: digest for $TODAY (review-publish of run ${{ steps.target.outputs.run_id }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            # downloaded artifacts (data/research, data/renders, ...) are untracked copies of files main may already hold: they block the rebase
            git clean -fdq -- data ':!data/uploaded' ':!data/publish-queue'
            git rebase --autostash "origin/${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
            if [ "$attempt" -eq 5 ]; then echo "::error::Could not push the digest"; exit 1; fi
            sleep $((attempt * 2))
          done

      - name: Commit publish queue
        if: always()
        run: |
          git config user.name  "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/publish-queue
          if git diff --cached --quiet; then echo "Publish queue unchanged."; exit 0; fi
          git commit -m "publish-queue: review-publish of run ${{ steps.target.outputs.run_id }} [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            # downloaded artifacts (data/research, data/renders, ...) are untracked copies of files main may already hold: they block the rebase
            git clean -fdq -- data ':!data/uploaded' ':!data/publish-queue'
            git rebase --autostash "origin/${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then break; fi
            if [ "$attempt" -eq 5 ]; then echo "::error::Could not push the publish queue"; exit 1; fi
            sleep $((attempt * 2))
          done

  # ============================================================
  # PREVIEW: per-channel 6s clip, 8 frames, contact sheets, one
  # master sheet ΓÇö built on the runner, uploaded as one artifact.
  # Only rendered-* (MP4s + qa-counts.json) and qa-queues-* (queued
  # MP4s + verdict markers) are downloaded; prep-* is not needed.
  # ============================================================
  preview:
    needs: [render]
    if: always() && github.event.inputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --no-install-recommends: with recommends this pulled 130 MB and a
      # slow Azure mirror ran it past the old 15-min timeout (run 36906932610).
      - name: Install ffmpeg and ImageMagick
        # fonts-dejavu-core: without recommends no font is installed and
        # montage's sheet title failed "unable to read font (null)" (run 36915319430).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg imagemagick fonts-dejavu-core

      - name: Download rendered MP4s
        uses: actions/download-artifact@v4
        with:
          pattern: rendered-*-${{ github.run_id }}
          path: data/preview/raw

      - name: Download QA queues
        uses: actions/download-artifact@v4
        with:
          pattern: qa-queues-*-${{ github.run_id }}
          path: data/preview/raw

      - name: Build preview bundle
        env:
          PREVIEW_CHANNELS: ${{ github.event.inputs.channels }}
        run: node scripts/build-preview-bundle.mjs

      - name: Upload preview bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: data/preview/bundle/
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # LOG RESULTS
  # ============================================================
  log-results:
    needs: [setup, prep, render]
    if: always() && github.event.inputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '90') }}
    steps:
      - name: Generate run report
        run: |
          echo "=== PIPELINE RUN REPORT ==="
          echo "Run ID:    ${{ github.run_id }}"
          echo "Triggered: ${{ github.event_name }}"
          echo "Dry Run:   ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Channels:  ${{ github.event.inputs.channels || 'priority set' }}"
          echo "Setup:     ${{ needs.setup.result }}"
          echo "Prep:      ${{ needs.prep.result }}"
          echo "Render:    ${{ needs.render.result }}"

  # ============================================================
  # RETRY (once): a channel can fail for reasons that are not its fault (a model that wrote a sloppy script five times, a search that timed
  # out). Every failure releases its topic reservation, so one more run draws a fresh topic. Only channels that failed BEFORE the upload
  # step are retried, so a video that already went up is never uploaded twice, and a retry run never retries (is_retry).
  # ============================================================
  retry-failed:
    needs: [setup, prep, render]
    if: always() && needs.setup.result == 'success' && github.event.inputs.publish != 'true' && github.event.inputs.is_retry != 'true' && (needs.prep.result == 'failure' || needs.render.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
      REPO: ${{ github.repository }}
      REF: ${{ github.ref_name }}
      DRY: ${{ github.event.inputs.dry_run || 'false' }}
      HOLD: ${{ github.event.inputs.hold_public || 'false' }}
      TIMEOUT: ${{ github.event.inputs.timeout_minutes || '90' }}
    steps:
      - name: Re-run the channels that failed before upload, once
        run: |
          set -euo pipefail
          FAILED=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion=="failure") | select(([.steps[]? | select(.name=="Publish to YouTube (private)" and .conclusion=="success")] | length)==0) | .name' \
            | sed -n 's/^\(prep\|render\) (\([0-9][0-9]*\))$/\2/p' | sort -un | paste -sd, -)
          if [ -z "$FAILED" ]; then
            echo "Nothing to retry: no channel failed before upload."
            exit 0
          fi
          echo "Retrying once: channels $FAILED"
          {
            echo "### Retry"
            echo "Run $RUN_ID had failures before upload in channels: $FAILED. Started one retry run for exactly those channels."
          } >> "$GITHUB_STEP_SUMMARY"
          gh workflow run daily-pipeline-v2.yml --repo "$REPO" --ref "$REF" \
            -f channels="$FAILED" -f is_retry=true -f dry_run="$DRY" -f hold_public="$HOLD" -f timeout_minutes="$TIMEOUT" -f eval_loop_mode=off
