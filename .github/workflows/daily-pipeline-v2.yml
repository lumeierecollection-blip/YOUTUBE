# YouTube Automation — Daily Pipeline (v2)
#
# Scope: ONLY the channels in config/priority-channels.json (the six approved
# for publishing). Other channels are deferred until that file changes.
#
#   setup  → channel matrix from config/priority-channels.json
#   prep   → Discover → Reserve → Research → Script → TTS → Thumbnail → SEO
#   render → Plan → Render → silence/duration/frame gates → Publish (private)
#   self-heal (on failure) → diagnose the failed jobs, block or fix in scope
#
# Budget: every job has timeout-minutes: 18; the whole run should finish in
# under 20 minutes. Concurrency cancels an older run on the same ref, so runs
# never pile up (the previous 50-channel runs took 5+ hours).

name: Daily Pipeline — Optimized v2

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render, but no publish)"
        type: boolean
        default: false
      channels:
        description: "Comma-separated channel IDs — must be priority channels"
        type: string
        default: "1,2,9,26,44,48"
      render_only:
        description: "DEBUG: skip discover/research/script; render the channel's latest committed script (never publishes)"
        type: boolean
        default: false

concurrency:
  group: daily-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  OLLAMA_MODEL: "qwen2.5:7b"
  OLLAMA_URL: "http://127.0.0.1:11434"
  # Ollama's default context is 4096 tokens; the research/script prompts are
  # longer, and a truncated prompt is how llama3.2 ended up answering
  # "To print Hello World in Python…". opencode.json declares 16384 to match.
  OLLAMA_CONTEXT_LENGTH: "16384"
  OPENCODE_MODELS_RESEARCH: "ollama/qwen2.5:7b"
  OPENCODE_MODELS_REASONING: "ollama/qwen2.5:7b"
  OPENCODE_MODELS: "ollama/qwen2.5:7b"
  OPENCODE_ENABLE_EXA: "1"
  OPENCODE_CALL_TIMEOUT_S: "300"
  RENDER_SCALE: "0.75"
  RENDER_CONCURRENCY: "4"

jobs:
  # ============================================================
  # SETUP: channel matrix from config/priority-channels.json
  # ============================================================
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: channels
        name: Build channel matrix
        env:
          REQUESTED: ${{ github.event.inputs.channels }}
        run: |
          MATRIX=$(node -e "
            const fs = require('fs');
            const priority = JSON.parse(fs.readFileSync('config/priority-channels.json', 'utf-8')).channels.map(String);
            const req = (process.env.REQUESTED || '').split(',').map(s => s.trim().replace(/^ch-?/i, '').replace(/^0+/, '')).filter(Boolean);
            const ids = req.length ? req : priority;
            const notPriority = ids.filter(id => !priority.includes(id));
            if (notPriority.length) {
              console.error('Not priority channels: ' + notPriority.join(',') + ' (priority: ' + priority.join(',') + ')');
              process.exit(1);
            }
            console.log(JSON.stringify({ include: ids.map(id => ({ channel_id: id })) }));
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Channels in this run: $MATRIX"

  # ============================================================
  # STAGE 1: PREP
  # ============================================================
  prep:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 6
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-edge-tts

      - name: Install EdgeTTS
        run: pip install --quiet edge-tts

      - name: Cache OpenCode CLI
        if: github.event.inputs.render_only != 'true'
        id: opencode-cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode-cli
          key: opencode-cli-${{ runner.os }}-v1

      - name: Install OpenCode (cache miss only)
        if: steps.opencode-cache.outputs.cache-hit != 'true' && github.event.inputs.render_only != 'true'
        run: npm install --prefix ~/.opencode-cli --no-audit --no-fund opencode-ai

      - name: Put OpenCode on PATH
        if: github.event.inputs.render_only != 'true'
        run: echo "$HOME/.opencode-cli/node_modules/.bin" >> "$GITHUB_PATH"

      # ── Ollama ─────────────────────────────────────────────────────────
      - name: Cache Ollama models
        if: github.event.inputs.render_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-qwen2.5-7b

      - name: Install Ollama
        if: github.event.inputs.render_only != 'true'
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        if: github.event.inputs.render_only != 'true'
        run: |
          # install.sh registers and starts a systemd service on :11434. The
          # old step then ran a second `ollama serve` on the same port, which
          # died with "bind: address already in use" in every prep job. Run
          # exactly one server, ours, reading models from the cached dir.
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          sudo pkill -f "ollama serve" 2>/dev/null || true
          mkdir -p "$HOME/.ollama/models"
          OLLAMA_MODELS="$HOME/.ollama/models" OLLAMA_HOST=127.0.0.1:11434 \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$OLLAMA_URL/api/tags" >/dev/null && break; sleep 1; done
          OLLAMA_HOST=127.0.0.1:11434 ollama pull "$OLLAMA_MODEL"
          node scripts/ollama-client.cjs --check --model "$OLLAMA_MODEL" --timeout 60 \
            || { echo "--- ollama.log ---"; tail -50 /tmp/ollama.log; exit 1; }

      # ── Stage A: discover topics for THIS channel ──────────────────────
      - name: Discover topic
        if: github.event.inputs.render_only != 'true'
        id: discover
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -u
          CH="${{ matrix.channel_id }}"
          node scripts/build-discovery-context.js --channel "$CH" > /tmp/context.json

          set +e
          cat /tmp/context.json | node scripts/opencode-agent.js \
            --prompt-file prompts/discover-topics.md \
            --schema-file schemas/topics.json \
            --search-budget 2 \
            --agent pipeline-research \
            --model "$OPENCODE_MODELS_RESEARCH" \
            --task-label discover-topics --max-retries 4 \
            > /tmp/topics-raw.json 2> >(tee /tmp/topics-err.log >&2)
          AGENT_EXIT=$?
          set -e

          if [ "$AGENT_EXIT" -ne 0 ]; then
            echo "::error::discover-topics failed for channel $CH"
            echo "--- stderr ---"; cat /tmp/topics-err.log 2>/dev/null || echo "(empty)"
            exit 1
          fi
          if ! jq -e '.structured_output.topics | length > 0' /tmp/topics-raw.json > /dev/null; then
            echo "::error::No topics discovered for channel $CH"
            cat /tmp/topics-raw.json
            exit 1
          fi
          jq '.structured_output' /tmp/topics-raw.json > /tmp/topics.json
          echo "Discovered $(jq '.topics | length' /tmp/topics.json) candidate topic(s)"

      # ── Reserve the first NON-duplicate topic ─────────────────────────
      - name: Reserve topic
        if: github.event.inputs.render_only != 'true'
        id: reserve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ matrix.channel_id }}"
          git config user.name  "pipeline-bot"
          git config user.email "pipeline@youtube-automation.local"
          COUNT=$(jq '.topics | length' /tmp/topics.json)

          # Discovery returns several candidates. Only reserving topics[0]
          # turned every duplicate into a skipped channel (30 of 50 in run
          # 35763687213); walk the list and take the first non-duplicate.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"

            RESERVED=0
            for IDX in $(seq 0 $((COUNT - 1))); do
              TOPIC=$(jq -r ".topics[$IDX].topic" /tmp/topics.json)
              SLUG=$(jq -r ".topics[$IDX].slug" /tmp/topics.json)
              set +e
              node scripts/reserve-topic-single.js "$CH" "$TOPIC" "$SLUG"
              RESERVE_EXIT=$?
              set -e
              if [ "$RESERVE_EXIT" -eq 2 ]; then
                echo "Candidate $IDX is a duplicate — trying the next one"
                continue
              fi
              if [ "$RESERVE_EXIT" -ne 0 ]; then
                echo "::error::Topic reservation error for channel $CH"
                exit 1
              fi
              jq ".topics[$IDX] | {topic, slug, angle, pillar, why_now}" /tmp/topics.json > /tmp/channel-topic.json
              RESERVED=1
              break
            done

            if [ "$RESERVED" -ne 1 ]; then
              echo "::warning::Channel $CH — all $COUNT candidate topics are duplicates; skipping this channel today"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add data/topic-log.json
            if git diff --staged --quiet; then
              break
            fi
            git commit -m "topic: ch-$CH $(jq -r .slug /tmp/channel-topic.json)"
            if git push origin "${{ github.ref_name }}"; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Push conflict — retrying ($attempt/5) ..."
              git reset --hard HEAD~1
              sleep $((attempt * 3))
            else
              echo "::error::Failed to push topic-log for channel $CH after 5 attempts"
              exit 1
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: "Render-only: use latest committed script"
        if: github.event.inputs.render_only == 'true'
        run: |
          # DEBUG path — exercises render with a script that already exists
          # in git, so render failures can be fixed while prep is blocked.
          # Never publishes (every publish step is gated on render_only).
          CH="${{ matrix.channel_id }}"
          # checkout is depth 1; history (no blobs) is needed to find "latest".
          git fetch -q --unshallow --filter=blob:none origin "${{ github.ref_name }}"
          SCRIPT=$(git log --format= --name-only --diff-filter=AM -- "data/research/$CH/*-shorts-script.json" \
            | grep -v '^$' | while read -r f; do [ -f "$f" ] && echo "$f" && break; done)
          if [ -z "$SCRIPT" ]; then
            echo "::error::render_only: no committed shorts script for channel $CH"
            exit 1
          fi
          SLUG=$(basename "$SCRIPT" -shorts-script.json)
          echo "render_only: channel $CH → $SCRIPT"
          jq -n --arg s "$SLUG" '{slug:$s, topic:$s}' > /tmp/channel-topic.json

      - name: Ensure output directories
        if: steps.reserve.outputs.skip != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          mkdir -p data/research/$CH data/tts/$CH data/thumbnails/$CH
          echo "FORMATS=shorts" >> "$GITHUB_ENV"

      # ── Stage B: research ──────────────────────────────────────────────
      - name: Research topic
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -u
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r  '.slug'  /tmp/channel-topic.json)
          TOPIC=$(jq -r '.topic' /tmp/channel-topic.json)
          ANGLE=$(jq -r '.angle' /tmp/channel-topic.json)
          echo "=== RESEARCH: $CH — $SLUG ==="

          set +e
          jq -n --arg t "$TOPIC" --arg a "$ANGLE" \
                --arg s "$SLUG"  --arg c "$CH" \
                '{topic:$t, angle:$a, slug:$s, channel_id:$c}' \
            | node scripts/opencode-agent.js \
                --prompt-file prompts/research.md \
                --schema-file schemas/research.json \
                --agent pipeline-research \
                --model "$OPENCODE_MODELS_RESEARCH" \
                --task-label research --max-retries 4 --channel-id "$CH" --video-id "$SLUG" \
                > /tmp/research-raw.json 2> >(tee /tmp/research-err.log >&2)
          AGENT_EXIT=$?
          set -e

          if [ "$AGENT_EXIT" -ne 0 ]; then
            echo "::error::research failed for channel $CH"
            echo "--- stderr ---"; cat /tmp/research-err.log 2>/dev/null || echo "(empty)"
            exit 1
          fi
          if ! jq -e '.structured_output.key_facts | length >= 3' /tmp/research-raw.json > /dev/null; then
            echo "::error::research didn't meet the quality bar for channel $CH"
            cat /tmp/research-raw.json
            exit 1
          fi
          jq '.structured_output' /tmp/research-raw.json > "data/research/$CH/$SLUG.json"
          cp /tmp/research-raw.json "data/research/$CH/.agent-raw.json"

      - name: Gate research
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          node scripts/gate-research.js "$CH" "$SLUG"

      # ── Stage C: script (gate-feedback retry) ──────────────────────────
      - name: Write script
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          STYLE=$(node scripts/channel-style.js "$CH")
          if [ "$STYLE" = "motion-graphics" ]; then
            SCHEMA="schemas/script.mg.json"
          else
            SCHEMA="schemas/script.section.json"
          fi
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            FEEDBACK=""
            PASSED=0
            for ATTEMPT in 1 2 3 4 5; do
              echo "=== SCRIPT: $CH — $SCRIPT_SLUG (attempt $ATTEMPT/5) ==="
              PROMPT_FILE=prompts/write-script.md
              if [ -n "$FEEDBACK" ]; then
                cp prompts/write-script.md /tmp/write-script-feedback.md
                printf '\n\n## Quality gate rejected your previous script\n\n%s\n\nRewrite the FULL script JSON now, fixing exactly the problems above. Keep everything the gate did not flag identical — same research grounding, same sources_used, same structure. Return only the JSON object.\n' "$FEEDBACK" >> /tmp/write-script-feedback.md
                PROMPT_FILE=/tmp/write-script-feedback.md
              fi
              set +e
              node scripts/build-script-context.js "$CH" "$SLUG" --format "$FORMAT" \
                | node scripts/opencode-agent.js \
                    --prompt-file "$PROMPT_FILE" \
                    --append-system-prompt-file prompts/style-contract.md \
                    --schema-file "$SCHEMA" \
                    --agent pipeline-script \
                    --model "$OPENCODE_MODELS_REASONING" \
                    --task-label write-script --max-retries 4 --channel-id "$CH" --video-id "$SCRIPT_SLUG" \
                    > /tmp/script-raw-$FORMAT.json 2> >(tee /tmp/script-err-$FORMAT.log >&2)
              AGENT_EXIT=$?
              set -e
              if [ "$AGENT_EXIT" -ne 0 ]; then
                echo "::error::script model call failed for channel $CH format $FORMAT"
                echo "--- stderr ---"; cat /tmp/script-err-$FORMAT.log 2>/dev/null || echo "(empty)"
                exit 1
              fi
              jq '.structured_output' /tmp/script-raw-$FORMAT.json \
                > "data/research/$CH/${SCRIPT_SLUG}-script.json"
              if node scripts/gate-script.js "$CH" "$SCRIPT_SLUG" "$SLUG" > /tmp/gate-out-$FORMAT.log 2>&1; then
                PASSED=1
                break
              fi
              echo "::warning::script gate rejected attempt $ATTEMPT/5 for $SCRIPT_SLUG"
              cat /tmp/gate-out-$FORMAT.log
              # Accumulate violations across attempts (see run 35289507647).
              NEW_FEEDBACK=$(grep -E '^  - ' /tmp/gate-out-$FORMAT.log || true)
              FEEDBACK=$(printf '%s\n%s\n' "$FEEDBACK" "$NEW_FEEDBACK" \
                | grep -E '^  - ' | sort -u || true)
            done
            if [ "$PASSED" -ne 1 ]; then
              echo "::error::script gate still failing for $SCRIPT_SLUG after 5 attempts"
              exit 1
            fi
          done

      # ── Stage D: TTS voiceover ─────────────────────────────────────────
      - name: Generate TTS voiceover
        if: steps.reserve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            SCRIPT="data/research/$CH/${SCRIPT_SLUG}-script.json"
            if [ ! -f "$SCRIPT" ]; then
              echo "::error::Script not found: $SCRIPT"
              exit 1
            fi
            echo "=== TTS: $CH — $SCRIPT_SLUG ==="
            TTS_OK=0
            for tts_try in 1 2 3; do
              if node src/utils/tts.js "$CH" "$SCRIPT"; then
                TTS_OK=1; break
              fi
              if [ "$tts_try" -lt 3 ]; then
                echo "TTS attempt $tts_try failed — retrying in 15s..."
                sleep 15
              fi
            done
            if [ "$TTS_OK" -ne 1 ]; then
              echo "::error::TTS failed after 3 attempts for $SCRIPT_SLUG"
              exit 1
            fi
          done

      # ── Stage E: Thumbnail ─────────────────────────────────────────────
      - name: Generate thumbnail
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            SCRIPT="data/research/$CH/${SCRIPT_SLUG}-script.json"
            echo "=== THUMBNAIL: $CH — $SCRIPT_SLUG ==="
            node src/skills/thumbnail-maker/generate.js "$CH" "$SCRIPT" || echo "WARN: thumbnail spec failed"
            node src/skills/thumbnail-maker/render-thumb.js "$CH" "$SCRIPT_SLUG" || echo "WARN: thumbnail render failed"
          done

      # ── Stage F: SEO + metadata ────────────────────────────────────────
      - name: Generate SEO + metadata
        if: steps.reserve.outputs.skip != 'true' && github.event.inputs.render_only != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          TOPIC=$(jq -r '.topic' /tmp/channel-topic.json)
          echo "=== METADATA: $CH — $SLUG ==="
          jq -n --arg t "$TOPIC" --arg s "$SLUG" '{topic:$t, slug:$s}' \
            > "data/research/$CH/next-topic.json"
          node src/utils/pipeline.js "$CH" --step 5 || echo "WARN: metadata generation had issues"

      - name: Ollama request log
        if: always()
        run: |
          # One line per model request: status, duration, endpoint. Plus any
          # prompt-truncation warnings. This is where prep time actually goes.
          grep -E "\[GIN\]|truncat|error|level=WARN" /tmp/ollama.log | tail -60 || echo "(no ollama log)"

      # ── Prep status + artifact (ALWAYS uploaded) ───────────────────────
      # A channel that skipped (all candidates duplicate) still uploads an
      # artifact carrying {"skipped": true}, so its render job can see WHY
      # there is nothing to render instead of failing on a missing artifact.
      - name: Write prep status
        if: always()
        run: |
          CH="${{ matrix.channel_id }}"
          mkdir -p data/prep-status
          if [ "${{ steps.reserve.outputs.skip }}" = "true" ]; then
            echo '{"skipped": true, "reason": "duplicate-topic"}' > "data/prep-status/$CH.json"
          else
            echo "{\"skipped\": false, \"prep\": \"${{ job.status }}\"}" > "data/prep-status/$CH.json"
          fi
          cat "data/prep-status/$CH.json"

      - name: Upload prep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/prep-status/
            data/research/${{ matrix.channel_id }}/
            data/tts/${{ matrix.channel_id }}/
            data/thumbnails/${{ matrix.channel_id }}/
          retention-days: 1

  # ============================================================
  # STAGE 2: RENDER
  # ============================================================
  render:
    needs: [setup, prep]
    if: ${{ !cancelled() && needs.prep.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 6
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)

      - name: Verify a single Remotion version
        run: |
          # The frame-0 "_currentValue" crash came from mixed remotion copies.
          V=$(find node_modules src/skills/remotion-render/node_modules -path '*/node_modules/remotion/package.json' -exec node -p "require('./{}').version" \; | sort -u)
          echo "remotion versions installed: $V"
          [ "$(echo "$V" | wc -l)" -eq 1 ] || { echo "::error::more than one remotion version installed"; exit 1; }

      - name: Download prep artifacts
        uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.channel_id }}-${{ github.run_id }}
          path: data/

      - name: Check prep status
        id: status
        run: |
          CH="${{ matrix.channel_id }}"
          F="data/prep-status/$CH.json"
          if [ ! -f "$F" ]; then
            echo "::error::prep artifact for channel $CH has no status file"
            exit 1
          fi
          cat "$F"
          if [ "$(jq -r .skipped "$F")" = "true" ]; then
            echo "::notice::Channel $CH skipped in prep ($(jq -r .reason "$F")) — nothing to render"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure ffmpeg/ffprobe
        if: steps.status.outputs.skip != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - uses: browser-actions/setup-chrome@v1
        if: steps.status.outputs.skip != 'true'
        with:
          chrome-version: stable

      - name: Cache Remotion Chrome
        if: steps.status.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-chrome-${{ runner.os }}

      - name: Render + verify
        if: steps.status.outputs.skip != 'true'
        env:
          RENDER_PROGRESS_MS: 10000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VISION_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISION_MODEL: gemini-3.5-flash-lite
        # --skip-qa skips only the Gemini review/correction loop. The hard
        # gates (plan present, caps, voiceover audible, duration, beat-0
        # frame) run regardless — see render-and-qa.js.
        run: node scripts/render-and-qa.js --channel "${{ matrix.channel_id }}" --skip-qa

      - name: Upload rendered video
        if: always() && steps.status.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/renders/${{ matrix.channel_id }}/
            data/visual-plans/${{ matrix.channel_id }}/
          retention-days: 7

      # ── Publish (private) ──────────────────────────────────────────────
      - name: Materialize OAuth credentials
        if: steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true'
        env:
          CH01_CLIENT_ID:       ${{ secrets.CHANNEL_01_CLIENT_ID }}
          CH01_CLIENT_SECRET:   ${{ secrets.CHANNEL_01_CLIENT_SECRET }}
          CH01_REFRESH_TOKEN:   ${{ secrets.CHANNEL_01_REFRESH_TOKEN }}
          CH02_CLIENT_ID:       ${{ secrets.CHANNEL_02_CLIENT_ID }}
          CH02_CLIENT_SECRET:   ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
          CH02_REFRESH_TOKEN:   ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
          CH09_CLIENT_ID:       ${{ secrets.CHANNEL_09_CLIENT_ID }}
          CH09_CLIENT_SECRET:   ${{ secrets.CHANNEL_09_CLIENT_SECRET }}
          CH09_REFRESH_TOKEN:   ${{ secrets.CHANNEL_09_REFRESH_TOKEN }}
          CH26_CLIENT_ID:       ${{ secrets.CHANNEL_26_CLIENT_ID }}
          CH26_CLIENT_SECRET:   ${{ secrets.CHANNEL_26_CLIENT_SECRET }}
          CH26_REFRESH_TOKEN:   ${{ secrets.CHANNEL_26_REFRESH_TOKEN }}
          CH44_CLIENT_ID:       ${{ secrets.CHANNEL_44_CLIENT_ID }}
          CH44_CLIENT_SECRET:   ${{ secrets.CHANNEL_44_CLIENT_SECRET }}
          CH44_REFRESH_TOKEN:   ${{ secrets.CHANNEL_44_REFRESH_TOKEN }}
          CH48_CLIENT_ID:       ${{ secrets.CHANNEL_48_CLIENT_ID }}
          CH48_CLIENT_SECRET:   ${{ secrets.CHANNEL_48_CLIENT_SECRET }}
          CH48_REFRESH_TOKEN:   ${{ secrets.CHANNEL_48_REFRESH_TOKEN }}
        run: |
          mkdir -p config/creds
          P=$(printf '%02d' "${{ matrix.channel_id }}")
          node -e "
            const fs = require('fs');
            const p = '${P}';
            const clientId     = process.env['CH' + p + '_CLIENT_ID'];
            const clientSecret = process.env['CH' + p + '_CLIENT_SECRET'];
            const refreshToken = process.env['CH' + p + '_REFRESH_TOKEN'];
            if (!(clientId && clientSecret && refreshToken)) {
              console.error('::error::No credentials configured for priority channel ' + p);
              process.exit(1);
            }
            fs.writeFileSync('config/creds/ch-' + p + '.json',
              JSON.stringify({client_id:clientId, client_secret:clientSecret, refresh_token:refreshToken}, null, 2));
            console.log('Credentials materialized for channel ' + p);
          "

      - name: Publish to YouTube (private)
        if: steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true'
        run: node src/skills/youtube-publish/run.js "${{ matrix.channel_id }}"

      - name: Process publish queue
        if: steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true'
        run: node src/skills/youtube-publish/run.js process-queue

      - name: Commit publish queue
        if: steps.status.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.render_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ matrix.channel_id }}"
          git config user.name  "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/publish-queue
          if git diff --cached --quiet; then
            echo "Publish queue unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "publish-queue: ch-$CH $(date -u +%F) [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git checkout -- data/research data/tts data/thumbnails data/renders 2>/dev/null || true
            git rebase "origin/${{ github.ref_name }}"
            if git push origin "${{ github.ref_name }}"; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Push conflict — retrying ($attempt/5) ..."
              sleep $((attempt * 2))
            else
              echo "::error::Could not push publish-queue for channel $CH after 5 attempts"
              exit 1
            fi
          done

  # ============================================================
  # LOG RESULTS
  # ============================================================
  log-results:
    needs: [setup, prep, render]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Generate run report
        run: |
          echo "=== PIPELINE RUN REPORT ==="
          echo "Run ID:    ${{ github.run_id }}"
          echo "Triggered: ${{ github.event_name }}"
          echo "Dry Run:   ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Channels:  ${{ github.event.inputs.channels || 'priority set' }}"
          echo "Setup:     ${{ needs.setup.result }}"
          echo "Prep:      ${{ needs.prep.result }}"
          echo "Render:    ${{ needs.render.result }}"

  # ============================================================
  # SELF-HEAL (only when something failed)
  # ============================================================
  self-heal:
    needs: [setup, prep, render]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Self-heal on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/self-heal.cjs

      - name: Upload self-heal diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-${{ github.run_id }}
          path: data/ci-runs/
          if-no-files-found: ignore
          retention-days: 7
