# YouTube Automation ΓÇö Optimized Daily Pipeline (v2)
# Split into 2 stages for faster turnaround:
#   Stage 1 (prep): Discover ΓåÆ Research ΓåÆ Script ΓåÆ TTS ΓåÆ Thumbnail ΓåÆ SEO
#   Stage 2 (render): Download artifacts ΓåÆ Render + QA ΓåÆ Publish
#
# This decouples lightweight model calls from heavy CPU render work,
# reducing timeout risks and allowing independent resource allocation.

name: Daily Pipeline ΓÇö Optimized v2

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        type: boolean
        default: false
      channel_override:
        description: "Run only these channels (comma-separated IDs, e.g. '1,2,9,26,44,48')"
        required: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  OPENCODE_MODELS_RESEARCH: "google/gemini-3.5-flash-lite,opencode/mimo-v2.5-free"
  OPENCODE_MODELS_REASONING: "google/gemini-3.5-flash-lite,opencode/glm-5-free"
  OPENCODE_MODELS: "google/gemini-3.5-flash-lite,opencode/mimo-v2.5-free"
  OPENCODE_ENABLE_EXA: "1"
  RENDER_SCALE: "0.5"

jobs:
  # ============================================================
  # SETUP: build the channel matrix
  # ============================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: channels
        name: Build channel matrix
        run: |
          OVERRIDE="${{ github.event.inputs.channel_override }}"
          NORM_IDS=""
          if [ -n "$OVERRIDE" ]; then
            NORM_IDS=$(echo "$OVERRIDE" | tr ',' '\n' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | sed 's/^[a-zA-Z-]*//' | sed 's/^0*//' | tr '\n' ',' | sed 's/,$//')
          fi

          MATRIX=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('config/channels.json', 'utf-8'));
            const channels = data.channels || data;
            const ids = process.argv[1] ? process.argv[1].split(',').filter(Boolean) : [];
            const list = ids.length
              ? channels.filter(c => ids.includes(String(c.id)))
              : channels.filter(c => !c.paused);
            console.log(JSON.stringify({include: list.map(c => ({channel_id: String(c.id)}))}));
          " "$NORM_IDS")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$MATRIX" | node -e "
            let d=''; process.stdin.setEncoding('utf8');
            process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).include.length));
          ")
          echo "Channels in this run: $COUNT"

  # ============================================================
  # STAGE 1: PREP ΓÇö Discover, Research, Script, TTS, Thumbnail, SEO
  # Lightweight model calls only. Fast (~2-5 min per channel).
  # ============================================================
  prep:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 2
      fail-fast: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ΓöÇΓöÇ Cache npm dependencies ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Cache npm modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore node_modules from cache
        if: steps.npm-cache.outputs.cache-hit == 'true'
        run: npm ci --prefer-offline

      # ΓöÇΓöÇ Cache pip packages ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Cache pip packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install EdgeTTS
        run: pip install --quiet edge-tts

      # ΓöÇΓöÇ Cache OpenCode CLI ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Cache OpenCode CLI
        uses: actions/cache@v4
        id: opencode-cache
        with:
          path: ~/.local/share/opencode
          key: opencode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            opencode-${{ runner.os }}-

      - name: Install OpenCode
        run: npm install -g opencode-ai

      # ΓöÇΓöÇ Stage A: discover topic for THIS channel ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Discover topic
        id: discover
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -u
          CH="${{ matrix.channel_id }}"
          node scripts/build-discovery-context.js --channel "$CH" > /tmp/context.json

          set +e
          cat /tmp/context.json | node scripts/opencode-agent.js \
            --prompt-file prompts/discover-topics.md \
            --schema-file schemas/topics.json \
            --search-budget 2 \
            --agent pipeline-research \
            --model "$OPENCODE_MODELS_RESEARCH" \
            --task-label discover-topics \
            > /tmp/topics-raw.json 2> /tmp/topics-err.log
          AGENT_EXIT=$?
          set -e

          if [ "$AGENT_EXIT" -ne 0 ]; then
            echo "::error::discover-topics failed for channel $CH"
            echo "--- stderr ---"; cat /tmp/topics-err.log 2>/dev/null || echo "(empty)"
            exit 1
          fi
          if ! jq -e '.structured_output.topics | length > 0' /tmp/topics-raw.json > /dev/null; then
            echo "::error::No topics discovered for channel $CH"
            cat /tmp/topics-raw.json
            exit 1
          fi

          jq '.structured_output' /tmp/topics-raw.json > /tmp/topics.json
          jq '{
            topic: .topics[0].topic,
            slug:  .topics[0].slug,
            angle: .topics[0].angle,
            pillar: .topics[0].pillar,
            why_now: .topics[0].why_now
          }' /tmp/topics.json > /tmp/channel-topic.json

          echo "cost_discover=$(jq -r '.total_cost_usd' /tmp/topics-raw.json)" >> "$GITHUB_STEP_SUMMARY"

      # ΓöÇΓöÇ Reserve topic with retry loop ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Reserve topic
        id: reserve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ matrix.channel_id }}"
          TOPIC=$(jq -r '.topic' /tmp/channel-topic.json)
          SLUG=$(jq -r  '.slug'  /tmp/channel-topic.json)

          git config user.name  "pipeline-bot"
          git config user.email "pipeline@youtube-automation.local"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"

            set +e
            node scripts/reserve-topic-single.js "$CH" "$TOPIC" "$SLUG"
            RESERVE_EXIT=$?
            set -e

            if [ "$RESERVE_EXIT" -eq 2 ]; then
              echo "::warning::Channel $CH ΓÇö topic is a duplicate; skipping this channel today"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$RESERVE_EXIT" -ne 0 ]; then
              echo "::error::Topic reservation error for channel $CH"
              exit 1
            fi

            git add data/topic-log.json
            if git diff --staged --quiet; then
              break
            fi
            git commit -m "topic: ch-$CH $SLUG"

            if git push origin "${{ github.ref_name }}"; then
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Push conflict ΓÇö retrying ($attempt/5) ..."
              git reset --hard HEAD~1
              sleep $((attempt * 3))
            else
              echo "::error::Failed to push topic-log for channel $CH after 5 attempts"
              exit 1
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Ensure output directories
        if: steps.reserve.outputs.skip != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          mkdir -p data/research/$CH data/tts/$CH data/thumbnails/$CH

      - name: Determine today's formats
        if: steps.reserve.outputs.skip != 'true'
        run: |
          WEEKDAY=$(date -u +%u)
          if [ "$WEEKDAY" = "1" ] || [ "$WEEKDAY" = "3" ] || [ "$WEEKDAY" = "5" ]; then
            echo "FORMATS=shorts" >> "$GITHUB_ENV"
          else
            echo "FORMATS=longform" >> "$GITHUB_ENV"
          fi

      # ΓöÇΓöÇ Stage B: research ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Research topic
        if: steps.reserve.outputs.skip != 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -u
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r  '.slug'  /tmp/channel-topic.json)
          TOPIC=$(jq -r '.topic' /tmp/channel-topic.json)
          ANGLE=$(jq -r '.angle' /tmp/channel-topic.json)
          echo "=== RESEARCH: $CH ΓÇö $SLUG ==="

          set +e
          jq -n --arg t "$TOPIC" --arg a "$ANGLE" \
                --arg s "$SLUG"  --arg c "$CH" \
                '{topic:$t, angle:$a, slug:$s, channel_id:$c}' \
            | node scripts/opencode-agent.js \
                --prompt-file prompts/research.md \
                --schema-file schemas/research.json \
                --agent pipeline-research \
                --model "$OPENCODE_MODELS_RESEARCH" \
                --task-label research --channel-id "$CH" --video-id "$SLUG" \
                > /tmp/research-raw.json 2> /tmp/research-err.log
          AGENT_EXIT=$?
          set -e

          if [ "$AGENT_EXIT" -ne 0 ]; then
            echo "::error::research failed for channel $CH"
            echo "--- stderr ---"; cat /tmp/research-err.log 2>/dev/null || echo "(empty)"
            exit 1
          fi
          if ! jq -e '.structured_output.key_facts | length >= 3' /tmp/research-raw.json > /dev/null; then
            echo "::error::research didn't meet the quality bar for channel $CH"
            cat /tmp/research-raw.json
            exit 1
          fi
          jq '.structured_output' /tmp/research-raw.json > "data/research/$CH/$SLUG.json"
          cp /tmp/research-raw.json "data/research/$CH/.agent-raw.json"

      # ΓöÇΓöÇ Gate research ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Gate research
        if: steps.reserve.outputs.skip != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          node scripts/gate-research.js "$CH" "$SLUG"

      # ΓöÇΓöÇ Stage C: script (per format, gate-feedback retry) ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Write script
        if: steps.reserve.outputs.skip != 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          STYLE=$(node scripts/channel-style.js "$CH")
          if [ "$STYLE" = "motion-graphics" ]; then
            SCHEMA="schemas/script.mg.json"
          else
            SCHEMA="schemas/script.section.json"
          fi
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            FEEDBACK=""
            PASSED=0
            for ATTEMPT in 1 2 3; do
              echo "=== SCRIPT: $CH ΓÇö $SCRIPT_SLUG (attempt $ATTEMPT/3) ==="
              PROMPT_FILE=prompts/write-script.md
              if [ -n "$FEEDBACK" ]; then
                cp prompts/write-script.md /tmp/write-script-feedback.md
                printf '\n\n## Quality gate rejected your previous script\n\n%s\n\nRewrite the FULL script JSON now, fixing exactly the problems above. Keep everything the gate did not flag identical ΓÇö same research grounding, same sources_used, same structure. Return only the JSON object.\n' "$FEEDBACK" >> /tmp/write-script-feedback.md
                PROMPT_FILE=/tmp/write-script-feedback.md
              fi
              set +e
              node scripts/build-script-context.js "$CH" "$SLUG" --format "$FORMAT" \
                | node scripts/opencode-agent.js \
                    --prompt-file "$PROMPT_FILE" \
                    --append-system-prompt-file prompts/style-contract.md \
                    --schema-file "$SCHEMA" \
                    --agent pipeline-script \
                    --model "$OPENCODE_MODELS_REASONING" \
                    --task-label write-script --channel-id "$CH" --video-id "$SCRIPT_SLUG" \
                    > /tmp/script-raw-$FORMAT.json 2> /tmp/script-err-$FORMAT.log
              AGENT_EXIT=$?
              set -e
              if [ "$AGENT_EXIT" -ne 0 ]; then
                echo "::error::script model call failed for channel $CH format $FORMAT"
                echo "--- stderr ---"; cat /tmp/script-err-$FORMAT.log 2>/dev/null || echo "(empty)"
                exit 1
              fi
              jq '.structured_output' /tmp/script-raw-$FORMAT.json \
                > "data/research/$CH/${SCRIPT_SLUG}-script.json"
              if node scripts/gate-script.js "$CH" "$SCRIPT_SLUG" "$SLUG" > /tmp/gate-out-$FORMAT.log 2>&1; then
                PASSED=1
                break
              fi
              echo "::warning::script gate rejected attempt $ATTEMPT/3 for $SCRIPT_SLUG"
              cat /tmp/gate-out-$FORMAT.log
              FEEDBACK=$(grep -E '^  - ' /tmp/gate-out-$FORMAT.log || true)
            done
            if [ "$PASSED" -ne 1 ]; then
              echo "::error::script gate still failing for $SCRIPT_SLUG after 3 attempts"
              exit 1
            fi
          done

      # ΓöÇΓöÇ Stage D: TTS voiceover ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Generate TTS voiceover
        if: steps.reserve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            echo "=== TTS: $CH ΓÇö $SCRIPT_SLUG ==="
            SCRIPT="data/research/$CH/${SCRIPT_SLUG}-script.json"
            if [ -f "$SCRIPT" ]; then
              TTS_OK=0
              for tts_try in 1 2 3; do
                if node src/utils/tts.js "$CH" "$SCRIPT"; then
                  TTS_OK=1; break
                fi
                if [ "$tts_try" -lt 3 ]; then
                  echo "TTS attempt $tts_try failed ΓÇö retrying in 15s..."
                  sleep 15
                fi
              done
              if [ "$TTS_OK" -ne 1 ]; then
                echo "::error::TTS failed after 3 attempts for $SCRIPT_SLUG"
                exit 1
              fi
            else
              echo "WARN: Script not found ΓÇö skipping TTS for $SCRIPT_SLUG"
            fi
          done

      # ΓöÇΓöÇ Stage E: Thumbnail ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Generate thumbnail
        if: steps.reserve.outputs.skip != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          for FORMAT in $FORMATS; do
            SCRIPT_SLUG="${SLUG}-${FORMAT}"
            echo "=== THUMBNAIL: $CH ΓÇö $SCRIPT_SLUG ==="
            SCRIPT="data/research/$CH/${SCRIPT_SLUG}-script.json"
            if [ -f "$SCRIPT" ]; then
              node src/skills/thumbnail-maker/generate.js "$CH" "$SCRIPT" || echo "WARN: thumbnail spec failed"
              node src/skills/thumbnail-maker/render-thumb.js "$CH" "$SCRIPT_SLUG" || echo "WARN: thumbnail render failed"
            else
              echo "WARN: Script not found ΓÇö skipping thumbnail for $SCRIPT_SLUG"
            fi
          done

      # ΓöÇΓöÇ Stage F: SEO + metadata ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Generate SEO + metadata
        if: steps.reserve.outputs.skip != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          SLUG=$(jq -r '.slug' /tmp/channel-topic.json)
          TOPIC=$(jq -r '.topic' /tmp/channel-topic.json)
          echo "=== METADATA: $CH ΓÇö $SLUG ==="
          jq -n --arg t "$TOPIC" --arg s "$SLUG" '{topic:$t, slug:$s}' \
            > "data/research/$CH/next-topic.json"
          node src/utils/pipeline.js "$CH" --step 5 || echo "WARN: metadata generation had issues"

      # ΓöÇΓöÇ Upload prep artifacts for render stage ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Upload prep artifacts
        if: steps.reserve.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/research/${{ matrix.channel_id }}/
            data/tts/${{ matrix.channel_id }}/
            data/thumbnails/${{ matrix.channel_id }}/
            data/visual-plans/
          retention-days: 1

  # ============================================================
  # STAGE 2: RENDER ΓÇö Download artifacts, render, QA, publish
  # Heavy CPU compute. Independent timeout and resource allocation.
  # ============================================================
  render:
    needs: [setup, prep]
    if: ${{ !cancelled() && needs.prep.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 2
      fail-fast: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ΓöÇΓöÇ Cache npm modules for render deps ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Cache npm modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore node_modules from cache
        if: steps.npm-cache.outputs.cache-hit == 'true'
        run: npm ci --prefer-offline

      # ΓöÇΓöÇ Download prep artifacts ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Download prep artifacts
        uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.channel_id }}-${{ github.run_id }}
          path: data/

      # ΓöÇΓöÇ Setup Chrome for Remotion ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cache render node_modules
        uses: actions/cache@v4
        id: render-npm-cache
        with:
          path: src/skills/remotion-render/node_modules
          key: render-npm-${{ runner.os }}-${{ hashFiles('src/skills/remotion-render/package-lock.json') }}
          restore-keys: render-npm-${{ runner.os }}-

      - name: Install Remotion dependencies
        if: steps.render-npm-cache.outputs.cache-hit != 'true'
        working-directory: src/skills/remotion-render
        run: npm ci

      - name: Restore render node_modules
        if: steps.render-npm-cache.outputs.cache-hit == 'true'
        working-directory: src/skills/remotion-render
        run: npm ci --prefer-offline

      # ΓöÇΓöÇ Render + QA ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Render + QA
        env:
          RENDER_PROGRESS_MS: 10000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VISION_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISION_MODEL: gemini-3.5-flash-lite
          RENDER_SCALE: ${{ env.RENDER_SCALE }}
        run: node scripts/render-and-qa.js --channel "${{ matrix.channel_id }}"

      # ΓöÇΓöÇ Publish ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Materialize OAuth credentials
        if: github.event.inputs.dry_run != 'true'
        env:
          CH01_CLIENT_ID:       ${{ secrets.CHANNEL_01_CLIENT_ID }}
          CH01_CLIENT_SECRET:   ${{ secrets.CHANNEL_01_CLIENT_SECRET }}
          CH01_REFRESH_TOKEN:   ${{ secrets.CHANNEL_01_REFRESH_TOKEN }}
          CH02_CLIENT_ID:       ${{ secrets.CHANNEL_02_CLIENT_ID }}
          CH02_CLIENT_SECRET:   ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
          CH02_REFRESH_TOKEN:   ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
          CH09_CLIENT_ID:       ${{ secrets.CHANNEL_09_CLIENT_ID }}
          CH09_CLIENT_SECRET:   ${{ secrets.CHANNEL_09_CLIENT_SECRET }}
          CH09_REFRESH_TOKEN:   ${{ secrets.CHANNEL_09_REFRESH_TOKEN }}
          CH26_CLIENT_ID:       ${{ secrets.CHANNEL_26_CLIENT_ID }}
          CH26_CLIENT_SECRET:   ${{ secrets.CHANNEL_26_CLIENT_SECRET }}
          CH26_REFRESH_TOKEN:   ${{ secrets.CHANNEL_26_REFRESH_TOKEN }}
          CH44_CLIENT_ID:       ${{ secrets.CHANNEL_44_CLIENT_ID }}
          CH44_CLIENT_SECRET:   ${{ secrets.CHANNEL_44_CLIENT_SECRET }}
          CH44_REFRESH_TOKEN:   ${{ secrets.CHANNEL_44_REFRESH_TOKEN }}
          CH48_CLIENT_ID:       ${{ secrets.CHANNEL_48_CLIENT_ID }}
          CH48_CLIENT_SECRET:   ${{ secrets.CHANNEL_48_CLIENT_SECRET }}
          CH48_REFRESH_TOKEN:   ${{ secrets.CHANNEL_48_REFRESH_TOKEN }}
        run: |
          mkdir -p config/creds
          CH="${{ matrix.channel_id }}"
          P=$(printf '%02d' "$CH")
          CLIENT_ID_VAR="CH${P}_CLIENT_ID"
          CLIENT_SECRET_VAR="CH${P}_CLIENT_SECRET"
          REFRESH_TOKEN_VAR="CH${P}_REFRESH_TOKEN"
          node -e "
            const fs = require('fs');
            const p = '${P}';
            const data = JSON.parse(fs.readFileSync('config/channels.json', 'utf-8'));
            const channels = data.channels || data;
            const c = channels.find(ch => String(ch.id).padStart(2,'0') === p);
            const clientId     = process.env['CH' + p + '_CLIENT_ID'];
            const clientSecret = process.env['CH' + p + '_CLIENT_SECRET'];
            const refreshToken = process.env['CH' + p + '_REFRESH_TOKEN'];
            if (clientId && clientSecret && refreshToken) {
              fs.writeFileSync(
                'config/creds/ch-' + p + '.json',
                JSON.stringify({client_id:clientId, client_secret:clientSecret, refresh_token:refreshToken}, null, 2)
              );
              console.log('Credentials materialized for channel ' + p);
            } else {
              console.log('No credentials configured for channel ' + p + ' ΓÇö will skip publish');
            }
          "

      - name: Publish to YouTube
        if: github.event.inputs.dry_run != 'true'
        run: |
          CH="${{ matrix.channel_id }}"
          echo "=== PUBLISH: $CH ==="
          node src/skills/youtube-publish/run.js "$CH"

      - name: Process publish queue
        if: github.event.inputs.dry_run != 'true'
        run: node src/skills/youtube-publish/run.js process-queue || true

      - name: Commit publish queue
        if: github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ matrix.channel_id }}"
          git config user.name  "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/publish-queue
          if git diff --cached --quiet; then
            echo "Publish queue unchanged ΓÇö nothing to commit."
            exit 0
          fi
          git commit -m "publish-queue: ch-$CH $(date -u +%F) [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git checkout -- data/research data/tts data/thumbnails data/renders 2>/dev/null || true
            git rebase "origin/${{ github.ref_name }}"
            if git push origin "${{ github.ref_name }}"; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Push conflict ΓÇö retrying ($attempt/5) ..."
              git reset HEAD~1
              git add data/publish-queue
              git diff --cached --quiet || git commit -m "publish-queue: ch-$CH $(date -u +%F) [run ${{ github.run_id }}]"
              sleep $((attempt * 2))
            else
              echo "::warning::Could not push publish-queue for channel $CH after 5 attempts"
            fi
          done

      # ΓöÇΓöÇ Upload render artifacts ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.channel_id }}-${{ github.run_id }}
          path: |
            data/renders/${{ matrix.channel_id }}/
            data/audit/render-review/
            data/audit/gemini-review/
          retention-days: 7

  # ============================================================
  # LOG RESULTS
  # ============================================================
  log-results:
    needs: [setup, prep, render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate run report
        run: |
          echo "=== PIPELINE RUN REPORT ==="
          echo "Run ID:    ${{ github.run_id }}"
          echo "Triggered: ${{ github.event_name }}"
          echo "Dry Run:   ${{ github.event.inputs.dry_run || 'false' }}"
          echo "Channels:  ${{ github.event.inputs.channel_override || 'ALL' }}"
          echo "Date:      $(date -u)"
          echo ""
          echo "=== STATUS ==="
          echo "Setup:            ${{ needs.setup.result }}"
          echo "Prep:             ${{ needs.prep.result }}"
          echo "Render:           ${{ needs.render.result }}"
