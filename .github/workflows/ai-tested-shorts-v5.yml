name: AI Tested Shorts V5 - Gemini Directed Production

# Heavy rendering runs here, never on a laptop. Nothing in this workflow is allowed to mask a failure:
# no "|| true", no non-blocking director, no success message in place of a gate. The last step
# (acceptance) exits non-zero unless every video holds all five gates for its current mp4.

on:
  workflow_dispatch:
    inputs:
      stills_only:
        description: 'Fast half-scale low-quality render for layout checks (no Gemini loop, never a deliverable)'
        required: false
        default: false
        type: boolean
      loop_max_cycles:
        description: 'Max review/correct/rerender cycles'
        required: false
        default: '8'
        type: string
      loop_max_minutes:
        description: 'Wall-clock budget for the review loop'
        required: false
        default: '210'
        type: string

concurrency:
  group: ai-tested-shorts-v5-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    defaults:
      run:
        shell: bash
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      FORCE_PROVIDER: gemini
      MAX_TOKENS_PER_VIDEO: '20000000'
      GEMINI_REVIEW_MODEL: gemini-3.5-flash
      LOOP_MAX_CYCLES: ${{ inputs.loop_max_cycles || '8' }}
      LOOP_MAX_MINUTES: ${{ inputs.loop_max_minutes || '210' }}
      STILLS_ONLY: ${{ inputs.stills_only && '1' || '0' }}
      V5: data/ai-tested/shorts-v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system and Python dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libpango-1.0-0 libcairo2 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install edge-tts "rembg[cpu,cli]" pillow numpy scipy onnxruntime

      - name: Install Remotion
        working-directory: ${{ env.V5 }}/render
        run: |
          set -euo pipefail
          npm install
          npx remotion browser ensure

      - name: Verify licensed audio library
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          python fetch-audio.py
          ls -la assets/music assets/sfx2 assets/ambience

      - name: Real background removal (Bonta cutout)
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          mkdir -p logs
          python make-cutouts.py 2>&1 | tee logs/cutouts.log
          cat assets/photos/cutouts/bonta.qa.json

      - name: Narration with word timings
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          mkdir -p logs
          node generate-tts.mjs 2>&1 | tee logs/tts.log
          ls -la audio

      - name: Gemini creative director - blueprint approval (mandatory)
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          mkdir -p production-records logs
          node ../../../scripts/ai-tested-v6-gemini.mjs director-pre --root . 2>&1 | tee logs/director-pre.log

      - name: Render
        working-directory: ${{ env.V5 }}/render
        run: |
          set -euo pipefail
          mkdir -p ../logs
          node render-all.mjs 2>&1 | tee ../logs/render.log

      - name: Layout contact sheets (stills-only mode)
        if: ${{ inputs.stills_only }}
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          mkdir -p qa-preview
          for f in out-preview/*.mp4; do
            base=$(basename "$f" .mp4)
            ffmpeg -hide_banner -loglevel error -y -i "$f" -vf "fps=1,scale=270:-1,tile=6x8" -frames:v 1 -q:v 3 "qa-preview/${base}.sheet.jpg"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -t 3 -vf "fps=4,scale=270:-1,tile=6x2" -frames:v 1 -q:v 3 "qa-preview/${base}.hook.jpg"
          done
          ls -la qa-preview

      - name: Upload first render (salvage)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-tested-shorts-v5-render
          overwrite: true
          path: |
            ${{ env.V5 }}/out/*.mp4
            ${{ env.V5 }}/out/*.json
            ${{ env.V5 }}/out-preview/*
            ${{ env.V5 }}/qa-preview/*
            ${{ env.V5 }}/logs/**
            ${{ env.V5 }}/plans-timed/*.timed.json
            ${{ env.V5 }}/assets/photos/cutouts/**
            ${{ env.V5 }}/audio/*.vtt
            ${{ env.V5 }}/production-records/**
          if-no-files-found: warn
          retention-days: 14

      - name: Gemini review, correction and rerender loop
        if: ${{ !inputs.stills_only }}
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          mkdir -p logs
          node ../../../scripts/ai-tested-v6-gemini.mjs loop --root . 2>&1 | tee logs/loop.log

      - name: Acceptance gate
        if: ${{ !inputs.stills_only && always() }}
        working-directory: ${{ env.V5 }}
        run: |
          set -euo pipefail
          node ../../../scripts/ai-tested-v6-gemini.mjs accept --root . 2>&1 | tee logs/accept.log

      - name: Upload final artifact (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-tested-shorts-v5
          overwrite: true
          path: |
            ${{ env.V5 }}/out/*.mp4
            ${{ env.V5 }}/out/*.json
            ${{ env.V5 }}/out-preview/*
            ${{ env.V5 }}/qa-preview/*
            ${{ env.V5 }}/acceptance.json
            ${{ env.V5 }}/qa/*.json
            ${{ env.V5 }}/qa/*.txt
            ${{ env.V5 }}/qa/contact-sheets/**
            ${{ env.V5 }}/qa/frames/**
            ${{ env.V5 }}/reviews/**
            ${{ env.V5 }}/production-records/**
            ${{ env.V5 }}/plans/*.json
            ${{ env.V5 }}/plans-timed/*.json
            ${{ env.V5 }}/scripts/*.json
            ${{ env.V5 }}/facts/*.json
            ${{ env.V5 }}/assets/photos/cutouts/**
            ${{ env.V5 }}/audio/*.vtt
            ${{ env.V5 }}/assets/audio-licences.json
            ${{ env.V5 }}/assets/manifests/**
            ${{ env.V5 }}/logs/**
          if-no-files-found: warn
          retention-days: 21
