name: AI Tested Shorts V5 - Gemini Directed Production

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/ai-tested-shorts-vox"
    paths:
      - "data/ai-tested/shorts-v5/**"
      - ".github/workflows/ai-tested-shorts-v5.yml"
      - "scripts/ai-tested-v4-review.mjs"
      - "scripts/ai-tested-v5-correct.mjs"
      - "scripts/ai-tested-v5-director.mjs"
      - "scripts/ai-tested-v5-acceptance.mjs"

permissions:
  contents: read

jobs:
  render-shorts-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libpango-1.0-0 libcairo2 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install edge-tts rembg[cli] pillow || pip install edge-tts pillow
      - name: Remove photo backgrounds
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          mkdir -p assets/photos/cutouts
          shopt -s nullglob
          for f in assets/photos/*.jpg assets/photos/*.jpeg assets/photos/*.png; do
            [ -f "$f" ] || continue
            base=$(basename "$f"); stem="${base%.*}"; out="assets/photos/cutouts/${stem}.png"
            rembg i "$f" "$out" || true
            if [ -f "$out" ]; then cp "$out" "assets/photos/${stem}.png"; elif [[ "$f" != *.png ]]; then ffmpeg -y -i "$f" "assets/photos/${stem}.png" || true; fi
          done
      - name: Generate SFX assets
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          mkdir -p assets/sfx
          ffmpeg -y -f lavfi -i "sine=frequency=1200:duration=0.08" -af "afade=t=in:st=0:d=0.005,afade=t=out:st=0.04:d=0.04,volume=0.28" assets/sfx/click.wav
          ffmpeg -y -f lavfi -i "sine=frequency=220:duration=0.18" -af "afade=t=in:st=0:d=0.01,afade=t=out:st=0.08:d=0.1,volume=0.32" assets/sfx/hit.wav
          ffmpeg -y -f lavfi -i "anoisesrc=d=0.35:c=pink:r=44100:a=0.2" -af "afade=t=in:st=0:d=0.03,afade=t=out:st=0.18:d=0.17,highpass=f=500,lowpass=f=6000,volume=0.22" assets/sfx/whoosh.wav
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=0.6" -af "afade=t=in:st=0:d=0.2,afade=t=out:st=0.35:d=0.25,volume=0.16" assets/sfx/riser.wav
          ffmpeg -y -f lavfi -i "sine=frequency=1800:duration=0.05" -af "afade=t=in:st=0:d=0.002,afade=t=out:st=0.03:d=0.02,volume=0.22" assets/sfx/tick.wav
          ffmpeg -y -f lavfi -i "anoisesrc=d=0.22:c=white:r=44100:a=0.12" -af "afade=t=in:st=0:d=0.01,afade=t=out:st=0.12:d=0.1,highpass=f=1200,lowpass=f=7000,volume=0.18" assets/sfx/sweep.wav
          ffmpeg -y -f lavfi -i "sine=frequency=90:duration=0.28" -af "afade=t=in:st=0:d=0.005,afade=t=out:st=0.12:d=0.16,lowpass=f=220,volume=0.35" assets/sfx/impact.wav
          ffmpeg -y -f lavfi -i "anoisesrc=d=0.12:c=brown:r=44100:a=0.2" -af "afade=t=in:st=0:d=0.005,afade=t=out:st=0.05:d=0.07,lowpass=f=1200,volume=0.28" assets/sfx/thud.wav
      - name: Install render deps
        working-directory: data/ai-tested/shorts-v5/render
        run: npm install && npx remotion browser ensure
      - name: Gemini pre-render creative direction (MANDATORY)
        working-directory: data/ai-tested/shorts-v5
        run: |
          mkdir -p production-records
          node ../../../scripts/ai-tested-v5-director.mjs --root .
          test ! -f production-records/DIRECTOR_FAILED.txt
      - name: Generate TTS
        working-directory: data/ai-tested/shorts-v5
        run: node generate-tts.mjs
      - name: Render
        working-directory: data/ai-tested/shorts-v5/render
        run: node render-all.mjs
      - name: Gemini review and correction loop (up to 3 cycles)
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          mkdir -p reviews production-records
          for cycle in 1 2 3; do
            echo "=== REVIEW CYCLE $cycle ==="
            rm -rf qa/frames qa/contact-sheets "reviews/cycle-$cycle"
            mkdir -p qa/frames qa/contact-sheets "reviews/cycle-$cycle"
            for f in out/*.mp4; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .mp4)
              mkdir -p "qa/frames/$base"
              ffmpeg -y -i "$f" -vf "fps=1,scale=540:-1" "qa/frames/$base/%03d.jpg"
              ffmpeg -y -i "$f" -vf "select='not(mod(n\,45))',scale=360:-1,tile=4x4" -frames:v 1 "qa/contact-sheets/${base}.jpg" || true
            done
            node ../../../scripts/ai-tested-v4-review.mjs --root . --out "reviews/cycle-$cycle" || echo "REVIEW_EXEC_FAILED_$cycle" > "reviews/cycle-$cycle/REVIEW_EXEC_FAILED.txt"
            node ../../../scripts/ai-tested-v5-correct.mjs --root . --reviews "reviews/cycle-$cycle" --plans plans || echo "CORRECT_EXEC_FAILED_$cycle" > "reviews/cycle-$cycle/CORRECT_EXEC_FAILED.txt"
            cp "reviews/cycle-$cycle/correction.json" "production-records/correction-cycle-$cycle.json" 2>/dev/null || true
            cp "reviews/cycle-$cycle/summary.json" "production-records/review-cycle-$cycle-summary.json" 2>/dev/null || true
            changed=0
            if [ -f "reviews/cycle-$cycle/correction.json" ]; then
              changed=$(python -c "import json; d=json.load(open('reviews/cycle-$cycle/correction.json')); print(len([c for c in d.get('changed',[]) if c.get('mode') not in ('none','llm_error','exception')]))")
            fi
            echo "changed=$changed"
            if [ "$changed" = "0" ]; then echo "No actionable corrections in cycle $cycle"; break; fi
            (cd render && node render-all.mjs)
          done
      - name: Final Gemini review (mandatory)
        id: final_review
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          rm -rf qa/frames qa/contact-sheets reviews/final && mkdir -p qa/frames qa/contact-sheets reviews/final
          for f in out/*.mp4; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .mp4)
            mkdir -p "qa/frames/$base"
            ffmpeg -y -i "$f" -vf "fps=1,scale=540:-1" "qa/frames/$base/%03d.jpg"
            ffmpeg -y -i "$f" -vf "select='not(mod(n\,45))',scale=360:-1,tile=4x4" -frames:v 1 "qa/contact-sheets/${base}.jpg" || true
          done
          node ../../../scripts/ai-tested-v4-review.mjs --root . --out reviews/final || echo "FINAL_REVIEW_EXEC_FAILED" > reviews/final/EXEC_FAILED.txt
          # Retry once if any review hit transient LLM error
          if grep -l '"reason": "llm_error"' reviews/final/*.review.json >/dev/null 2>&1; then
            echo "Retrying final review for llm_error cases after 90s..."
            sleep 90
            node ../../../scripts/ai-tested-v4-review.mjs --root . --out reviews/final || echo "FINAL_REVIEW_EXEC_FAILED_2" > reviews/final/EXEC_FAILED_2.txt
          fi
      - name: Technical QA
        id: tech_qa
        working-directory: data/ai-tested/shorts-v5
        run: python qa-verify.py out qa || (echo "TECH_QA_FAILED" > qa/TECH_QA_FAILED.txt; exit 1)
      - name: Production summary and acceptance gate
        id: acceptance
        if: always()
        working-directory: data/ai-tested/shorts-v5
        run: |
          python build-summary.py . || true
          node ../../../scripts/ai-tested-v5-acceptance.mjs --root . --reviews reviews/final
      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tested-shorts-v5
          path: |
            data/ai-tested/shorts-v5/out/*.mp4
            data/ai-tested/shorts-v5/production-summary.txt
            data/ai-tested/shorts-v5/qa/**
            data/ai-tested/shorts-v5/reviews/**
            data/ai-tested/shorts-v5/plans/*.json
            data/ai-tested/shorts-v5/scripts/*.json
            data/ai-tested/shorts-v5/treatments/*.json
            data/ai-tested/shorts-v5/manifest.json
            data/ai-tested/shorts-v5/production-records/**
          if-no-files-found: warn
          retention-days: 14
