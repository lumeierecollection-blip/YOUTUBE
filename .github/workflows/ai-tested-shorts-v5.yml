name: AI Tested Shorts V5 - Gemini Directed Production

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/ai-tested-shorts-vox"
    paths:
      - "data/ai-tested/shorts-v5/**"
      - ".github/workflows/ai-tested-shorts-v5.yml"
      - "scripts/ai-tested-v4-review.mjs"
      - "scripts/ai-tested-v5-correct.mjs"
      - "scripts/ai-tested-v5-director.mjs"
      - "scripts/ai-tested-v5-acceptance.mjs"

permissions:
  contents: read

jobs:
  render-shorts-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libpango-1.0-0 libcairo2 fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install edge-tts rembg[cli] pillow || pip install edge-tts pillow
      - name: Remove photo backgrounds
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          mkdir -p assets/photos/cutouts
          shopt -s nullglob
          for f in assets/photos/*.jpg assets/photos/*.jpeg assets/photos/*.png; do
            [ -f "$f" ] || continue
            base=$(basename "$f"); stem="${base%.*}"; out="assets/photos/cutouts/${stem}.png"
            rembg i "$f" "$out" || true
            if [ -f "$out" ]; then cp "$out" "assets/photos/${stem}.png"; elif [[ "$f" != *.png ]]; then ffmpeg -y -i "$f" "assets/photos/${stem}.png" || true; fi
          done
      - name: Verify real SFX library (no sine-wave substitutes)
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          test -f assets/sfx/manifest.json
          node -e "const m=require('./assets/sfx/manifest.json'); if(!Array.isArray(m)||m.length<8){console.error('SFX manifest too small'); process.exit(1)}; for(const e of m){ if(!e.file||!e.source||!e.license) {console.error('bad manifest entry',e); process.exit(1)} } console.log('SFX ok', m.length)"
          ls -la assets/sfx
      - name: Install render deps
        working-directory: data/ai-tested/shorts-v5/render
        run: npm install && npx remotion browser ensure
      - name: Gemini pre-render creative direction (MANDATORY)
        working-directory: data/ai-tested/shorts-v5
        run: |
          mkdir -p production-records
          node ../../../scripts/ai-tested-v5-director.mjs --root .
          test ! -f production-records/DIRECTOR_FAILED.txt
      - name: Generate TTS
        working-directory: data/ai-tested/shorts-v5
        run: node generate-tts.mjs
      - name: Render
        working-directory: data/ai-tested/shorts-v5/render
        run: node render-all.mjs
      - name: Gemini review and correction loop (continues until pass or blocker)
        if: always()
        timeout-minutes: 70
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          mkdir -p reviews production-records
          MAX_CYCLES=6
          LOOP_START=$SECONDS
          MAX_LOOP_SECONDS=3600
          all_pass=false
          for cycle in $(seq 1 $MAX_CYCLES); do
            if [ $((SECONDS - LOOP_START)) -gt $MAX_LOOP_SECONDS ]; then echo "LOOP_TIME_CAP_REACHED"; break; fi
            echo "=== REVIEW CYCLE $cycle / $MAX_CYCLES ==="
            rm -rf qa/frames qa/contact-sheets "reviews/cycle-$cycle"
            mkdir -p qa/frames qa/contact-sheets "reviews/cycle-$cycle"
            for f in out/*.mp4; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .mp4)
              mkdir -p "qa/frames/$base"
              ffmpeg -y -i "$f" -vf "fps=1,scale=540:-1" "qa/frames/$base/%03d.jpg"
              ffmpeg -y -i "$f" -vf "select='not(mod(n\,30))',scale=360:-1,tile=4x4" -frames:v 1 "qa/contact-sheets/${base}.jpg" || true
            done
            timeout -k 30s 15m node ../../../scripts/ai-tested-v4-review.mjs --root . --out "reviews/cycle-$cycle" || echo "REVIEW_EXEC_FAILED_$cycle" > "reviews/cycle-$cycle/REVIEW_EXEC_FAILED.txt"
            cp "reviews/cycle-$cycle/summary.json" "production-records/review-cycle-$cycle-summary.json" 2>/dev/null || true
            # Determine if all reviewed and passed
            pass_state=$(python -c "import json,glob,os; fs=glob.glob('reviews/cycle-$cycle/*.review.json'); rs=[json.load(open(f)) for f in fs if os.path.basename(f)!='summary.json']; print('all_pass' if rs and all(r.get('status')=='reviewed' and r.get('pass') is True for r in rs) and len(rs)>=5 else 'needs_work')")
            echo "pass_state=$pass_state"
            if [ "$pass_state" = "all_pass" ]; then
              echo "All videos passed in cycle $cycle"
              all_pass=true
              cp -r "reviews/cycle-$cycle" reviews/final || true
              break
            fi
            timeout -k 30s 5m node ../../../scripts/ai-tested-v5-correct.mjs --root . --reviews "reviews/cycle-$cycle" --plans plans || echo "CORRECT_EXEC_FAILED_$cycle" > "reviews/cycle-$cycle/CORRECT_EXEC_FAILED.txt"
            cp "reviews/cycle-$cycle/correction.json" "production-records/correction-cycle-$cycle.json" 2>/dev/null || true
            changed=0
            if [ -f "reviews/cycle-$cycle/correction.json" ]; then
              changed=$(python -c "import json; d=json.load(open('reviews/cycle-$cycle/correction.json')); print(len([c for c in d.get('changed',[]) if c.get('mode') not in ('none','llm_error','exception')]))")
            fi
            echo "changed=$changed"
            if [ "$changed" = "0" ] && [ "$cycle" -ge 3 ]; then
              echo "No actionable corrections after cycle $cycle; continuing to final review"
              cp -r "reviews/cycle-$cycle" reviews/final || true
              break
            fi
            echo "Rerendering after corrections..."
            (cd render && timeout -k 60s 45m node render-all.mjs) || { echo "RERENDER_FAILED_$cycle" > "production-records/RERENDER_FAILED_cycle_$cycle.txt"; echo "Rerender failed in cycle $cycle; continuing to next review"; }
          done
          if [ ! -d reviews/final ]; then
            mkdir -p reviews/final
            cp reviews/cycle-$MAX_CYCLES/*.json reviews/final/ 2>/dev/null || true
          fi
          echo "all_pass=$all_pass" > production-records/review-loop-state.txt
      - name: Final Gemini review (mandatory, actual rendered output)
        id: final_review
        if: always()
        working-directory: data/ai-tested/shorts-v5
        run: |
          set -euo pipefail
          rm -rf qa/frames qa/contact-sheets && mkdir -p qa/frames qa/contact-sheets reviews/final
          for f in out/*.mp4; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .mp4)
            mkdir -p "qa/frames/$base"
            ffmpeg -y -i "$f" -vf "fps=1,scale=540:-1" "qa/frames/$base/%03d.jpg"
            ffmpeg -y -i "$f" -vf "select='not(mod(n\,30))',scale=360:-1,tile=4x4" -frames:v 1 "qa/contact-sheets/${base}.jpg" || true
          done
          timeout -k 30s 15m node ../../../scripts/ai-tested-v4-review.mjs --root . --out reviews/final --force || echo "FINAL_REVIEW_EXEC_FAILED" > reviews/final/EXEC_FAILED.txt
          # Retry once if any review hit transient LLM error
          if grep -l '"reason": "llm_error"' reviews/final/*.review.json >/dev/null 2>&1; then
            echo "Retrying final review for llm_error cases after 90s..."
            sleep 90
            timeout -k 30s 15m node ../../../scripts/ai-tested-v4-review.mjs --root . --out reviews/final --force || echo "FINAL_REVIEW_EXEC_FAILED_2" > reviews/final/EXEC_FAILED_2.txt
          fi
      - name: Technical QA
        id: tech_qa
        if: always()
        working-directory: data/ai-tested/shorts-v5
        run: python qa-verify.py out qa || (echo "TECH_QA_FAILED" > qa/TECH_QA_FAILED.txt; exit 1)
      - name: Production summary and acceptance gate
        id: acceptance
        if: always()
        working-directory: data/ai-tested/shorts-v5
        run: |
          python build-summary.py . || true
          node ../../../scripts/ai-tested-v5-acceptance.mjs --root . --reviews reviews/final
      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tested-shorts-v5
          path: |
            data/ai-tested/shorts-v5/out/*.mp4
            data/ai-tested/shorts-v5/production-summary.txt
            data/ai-tested/shorts-v5/qa/**
            data/ai-tested/shorts-v5/reviews/**
            data/ai-tested/shorts-v5/plans/*.json
            data/ai-tested/shorts-v5/scripts/*.json
            data/ai-tested/shorts-v5/treatments/*.json
            data/ai-tested/shorts-v5/manifest.json
            data/ai-tested/shorts-v5/assets/manifests/**
            data/ai-tested/shorts-v5/assets/sfx/manifest.json
            data/ai-tested/shorts-v5/production-records/**
          if-no-files-found: warn
          retention-days: 14
