# TTS Probe — throwaway diagnostic, PROMPT-SELF-HEALING-RUN.md Priority 1 (T1.2).
#
# Answers exactly one question: does edge-tts actually produce a real audio
# file when run on a GitHub-hosted Actions runner? This sandbox's own egress
# proxy blocks the WebSocket connection edge-tts needs, so that result can't
# be trusted — this runs the same command on GitHub's real infrastructure
# instead. Delete this workflow once the answer is known and acted on.

name: TTS Probe (throwaway diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Synthesize one sentence
        id: synth
        run: |
          set +e
          edge-tts --voice "en-US-JennyNeural" --rate="-8%" --pitch="+2Hz" \
            --text "This is a test of the edge text to speech engine running on a GitHub Actions runner." \
            --write-media /tmp/probe.mp3 --write-subtitles /tmp/probe.srt \
            > /tmp/edge-tts.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "--- edge-tts output ---"
          cat /tmp/edge-tts.log
          exit 0

      - name: Probe the result with ffprobe
        run: |
          echo "## TTS Probe Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "edge-tts exit code: ${{ steps.synth.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/edge-tts.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/probe.mp3 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "File exists, size: $(stat -c%s /tmp/probe.mp3) bytes" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type -of default=noprint_wrappers=1 /tmp/probe.mp3 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/probe.mp3 2>/dev/null || echo 0)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if awk "BEGIN{exit !($DURATION > 0)}"; then
              echo "**VERDICT: (a) edge-tts WORKS on Actions — real audio, duration ${DURATION}s**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**VERDICT: (c) file exists but has no valid duration — investigate**" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**VERDICT: (b) edge-tts BLOCKED on Actions — no file produced (or zero-length)**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-probe-result
          path: |
            /tmp/probe.mp3
            /tmp/probe.srt
            /tmp/edge-tts.log
          retention-days: 1
