# The voice lab: the same production-style script, asked of Gemini TTS several ways (voice, whole script vs per sentence, direction), each scored by
# the production narration judge (scripts/narration-judge.mjs). Reports only; changes nothing. See scripts/voice-lab.mjs.
name: voice-lab
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated variant names to run (empty = all)"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install faster-whisper + ffmpeg
        run: |
          pip install --quiet faster-whisper
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
      - name: Run the lab
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: node scripts/voice-lab.mjs --out out/lab --only "${{ github.event.inputs.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-lab-${{ github.run_id }}
          path: out/lab/
