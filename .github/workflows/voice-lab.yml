# The voice lab: the same production-style script, asked of Gemini TTS several ways (voice, whole script vs per sentence, direction), each scored by
# the production narration judge (scripts/narration-judge.mjs). Reports only; changes nothing. See scripts/voice-lab.mjs.
name: voice-lab
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated variant names to run (empty = all)"
        type: string
        default: ""
      set:
        description: "lab (production-style script x voice x direction) | lab2 (the missing controls + per-sentence + the real board texts) | corpus (the real board texts only) | stability (same audio judged 3x; same request synthesised 4x) | probe (why does the judge's first model never answer?)"
        type: string
        default: "lab2"
      corpus_run:
        description: "Board run whose prep artifacts hold the real spoken texts and production mp3s (prep artifacts expire after a day)"
        type: string
        default: "38047691386"
permissions:
  contents: read
  actions: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install faster-whisper + ffmpeg
        run: |
          pip install --quiet faster-whisper
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
      - name: Fetch the real board texts (prep artifacts of the corpus run)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: prep-*-${{ github.event.inputs.corpus_run }}
          path: corpus
          run-id: ${{ github.event.inputs.corpus_run }}
          github-token: ${{ github.token }}
      - name: Judge probe (every model x key, with and without audio)
        if: github.event.inputs.set == 'probe'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          MP3=$(find corpus -name '*-vo.mp3' | sort | head -1)
          echo "probe audio: $MP3"
          node scripts/judge-probe.mjs --audio "$MP3"
      - name: Run the lab
        if: github.event.inputs.set != 'probe'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: node scripts/voice-lab.mjs --set "${{ github.event.inputs.set }}" --corpus corpus --out out/lab --only "${{ github.event.inputs.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-lab-${{ github.run_id }}
          path: out/lab/
