# Reads the OFFICIAL Gemini API pricing and rate-limit pages (owner, 2026-10-10: do not guess the rates). Prints the lines that mention the
# flash-lite and flash models, audio, and the free-tier limits. Reads only.
name: pricing-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Official pricing page
        run: |
          curl -sSL https://ai.google.dev/gemini-api/docs/pricing -o pricing.html
          python3 - <<'PY'
          import re, html
          t = open("pricing.html", encoding="utf-8", errors="replace").read()
          t = html.unescape(re.sub(r"<script.*?</script>|<style.*?</style>", " ", t, flags=re.S))
          t = re.sub(r"<[^>]+>", "\n", t)
          lines = [l.strip() for l in t.split("\n") if l.strip()]
          keep = [l for l in lines if re.search(r"flash-lite|Flash-Lite|audio|Audio|free tier|Free tier|RPM|TPM|RPD|per 1M|1M tokens", l)]
          print(f"lines kept: {len(keep)} of {len(lines)}")
          for l in keep[:200]: print(l[:240])
          PY
      - name: Rate-limit page
        run: |
          curl -sSL https://ai.google.dev/gemini-api/docs/rate-limits -o limits.html
          python3 - <<'PY'
          import re, html
          t = open("limits.html", encoding="utf-8", errors="replace").read()
          t = html.unescape(re.sub(r"<script.*?</script>|<style.*?</style>", " ", t, flags=re.S))
          t = re.sub(r"<[^>]+>", "\n", t)
          lines = [l.strip() for l in t.split("\n") if l.strip()]
          keep = [l for l in lines if re.search(r"Flash-Lite|flash-lite|Free|RPM|TPM|RPD", l)]
          print(f"lines kept: {len(keep)} of {len(lines)}")
          for l in keep[:200]: print(l[:240])
          PY
