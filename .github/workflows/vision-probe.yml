# Source a small list of pictures on demand: jobs file data/source-jobs/<name>.json into public/lf2/<dir>, committed to sourced/<name>.
name: Vision probe
on:
  workflow_dispatch:
    inputs:
      name: { description: "jobs file name (data/source-jobs/<name>.json)", required: true, default: probe }
      dir: { description: "channel dir under public/lf2", required: true, default: ai-tested }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SOURCE_BUDGET_MIN: "15"
        run: node platform/longform/v2/auto-source.mjs data/source-jobs/${{ inputs.name }}.json ${{ inputs.dir }}
      - run: |
          git config user.name autopilot; git config user.email autopilot@users.noreply.github.com
          git checkout -b "sourced/${{ inputs.name }}"; git add -A src/skills/remotion-render/public/lf2/${{ inputs.dir }}
          git commit -qm "sourced pictures for ${{ inputs.name }}" || echo nothing; git push -f origin "sourced/${{ inputs.name }}"
