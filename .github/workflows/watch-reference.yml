name: watch-reference
# Research-only. Downloads 3 named reference videos, samples frames/captions/loudness, commits to the dev branch. Dev-branch push only.
on:
  push:
    branches: [ccr-d003fff3-tnca93]
    paths: [scripts/watch-reference.sh]
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/watch-reference.sh
