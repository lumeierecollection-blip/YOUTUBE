name: AI Tested Shorts V3 - White Editorial Production

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/ai-tested-shorts-vox"
    paths:
      - "data/ai-tested/shorts-v3/**"
      - ".github/workflows/ai-tested-shorts-v3.yml"

permissions:
  contents: read

jobs:
  render-shorts-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libpango-1.0-0 libcairo2
          python -m pip install --upgrade pip
          pip install edge-tts rembg[cli] || pip install edge-tts
      - name: Remove photo backgrounds
        working-directory: data/ai-tested/shorts-v3
        run: |
          set -euo pipefail
          mkdir -p assets/photos/cutouts
          for f in assets/photos/*.jpg assets/photos/*.jpeg assets/photos/*.png; do
            [ -e "$f" ] || continue
            base=$(basename "$f"); out="assets/photos/cutouts/${base%.*}.png"
            rembg i "$f" "$out" || true
          done
          if [ -d assets/photos/cutouts ]; then
            for f in assets/photos/cutouts/*.png; do [ -e "$f" ] || continue; base=$(basename "$f" .png); cp "$f" "assets/photos/${base}.png" || true; done
          fi
      - name: Install render deps
        working-directory: data/ai-tested/shorts-v3/render
        run: npm install && npx remotion browser ensure
      - name: Generate TTS
        working-directory: data/ai-tested/shorts-v3
        run: node generate-tts.mjs
      - name: Render
        working-directory: data/ai-tested/shorts-v3/render
        run: node render-all.mjs
      - name: QA
        working-directory: data/ai-tested/shorts-v3
        run: python qa-verify.py out qa
      - name: Summary
        working-directory: data/ai-tested/shorts-v3
        run: python build-summary.py .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ai-tested-shorts-v3
          path: |
            data/ai-tested/shorts-v3/out/*.mp4
            data/ai-tested/shorts-v3/production-summary.txt
            data/ai-tested/shorts-v3/qa/*.txt
          if-no-files-found: error
          retention-days: 14
