# One-off diagnostic: confirms whether GitHub-hosted runners for this repo
# can actually reach the asset-sourcing APIs, rather than assuming they can
# because ubuntu-latest usually has open egress. Deleted once
# build-asset-library.yml's own real fetch-library.js run confirms the same
# thing end to end.
name: Network Policy Check (diagnostic)

on:
  workflow_dispatch: {}
  # workflow_dispatch alone turned out to be untriggerable from this
  # session's GitHub App token ("403 Resource not accessible by
  # integration" — an actions:write scope gap, not a network-policy
  # finding). Push access to this branch works fine (every other commit
  # this session used it), so a scoped push trigger is the workaround —
  # removed once this diagnostic's result is captured.
  push:
    branches:
      - claude/png-sourcing-animations-captions-wgv6ty
    paths:
      - ".github/workflows/network-policy-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curl every asset-sourcing host
        run: |
          set +e
          for pair in \
            "wikimedia:https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srsearch=test" \
            "met:https://collectionapi.metmuseum.org/public/collection/v1/search?q=test" \
            "nasa:https://images-api.nasa.gov/search?q=test&media_type=image" \
            "loc:https://www.loc.gov/photos/?q=test&fo=json" \
            "nara:https://catalog.archives.gov/api/v2/records/search?q=test&limit=1" \
            "smithsonian:https://api.si.edu/openaccess/api/v1.0/search?q=test&api_key=DEMO_KEY" \
            "pexels:https://api.pexels.com/v1/search?query=test" \
            "unsplash:https://api.unsplash.com/search/photos?query=test" \
            "openverse:https://api.openverse.org/v1/images/?q=test" \
            "rawpixel:https://www.rawpixel.com/search/test" \
          ; do
            name="${pair%%:*}"
            url="${pair#*:}"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            echo "$name -> HTTP $code"
          done
