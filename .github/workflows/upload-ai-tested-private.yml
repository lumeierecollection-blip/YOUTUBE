name: Upload AI Tested Short (Private)

# Independent, minimal upload-only workflow for the accepted AI Tested MCP Short.
#
# Does NOT depend on channel-production-2.yml (whose workflow_dispatch trigger is
# not recognized by the Actions service). Does NOT render or regenerate anything.
# Transfers the already-accepted MP4 from the repository checkout, verifies its
# SHA-256, and uploads it to YouTube as PRIVATE using the existing authentication
# and upload implementation.
#
#   node scripts/youtube-upload.cjs --file <mp4> --title <title> --description <desc> --tags <tags> --channel 2
#
# Credentials are materialized at runtime from the CHANNEL_02_* GitHub Actions
# secrets into config/creds/ch-02.json (never committed), then the existing
# scripts/youtube-upload.cjs uploads with privacyStatus hardcoded to "private".

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify integrity only, do not upload'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  upload-private:
    name: Upload Accepted MP4 to YouTube (Private)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    env:
      CH02_CLIENT_ID: ${{ secrets.CHANNEL_02_CLIENT_ID }}
      CH02_CLIENT_SECRET: ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
      CH02_REFRESH_TOKEN: ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (for ffprobe verification)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Verify accepted MP4 integrity before upload
        id: verify
        run: |
          MP4="output/final-pipeline-repair/ai-tested/final.mp4"
          if [ ! -f "$MP4" ]; then
            echo "::error::Accepted MP4 not found: $MP4"
            exit 1
          fi
          ACTUAL_SHA=$(sha256sum "$MP4" | awk '{print $1}')
          EXPECTED_SHA="6AA8C686F62776888B08098F3CB63F1987406DCB9A5EC25C43E7441585139D98"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          echo "Expected SHA-256: $EXPECTED_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA-256 mismatch — aborting upload"
            exit 1
          fi
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$MP4")
          echo "Duration: $DUR s"
          if [ "$(echo "$DUR > 30" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "::error::Duration $DUR s exceeds the 30 s Short limit — aborting"
            exit 1
          fi
          echo "mp4_path=$MP4" >> $GITHUB_OUTPUT
          echo "sha256=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "duration=$DUR" >> $GITHUB_OUTPUT

      - name: Check for duplicate upload of this production
        id: dupcheck
        run: |
          MP4="output/final-pipeline-repair/ai-tested/final.mp4"
          ACTUAL_SHA=$(sha256sum "$MP4" | awk '{print $1}')
          LEDGER="data/uploaded/$(date +%F).json"
          DUPLICATE="false"
          if [ -f "$LEDGER" ]; then
            if node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('$LEDGER','utf8'));const found=(d.uploads||[]).some(u=>u.sha256==='$ACTUAL_SHA'||u.filePath==='$MP4');process.exit(found?0:1)"; then
              echo "::warning::A previous upload record for this exact MP4/hash already exists in $LEDGER"
              DUPLICATE="true"
            fi
          fi
          # Also check channel-specific upload records
          if [ -d "data/uploads/2" ]; then
            EXISTING=$(find "data/uploads/2" -name '*.json' -print0 | xargs -0 node -e "
              const fs=require('fs');const sha=process.argv[1];
              let found=false;
              for (const f of fs.readdirSync('data/uploads/2')) {
                try { const d=JSON.parse(fs.readFileSync('data/uploads/2/'+f,'utf8')); if (d.sha256===sha||d.filePath.includes('final.mp4')) found=true; } catch {}
              }
              process.exit(found?0:1);
            " "$ACTUAL_SHA" 2>/dev/null || true)
            if [ $? -eq 0 ]; then
              echo "::warning::A previous channel-specific upload record for this hash already exists"
              DUPLICATE="true"
            fi
          fi
          echo "duplicate=$DUPLICATE" >> $GITHUB_OUTPUT

      - name: Materialize OAuth credentials for AI Tested (ch-02)
        env: { CHANNEL_ID_NUM: 2 }
        run: |
          node -e "
            const fs = require('fs');
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            const ch = resolveChannel(process.env.CHANNEL_ID_NUM);
            const own = 'config/creds/' + ch.channel_id + '.json';
            const declared = ch.youtube_credentials_path || own;
            if (declared !== own) { console.error('::error::channel ' + ch.channel_id + ' declares ' + declared + ', not ' + own); process.exit(1); }
            const n = String(ch.channel_id).replace(/^ch-0*/,'').padStart(2,'0');
            const clientId = process.env['CH' + n + '_CLIENT_ID'];
            const clientSecret = process.env['CH' + n + '_CLIENT_SECRET'];
            const refreshToken = process.env['CH' + n + '_REFRESH_TOKEN'];
            if (!(clientId && clientSecret && refreshToken)) {
              console.log('::warning::No credentials configured for ' + ch.channel_id + ' — upload skipped');
              process.exit(0);
            }
            fs.mkdirSync('config/creds', { recursive: true });
            fs.writeFileSync(own, JSON.stringify({client_id:clientId, client_secret:clientSecret, refresh_token:refreshToken}, null, 2));
            console.log('Credentials materialized for ' + ch.channel_id + ' (' + ch.channel_name + ')');
          "

      - name: Upload to YouTube (Private)
        if: steps.verify.outputs.sha256 != '' && steps.dupcheck.outputs.duplicate != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          node scripts/youtube-upload.cjs \
            --file "output/final-pipeline-repair/ai-tested/final.mp4" \
            --title "What Is Model Context Protocol? Explained in 26 Seconds" \
            --description "A quick explanation of the Model Context Protocol (MCP), how it connects AI applications to external tools and data, and why it matters for AI integrations.

#AI #ModelContextProtocol #MCP #ArtificialIntelligence #TechExplained" \
            --tags "AI,ModelContextProtocol,MCP,ArtificialIntelligence,TechExplained" \
            --channel 2
          echo "✓ Private upload complete for AI Tested (ch-02)"

      - name: Record upload result
        if: always()
        run: |
          echo "## Upload Status — AI Tested (ch-02)" >> $GITHUB_STEP_SUMMARY
          echo "- MP4: output/final-pipeline-repair/ai-tested/final.mp4" >> $GITHUB_STEP_SUMMARY
          echo "- SHA-256: ${{ steps.verify.outputs.sha256 }}" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${{ steps.verify.outputs.duration }} s" >> $GITHUB_STEP_SUMMARY
          echo "- Duplicate detected: ${{ steps.dupcheck.outputs.duplicate }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
