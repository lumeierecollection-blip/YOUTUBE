name: qa-proof

# Proof, on GitHub runners, of the new creative-direction / QA code against REAL
# media (owner, 2026-10-22: tests and verification run on GitHub, not the dev
# machine). Read-only: nothing is published or pushed. Artifacts carry the
# frames and contact sheets so a human (and visual-qa) can look at them.
#
#   render-qa  - render the clone-proof fixture with the production renderer,
#                run objective checks + risk frames + defect report on it
#                (expect clean), then damage a copy (1.5 s black, 16:9 pad) and
#                prove the checks find exactly those defects.
#   reference  - analyze research/motion-graphics-ref/ref-01.mp4 with vision
#                (Gemini, the pipeline's secrets) -> direction.json/.md.
on:
  push:
    paths:
      - "scripts/qa/**"
      - "scripts/reference/**"
      - "scripts/direction/**"
      - "scripts/jobs/**"
      - "schemas/defect-report.json"
      - "schemas/creative-direction.json"
      - "schemas/scene-brief.json"
      - ".github/workflows/qa-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)
      - name: Ensure ffmpeg/ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install rembg (frameless cut-outs)
        run: |
          pip install --quiet "rembg[cpu]" pillow numpy
          python -c "from rembg import new_session; new_session('u2net'); print('u2net ready')"
      - name: Unit tests for the new modules
        run: |
          node --test scripts/__tests__/qa-loop.test.js scripts/__tests__/qa-objective.test.js \
            scripts/__tests__/reference-analysis.test.js scripts/__tests__/scene-brief.test.js \
            scripts/__tests__/job-state.test.js scripts/__tests__/script-context-inventory.test.js \
            scripts/__tests__/script-name-fidelity.test.js scripts/__tests__/resolve-place-typed-org.test.js
      - name: Render the clone-proof fixture (production renderer)
        env:
          REMOTION_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/qa-canvas-render.mjs --out out/clone --only-extra --extra-beats scripts/fixtures/clone-proof/beats.json \
            --moments 0.08,0.3,0.55,0.8 --video --clone cutout-collage --quotes scripts/fixtures/clone-proof/quotes.json --accent "#8B1E1E"
          ls -la out/clone | head -40
      - name: QA core on the real render (expect clean)
        run: |
          V=$(ls out/clone/*.mp4 | head -1); M=$(ls out/clone/*manifest*.json 2>/dev/null | head -1)
          echo "video=$V manifest=$M"
          node scripts/qa/proof.mjs --video "$V" ${M:+--manifest "$M"} --out out/qa-clean --expect clean
      - name: Damage a copy of the render, prove detection
        run: |
          V=$(ls out/clone/*.mp4 | head -1)
          # 1.5 s of black in the middle (blank-frames) and a 16:9 frame (aspect/resolution).
          ffmpeg -v error -y -i "$V" -vf "drawbox=enable='between(t,1.5,3.0)':x=0:y=0:w=iw:h=ih:color=black:t=fill,scale=1080:608,pad=1080:1920:0:656" -c:a copy out/damaged-tmp.mp4
          ffmpeg -v error -y -i out/damaged-tmp.mp4 -vf "scale=1920:1080" -c:a copy out/damaged.mp4
          node scripts/qa/proof.mjs --video out/damaged.mp4 --out out/qa-damaged --expect blank-frames,aspect
      - name: Step summary
        if: always()
        run: |
          for d in out/qa-clean out/qa-damaged; do
            [ -f "$d/proof-summary.json" ] && { echo "### $d"; echo '```json'; cat "$d/proof-summary.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ls "$d"/*-defects.md 2>/dev/null | head -1 | xargs -r cat >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload render + QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-proof-${{ github.run_id }}
          path: |
            out/clone/*.mp4
            out/clone/*manifest*.json
            out/qa-clean
            out/qa-damaged
          if-no-files-found: warn
          retention-days: 14

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)
      - name: Ensure ffmpeg/ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Analyze ref-01 with vision
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          node scripts/reference/analyze-reference.mjs research/motion-graphics-ref/ref-01.mp4 --out out/ref-01
          node -e "const d=require('./out/ref-01/direction.json');console.log('status',d.direction.status,d.direction.why||'');console.log('frames_sent',d.frames_sent.length,'storyboard',d.storyboard.length,'rejected',d.rejected_observations.length)"
          cat out/ref-01/direction.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-ref-01-${{ github.run_id }}
          path: out/ref-01
          if-no-files-found: warn
          retention-days: 14
