name: AI Tested Shorts V2 - Motion Graphics Production

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/ai-tested-shorts-vox"
    paths:
      - "data/ai-tested/shorts-v2/**"
      - ".github/workflows/ai-tested-shorts-v2.yml"

permissions:
  contents: read

jobs:
  render-shorts-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libpango-1.0-0 libcairo2
          python -m pip install --upgrade pip
          pip install edge-tts rembg[cli] || pip install edge-tts

      - name: Remove photo backgrounds (cutouts)
        working-directory: data/ai-tested/shorts-v2
        run: |
          set -euo pipefail
          mkdir -p assets/photos/cutouts
          for f in assets/photos/*.jpg assets/photos/*.png; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            out="assets/photos/cutouts/${base%.*}.png"
            echo "rembg $f -> $out"
            rembg i "$f" "$out" || cp "$f" "$out" || true
          done
          # prefer cutouts in render by copying cutouts over originals in public later
          ls -la assets/photos/cutouts || true

      - name: Install render deps
        working-directory: data/ai-tested/shorts-v2/render
        run: |
          npm install
          npx remotion browser ensure

      - name: Generate narration (TTS)
        working-directory: data/ai-tested/shorts-v2
        run: |
          node generate-tts.mjs
          ls -la audio

      - name: Prepare cutout photos for render
        working-directory: data/ai-tested/shorts-v2
        run: |
          set -euo pipefail
          if [ -d assets/photos/cutouts ]; then
            for f in assets/photos/cutouts/*.png; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .png)
              # overwrite matching jpg/png in assets/photos for simple component path
              cp "$f" "assets/photos/${base}.png" || true
            done
          fi

      - name: Render all 5 Shorts V2 on GitHub
        working-directory: data/ai-tested/shorts-v2/render
        run: |
          node render-all.mjs
          ls -la ../out

      - name: QA - verify outputs
        working-directory: data/ai-tested/shorts-v2
        run: |
          set -euo pipefail
          python qa-verify.py out qa

      - name: Build production summary
        working-directory: data/ai-tested/shorts-v2
        run: |
          python build-summary.py .

      - name: Upload finished Shorts V2
        uses: actions/upload-artifact@v4
        with:
          name: ai-tested-shorts-v2
          path: |
            data/ai-tested/shorts-v2/out/*.mp4
            data/ai-tested/shorts-v2/production-summary.txt
            data/ai-tested/shorts-v2/qa/*.txt
          if-no-files-found: error
          retention-days: 14
