# Read-only. Answers three questions with the live API and the official deprecations page:
#  1. Which Gemini model IDs does each key's project still list? (GET /v1beta/models, not quota-gated)
#  2. For each model the repo names, what does a one-token call return, and what does the quota error say
#     about the tier? (error.details carries quotaId; free-tier quota ids contain "FreeTier")
#  3. What does the official deprecations page say about 2.5, 3.x and Deep Research? (rendered in a browser)
# Prints no key material. Changes nothing.
name: model-status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
    steps:
      - name: Models each key can see, and the Deep Research agents
        run: |
          cat > list_models.py <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          for var in ["GEMINI_API_KEY", "GEMINI_API_KEY_1", "GEMINI_API_KEY_2", "GEMINI_API_KEY_3", "GEMINI_API_KEY_4"]:
              key = os.environ.get(var)
              if not key:
                  print(f"{var}: secret not set"); continue
              names, pages, err = [], 0, None
              url = "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000"
              try:
                  while url and pages < 20:
                      req = urllib.request.Request(url, headers={"x-goog-api-key": key})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          j = json.load(r)
                      pages += 1
                      names += [m["name"].removeprefix("models/") for m in j.get("models", [])]
                      tok = j.get("nextPageToken")
                      url = ("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&pageToken=" + tok) if tok else None
              except urllib.error.HTTPError as e:
                  err = f"HTTP {e.code}: {e.read()[:300].decode('utf-8', 'replace')}"
              except Exception as e:
                  err = str(e)[:300]
              if err:
                  print(f"{var}: model list failed: {err}"); continue
              print(f"{var}: {len(names)} models listed")
              for n in sorted(names):
                  if re.search(r"gemini-(2\.5|3\.)|deep-research|gemini-3-flash", n):
                      print(f"  {n}")
          PY
          python3 list_models.py
      - name: One-token call per model per key, with the quota error details
        run: |
          cat > calls.py <<'PY'
          import json, os, subprocess
          MODELS = ["gemini-3.5-flash-lite", "gemini-3.5-flash", "gemini-3.6-flash", "gemini-3.8-flash", "gemini-2.5-flash", "gemini-2.5-flash-lite"]
          BODY = json.dumps({"contents": [{"parts": [{"text": "Say OK."}]}], "generationConfig": {"maxOutputTokens": 4, "temperature": 0}})
          for var in ["GEMINI_API_KEY", "GEMINI_API_KEY_1", "GEMINI_API_KEY_2", "GEMINI_API_KEY_3", "GEMINI_API_KEY_4"]:
              key = os.environ.get(var)
              if not key:
                  continue
              for m in MODELS:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent"
                  out = subprocess.run(["curl", "-sS", "-o", "/tmp/r.json", "-w", "%{http_code}", "-H", "Content-Type: application/json",
                                        "-H", f"x-goog-api-key: {key}", "-d", BODY, url], capture_output=True, text=True).stdout.strip()
                  try:
                      j = json.load(open("/tmp/r.json"))
                  except Exception:
                      print(f"{var} {m} HTTP {out} (unreadable body)"); continue
                  if "error" in j:
                      e = j["error"]
                      details = json.dumps(e.get("details", []))[:700]
                      print(f"{var} {m} HTTP {out} {e.get('status')}: {str(e.get('message', ''))[:120]}")
                      print(f"    details: {details}")
                  else:
                      parts = j.get("candidates", [{}])[0].get("content", {}).get("parts", [])
                      print(f"{var} {m} HTTP {out} answer: {' '.join(p.get('text', '') for p in parts)[:60]!r}")
          PY
          python3 calls.py
      - name: Official deprecations page (rendered)
        run: |
          python3 -m pip install --quiet playwright==1.47.2
          python3 -m playwright install --with-deps chromium
          cat > deprec.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.goto("https://ai.google.dev/gemini-api/docs/deprecations", wait_until="networkidle", timeout=90000)
              text = pg.inner_text("body")
              b.close()
          lines = [l.strip() for l in text.split("\n") if l.strip()]
          print(f"deprecations page: {len(lines)} lines")
          hit = [i for i, l in enumerate(lines) if re.search(r"2\.5|3\.1|3\.6|3\.8|deep-research|Deep Research|[Ss]hutdown|[Rr]etire|[Dd]eprecat", l)]
          shown = set()
          for i in hit:
              if i in shown:
                  continue
              for j in range(max(0, i - 1), min(len(lines), i + 3)):
                  shown.add(j)
                  print(f"  {lines[j][:220]}")
              print("  --")
          PY
          python3 deprec.py
