# Builds/extends data/asset-library/index.json (+ the treated PNGs under
# src/skills/remotion-render/public/asset-library/) by running
# src/skills/asset-sourcing/fetch-library.js for real.
#
# This exists because the interactive Claude Code session that built the
# asset-sourcing skill runs behind a proxy that only allows a fixed host
# allowlist (registry.npmjs.org, pypi.org, api.anthropic.com, ...) — every
# one of the 10 asset-sourcing hosts (Wikimedia, Met, NASA, LOC, NARA,
# Smithsonian, Pexels, Unsplash, Openverse, Rawpixel) gets a 403 from that
# proxy's CONNECT tunnel before the request ever reaches the real API. A
# one-off diagnostic (network-policy-check.yml, run 32541111436) confirmed
# the opposite is true here: real ubuntu-latest GitHub Actions runners
# reached all 10 hosts directly (200/200/200/200/200/200/200/401/200/403 —
# the 401 and 403 are Unsplash/Rawpixel correctly rejecting an unauthed
# probe request, not a network failure). fetch-library.js was always meant
# to run here (its own SKILL.md: "run manually or on its own schedule"),
# not inside the interactive session — this just makes that real.
name: Build Asset Library

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Channel id or channel_id string from config/channels.json"
        required: true
        default: "1"
      queries:
        description: "One search query per line"
        required: true
        default: |
          piggy bank savings
          credit card debt
          budget spreadsheet calculator
          emergency fund jar
          grocery shopping receipt
      count_per_query:
        description: "Assets to fetch per query"
        required: false
        default: "2"
      mode:
        description: "bw or color — leave empty to let fetch-library.js infer from the channel's bg_mode"
        required: false
        default: ""
  # TEMP-DISPATCH-WORKAROUND: this session's GitHub App token can't call the
  # workflow_dispatch API (403 "Resource not accessible by integration" —
  # actions:write scope gap), same issue network-policy-check.yml hit. Push
  # access works fine, so this scoped push trigger stands in for one real
  # workflow_dispatch call (the "Fetch each query" step below falls back to
  # the same defaults declared above via bash `:-` defaulting, since
  # `github.event.inputs` is empty on a push event) — remove this trigger
  # once that end-to-end run is captured.
  push:
    branches:
      - claude/png-sourcing-animations-captions-wgv6ty
    paths:
      - ".github/workflows/build-asset-library.yml"
      - "src/skills/asset-sourcing/**"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: npm ci

      # SKILL.md's documented setup: a dedicated venv, separate from the
      # pipeline's main Python env, because rembg's dependency tree
      # (onnxruntime, scikit-image, numba) is heavy and CPU-inference-only.
      - name: Cache rembg venv + u2net model weights
        uses: actions/cache@v4
        with:
          path: |
            .venv-rembg
            ~/.u2net
          key: rembg-venv-${{ runner.os }}-${{ hashFiles('src/skills/asset-sourcing/rembg_remove.py') }}

      - name: Set up rembg venv
        run: |
          if [ ! -x .venv-rembg/bin/rembg ] && [ ! -f .venv-rembg/bin/activate ]; then
            python3 -m venv .venv-rembg
          fi
          .venv-rembg/bin/pip install --quiet "rembg[cpu]"

      - name: Fetch each query
        env:
          # Keys are optional per-source (fetch-library.js/each sources/*.js
          # module logs a warning and returns no candidates when its key is
          # unset — it never fails the whole build). Wikimedia/Met/NASA/LOC
          # need none; the rest only run for real once these secrets exist.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          RAWPIXEL_API_KEY: ${{ secrets.RAWPIXEL_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv-rembg/bin:$PATH"
          # `github.event.inputs.*` is only populated for a real
          # workflow_dispatch event — empty on the push-trigger workaround
          # above, so every value falls back to bash `:-` defaults (the
          # same defaults declared in the workflow_dispatch inputs block)
          # rather than duplicating them a second time.
          CHANNEL_ID="${{ github.event.inputs.channel_id }}"; CHANNEL_ID="${CHANNEL_ID:-1}"
          COUNT="${{ github.event.inputs.count_per_query }}"; COUNT="${COUNT:-2}"
          MODE="${{ github.event.inputs.mode }}"
          QUERIES="${{ github.event.inputs.queries }}"
          if [ -z "$QUERIES" ]; then
            QUERIES="piggy bank savings
          credit card debt
          budget spreadsheet calculator
          emergency fund jar
          grocery shopping receipt"
          fi
          MODE_FLAG=()
          if [ -n "$MODE" ]; then
            MODE_FLAG=(--mode "$MODE")
          fi
          FAILED=0
          while IFS= read -r QUERY; do
            [ -z "$QUERY" ] && continue
            echo "=== fetch-library.js $CHANNEL_ID \"$QUERY\" --count $COUNT ==="
            if ! node src/skills/asset-sourcing/fetch-library.js "$CHANNEL_ID" $QUERY --count "$COUNT" "${MODE_FLAG[@]}"; then
              echo "::warning::fetch-library.js failed for query \"$QUERY\" — continuing with the rest"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$QUERIES"
          echo "queries_failed=$FAILED" >> "$GITHUB_ENV"

      - name: Report manifest size
        run: |
          node -e "
            const fs = require('fs');
            const p = 'data/asset-library/index.json';
            const m = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf-8')) : { assets: [] };
            console.log(\`Manifest now has \${m.assets.length} asset(s) total.\`);
          "

      - name: Commit manifest + treated assets
        run: |
          git config user.name "lumeierecollection-blip"
          git config user.email "lumeierecollection-blip@users.noreply.github.com"
          git add data/asset-library/index.json src/skills/remotion-render/public/asset-library/
          if git diff --cached --quiet; then
            echo "No new assets — nothing to commit."
          else
            git commit -m "asset-library: fetch-library.js run [${{ github.run_id }}]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
