name: Channel Production — AI Tested (ch-2)

# Topic-driven production pipeline for one YouTube channel (ch-02 AI Tested).
#
# Dispatch inputs control everything: channel_id and topic_slug select the
# channel and the topic; a production_id is generated per run and carried
# through script, research, assets, narration, timeline, render, QA and upload.
#
# Job sequence:
#   setup -> generate-narration (parallel)
#   build-timeline (needs setup + narration)
#   render-video (needs setup + timeline + narration)
#   run-quality-assurance (needs render-video + setup)
#   final-acceptance (needs run-quality-assurance + setup)  <- independent gate
#   publish-preparation (needs final-acceptance + render-video + setup)
#   publish-private (needs publish-preparation)             <- upload only if gate passed
#
# This is a graphics-only production (original motion graphics, no downloaded
# images), so there is no separate image-sourcing job. All visuals are drawn
# procedurally by scripts/editor/build-mcp-timeline.mjs from the sourced script.
#
# All cross-job files move via actions/upload-artifact + actions/download-artifact.
# Nothing goes public: uploads are private only; owner publishes manually.
# Fail closed: a missing or mismatched input stops the run; no silent fallback.

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render + QA only, no upload'
        required: false
        default: 'true'
      channel_id:
        description: 'Channel ID (dispatch key, e.g. 2)'
        required: true
        default: '2'
      topic_slug:
        description: 'Topic slug (e.g. model-context-protocol-mcp)'
        required: true
        default: ''

permissions:
  contents: read
  pages: write

concurrency:
  group: channel-prod-2-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCTION_ID: pt-ai-tested-${{ github.event.inputs.topic_slug || github.run_id }}-${{ github.run_attempt }}
  MAX_DURATION_S: 30

jobs:
  setup:
    name: Environment Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.vars.outputs.channel }}
      channel_name: ${{ steps.vars.outputs.channel_name }}
      topic_slug: ${{ steps.vars.outputs.topic_slug }}
      topic: ${{ steps.vars.outputs.topic }}
      production_id: ${{ steps.vars.outputs.production_id }}
      script_path: ${{ steps.vars.outputs.script_path }}
      stem: ${{ steps.vars.outputs.stem }}
      tts_topic: ${{ steps.vars.outputs.tts_topic }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install
      - name: Install System Tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg python-is-python3 curl jq
          fi
          ffmpeg -version | head -1
      - name: Setup Chrome for Remotion
        uses: browser-actions/setup-chrome@v1
        with: { chrome-version: stable }
      - name: Install Python TTS deps
        run: |
          pip3 install edge-tts --quiet 2>/dev/null || pip install edge-tts --quiet
          pip3 install faster-whisper --quiet 2>/dev/null || pip install faster-whisper --quiet
      - name: Resolve channel and topic from dispatch inputs
        id: vars
        run: |
          CHANNEL_ID="${{ github.event.inputs.channel_id }}"
          TOPIC_SLUG="${{ github.event.inputs.topic_slug }}"
          if [ -z "$TOPIC_SLUG" ]; then
            echo "::error::topic_slug is required for a topic-driven production"
            exit 1
          fi
          # Resolve channel from channels.json (fail closed on unknown/ambiguous)
          CHANNEL_JSON=$(node -e "
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            try { console.log(JSON.stringify(resolveChannel('$CHANNEL_ID'))); } catch(e) { console.error('::error::' + e.message); process.exit(1); }
          ") || exit 1
          CHANNEL_NUM=$(echo "$CHANNEL_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).id))")
          CHANNEL_NAME=$(echo "$CHANNEL_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).channel_name))")
          CHANNEL_ID_FIELD=$(echo "$CHANNEL_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).channel_id))")
          # Production ID: channel + topic + run attempt, unique per production
          PRODUCTION_ID="pt-ch${CHANNEL_NUM}-${TOPIC_SLUG}-${{ github.run_attempt }}"
          STEM="${TOPIC_SLUG}-shorts"
          TTS_TOPIC="${TOPIC_SLUG}-shorts-script"
          SCRIPT_PATH="data/research/${CHANNEL_NUM}/${TOPIC_SLUG}-shorts-script.json"
          # Fail closed: the requested script must exist for this production
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::Script not found for this production: $SCRIPT_PATH"
            echo "::error::Do not fall back to another topic's script."
            exit 1
          fi
          echo "channel=$CHANNEL_NUM" >> $GITHUB_OUTPUT
          echo "channel_name=$CHANNEL_NAME" >> $GITHUB_OUTPUT
          echo "channel_id_field=$CHANNEL_ID_FIELD" >> $GITHUB_OUTPUT
          echo "topic_slug=$TOPIC_SLUG" >> $GITHUB_OUTPUT
          echo "topic=$TOPIC_SLUG" >> $GITHUB_OUTPUT
          echo "production_id=$PRODUCTION_ID" >> $GITHUB_OUTPUT
          echo "script_path=$SCRIPT_PATH" >> $GITHUB_OUTPUT
          echo "stem=$STEM" >> $GITHUB_OUTPUT
          echo "tts_topic=$TTS_TOPIC" >> $GITHUB_OUTPUT
          echo "[setup] channel=$CHANNEL_NUM ($CHANNEL_NAME) topic=$TOPIC_SLUG production=$PRODUCTION_ID"
      - name: Verify Liam Johnston motion-graphics skills
        run: |
          for SKILL in motion-graphics cinematic-camera terminal-inserts article-highlights; do
            if [ ! -f ".agents/skills/$SKILL/SKILL.md" ]; then
              echo "::error::Liam Johnston skill not found: $SKILL"
              exit 1
            fi
          done
          echo "[skills] Liam Johnston skills verified"

  generate-narration:
    name: Generate Voiceover (Gemini TTS preferred, edge-tts fallback)
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      TTS_GEMINI_TAKES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install
      - name: Install Python TTS deps
        run: |
          pip3 install edge-tts --quiet 2>/dev/null || pip install edge-tts --quiet
          pip3 install faster-whisper --quiet 2>/dev/null || pip install faster-whisper --quiet
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg bc
          fi
          ffmpeg -version | head -1
      - name: Generate TTS (Gemini first, edge-tts fallback)
        id: tts
        run: |
          echo "[tts] Generating narration for ${{ needs.setup.outputs.channel }} / ${{ needs.setup.outputs.topic_slug }}"
          mkdir -p data/tts/${{ needs.setup.outputs.channel }}
          set +e
          node src/utils/tts.js ${{ needs.setup.outputs.channel }} ${{ needs.setup.outputs.script_path }} 2>&1
          TTS_EXIT_CODE=$?
          set -e
          if [ $TTS_EXIT_CODE -ne 0 ]; then
            echo "::error::TTS generation failed with exit code $TTS_EXIT_CODE"
            echo "tts_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "tts_success=true" >> $GITHUB_OUTPUT
      - name: Verify TTS Audio
        id: verify-tts
        run: |
          EXPECTED_AUDIO="data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.tts_topic }}-vo.mp3"
          if [ ! -f "$EXPECTED_AUDIO" ]; then
            echo "::error::TTS audio not generated at $EXPECTED_AUDIO"
            exit 1
          fi
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$EXPECTED_AUDIO")
          echo "[tts] TTS audio verified: $DURATION seconds"
          if [ "$(echo "$DURATION < 5" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "::error::TTS audio too short ($DURATION s)"
            exit 1
          fi
          echo "tts_duration=$DURATION" >> $GITHUB_OUTPUT
          cp "$EXPECTED_AUDIO" "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.mp3"
          cp "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.tts_topic }}-vo.srt" "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.srt" 2>/dev/null || true
          cp "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.tts_topic }}-vo-words.json" "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo-words.json" 2>/dev/null || true
      - name: Narration Quality Gate (diagnostic)
        id: narration-judge
        run: |
          AUDIO="data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.mp3"
          SRT="data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.srt"
          if [ ! -f "$AUDIO" ] || [ ! -f "$SRT" ]; then
            echo "narration_judge_status=unavailable" >> $GITHUB_OUTPUT
            echo "::warning::Narration judge inputs missing; proceeding with floor check only"
            exit 0
          fi
          set +e
          node scripts/narration-judge.mjs --audio "$AUDIO" --srt "$SRT" --out "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-narration-judge.json" 2>&1
          JUDGE_EXIT=$?
          set -e
          if [ $JUDGE_EXIT -eq 3 ]; then
            echo "narration_judge_status=unavailable" >> $GITHUB_OUTPUT
            echo "::warning::Narration judge unavailable; floor check only"
          elif [ $JUDGE_EXIT -ne 0 ]; then
            echo "narration_judge_status=flagged" >> $GITHUB_OUTPUT
            echo "::warning::Narration judge flagged narration (diagnostic only; not a hard block)"
          else
            echo "narration_judge_status=pass" >> $GITHUB_OUTPUT
            echo "[judge] Narration quality gate PASSED"
          fi
      - name: Upload TTS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-${{ needs.setup.outputs.channel }}
          path: |
            data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.mp3
            data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.srt
            data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo-words.json
          retention-days: 30
          overwrite: true

  build-timeline:
    name: Build Visual Timeline
    needs: [setup, generate-narration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund 2>/dev/null || npm install)
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Download TTS and visual assets
        uses: actions/download-artifact@v4
        with: { name: tts-audio-${{ needs.setup.outputs.channel }}, path: data/tts/${{ needs.setup.outputs.channel }} }
      - name: Build timeline from the topic-specific script
        run: |
          node scripts/editor/build-mcp-timeline.mjs \
            --channel "${{ needs.setup.outputs.channel }}" \
            --script "${{ needs.setup.outputs.script_path }}" \
            --topic "${{ needs.setup.outputs.topic_slug }}" \
            --production-id "${{ needs.setup.outputs.production_id }}" \
            --audio "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.mp3" \
            --words "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo-words.json" \
            --out-dir "data/editor/auto/${{ needs.setup.outputs.topic_slug }}"
      - name: Validate timeline duration <= 30s
        run: |
          TL="data/editor/auto/${{ needs.setup.outputs.topic_slug }}/timeline.json"
          DUR=$(node -e "const t=require('fs').readFileSync('$TL','utf8'); const j=JSON.parse(t); console.log((j.durationInFrames/j.fps).toFixed(3))")
          echo "[timeline] timeline duration: $DUR s"
          if [ "$(echo "$DUR > 30" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "::error::Timeline duration $DUR s exceeds 30 s"
            exit 1
          fi
      - name: Upload timeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timeline-${{ needs.setup.outputs.channel }}
          path: data/editor/auto/${{ needs.setup.outputs.topic_slug }}/
          retention-days: 30
          overwrite: true

  render-video:
    name: Render Video (Remotion)
    needs: [setup, build-timeline, generate-narration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REMOTION_CHROME_PATH: /usr/bin/google-chrome
      EDITOR_ENGINE: "1"
      EDITOR_STRICT: "1"
      RENDER_CONCURRENCY: "2"
      RENDER_CRF: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund 2>/dev/null || npm install
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund 2>/dev/null || npm install)
      - name: Install System Tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python-is-python3; fi
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with: { chrome-version: stable }
      - name: Download TTS, timeline and visual assets
        uses: actions/download-artifact@v4
        with: { name: tts-audio-${{ needs.setup.outputs.channel }}, path: data/tts/${{ needs.setup.outputs.channel }} }
      - name: Render video
        run: |
          TL="data/editor/auto/${{ needs.setup.outputs.topic_slug }}/timeline.json"
          AUDIO="data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.mp3"
          OUT="data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4"
          mkdir -p "$(dirname "$OUT")"
          node --input-type=module -e "
            import { renderEditor } from './src/skills/remotion-render/render-editor.js';
            renderEditor({ timelinePath: '\$TL', audioPath: '\$AUDIO', outputPath: '\$OUT', scale: 1 })
              .then(() => console.log('[render] done'))
              .catch(e => { console.error('[render] failed:', e.message); process.exit(1); });
          "
      - name: Verify and enforce duration on rendered MP4
        id: check-duration
        run: |
          VID="data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VID")
          echo "[render] final MP4 duration: $DUR s"
          echo "render_duration=$DUR" >> $GITHUB_OUTPUT
          if [ "$(echo "$DUR > 30" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "::error::Rendered MP4 $DUR s exceeds the 30 s Short limit"
            exit 1
          fi
      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ needs.setup.outputs.channel }}
          path: data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4
          retention-days: 30
          overwrite: true

  run-quality-assurance:
    name: Technical Quality Assurance
    needs: [render-video, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq; fi
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with: { name: rendered-video-${{ needs.setup.outputs.channel }}, path: data/renders/${{ needs.setup.outputs.channel }} }
      - name: Download timeline
        uses: actions/download-artifact@v4
        with: { name: timeline-${{ needs.setup.outputs.channel }}, path: data/editor/auto/${{ needs.setup.outputs.topic_slug }} }
      - name: Run final-MP4 QA and contact sheet
        run: |
          VID="data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4"
          TL="data/editor/auto/${{ needs.setup.outputs.topic_slug }}/timeline.json"
          node scripts/editor/video-qa.js \
            --video "$VID" --timeline "$TL" \
            --out "data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-qa.json" \
            --contact "data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-contact.jpg" \
            --frames "data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-frames"
      - name: Enforce duration <= 30s on final MP4
        run: |
          VID="data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VID")
          echo "[qa] final MP4 duration: $DUR s"
          if [ "$(echo "$DUR > 30" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "::error::QA: MP4 $DUR s exceeds 30 s — blocking upload"
            exit 1
          fi
      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-and-contact-${{ needs.setup.outputs.channel }}
          path: |
            data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-qa.json
            data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-contact.jpg
          retention-days: 30
          overwrite: true

  final-acceptance:
    name: Independent Final Acceptance Gate
    needs: [run-quality-assurance, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      accepted: ${{ steps.accept.outputs.accepted }}
      mp4_sha256: ${{ steps.accept.outputs.mp4_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund 2>/dev/null || npm install
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq; fi
      - name: Download all acceptance inputs
        uses: actions/download-artifact@v4
        with: { name: rendered-video-${{ needs.setup.outputs.channel }}, path: data/renders/${{ needs.setup.outputs.channel }} }
      - name: Run independent acceptance gate
        id: accept
        run: |
          node scripts/acceptance/final-acceptance.mjs \
            --channel "${{ needs.setup.outputs.channel }}" \
            --channel-id-field "${{ needs.setup.outputs.channel_id_field }}" \
            --topic "${{ needs.setup.outputs.topic_slug }}" \
            --topic-slug "${{ needs.setup.outputs.topic_slug }}" \
            --production-id "${{ needs.setup.outputs.production_id }}" \
            --script-path "${{ needs.setup.outputs.script_path }}" \
            --script-hash "$(node -e "const c=require('crypto');console.log(c.createHash('sha256').update(require('fs').readFileSync('${{ needs.setup.outputs.script_path }}','utf8')).digest('hex'))")" \
            --narration-hash "$(node -e "const c=require('crypto');console.log(c.createHash('sha256').update(require('fs').readFileSync('data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.mp3')).digest('hex'))")" \
            --video "data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4" \
            --timeline "data/editor/auto/${{ needs.setup.outputs.topic_slug }}/timeline.json" \
            --visual-manifest "data/editor/assets/${{ needs.setup.outputs.channel }}/asset-manifest.json" \
            --out "data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-acceptance.json"
      - name: Block upload if acceptance failed
        if: steps.accept.outputs.accepted != 'true'
        run: |
          echo "::error::Independent acceptance gate FAILED — upload blocked"
          cat data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-acceptance.json 2>/dev/null || true
          exit 1

  publish-preparation:
    name: Prepare for Review
    needs: [final-acceptance, render-video, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.final-acceptance.outputs.accepted == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Collect accepted artifacts
        run: |
          mkdir -p .cache/review-artifacts
          VID="data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4"
          cp "$VID" .cache/review-artifacts/final.mp4
          cp "data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-contact.jpg" .cache/review-artifacts/ 2>/dev/null || true
          cp "data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-qa.json" .cache/review-artifacts/ 2>/dev/null || true
          cp "data/tts/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-vo.mp3" .cache/review-artifacts/ 2>/dev/null || true
          cp -r "data/editor/auto/${{ needs.setup.outputs.topic_slug }}" .cache/review-artifacts/timeline 2>/dev/null || true
          cp -r "data/editor/assets/${{ needs.setup.outputs.channel }}" .cache/review-artifacts/assets 2>/dev/null || true
          echo "=== Accepted review package ==="
          ls -laR .cache/review-artifacts/
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: review-package-${{ needs.setup.outputs.channel }}-${{ github.run_number }}
          path: .cache/review-artifacts/
          retention-days: 30
          overwrite: true

  publish-private:
    name: Upload to YouTube (Private)
    needs: [publish-preparation, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && needs.publish-preparation.result == 'success'
    env:
      CH02_CLIENT_ID: ${{ secrets.CHANNEL_02_CLIENT_ID }}
      CH02_CLIENT_SECRET: ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
      CH02_REFRESH_TOKEN: ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download accepted MP4
        uses: actions/download-artifact@v4
        with: { name: rendered-video-${{ needs.setup.outputs.channel }}, path: data/renders/${{ needs.setup.outputs.channel }} }
      - name: Materialize OAuth credentials
        env: { CHANNEL_ID_NUM: ${{ needs.setup.outputs.channel }} }
        run: |
          node -e "
            const fs = require('fs');
            const { resolveChannel } = require('./scripts/lib/channel-lookup.cjs');
            const id = process.env.CHANNEL_ID_NUM;
            const ch = resolveChannel(id);
            const publishSet = JSON.parse(fs.readFileSync('config/priority-channels.json','utf8')).channels.map(String);
            if (!publishSet.includes(id)) { console.log('::notice::channel ' + id + ' not in priority list — upload skipped'); process.exit(0); }
            const own = 'config/creds/' + ch.channel_id + '.json';
            const declared = ch.youtube_credentials_path || own;
            if (declared !== own) { console.error('::error::channel ' + id + ' declares ' + declared + ', not ' + own); process.exit(1); }
            const n = String(ch.channel_id).replace(/^ch-0*/,'').padStart(2,'0');
            const clientId = process.env['CH' + n + '_CLIENT_ID'];
            const clientSecret = process.env['CH' + n + '_CLIENT_SECRET'];
            const refreshToken = process.env['CH' + n + '_REFRESH_TOKEN'];
            if (!(clientId && clientSecret && refreshToken)) { console.log('::warning::No credentials for ' + ch.channel_id + ' — upload skipped'); process.exit(0); }
            fs.mkdirSync('config/creds', { recursive: true });
            fs.writeFileSync(own, JSON.stringify({client_id:clientId, client_secret:clientSecret, refresh_token:refreshToken}, null, 2));
            console.log('Credentials materialized for ' + ch.channel_id);
          "
      - name: Verify accepted MP4 before upload
        id: pre-upload-check
        run: |
          MP4="data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4"
          if [ ! -f "$MP4" ]; then echo "::error::No accepted MP4 to upload"; exit 1; fi
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$MP4")
          echo "[pre-upload] MP4 duration: $DUR s"
          if [ "$(echo "$DUR > 30" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "::error::Pre-upload: MP4 $DUR s exceeds 30 s — blocking upload"
            exit 1
          fi
          echo "pre_upload_ok=true" >> $GITHUB_OUTPUT
      - name: Upload to YouTube (Private)
        if: steps.pre-upload-check.outputs.pre_upload_ok == 'true'
        run: |
          MP4="data/renders/${{ needs.setup.outputs.channel }}/${{ needs.setup.outputs.stem }}-final.mp4"
          TITLE=$(node -e "const t=require('./data/editor/auto/${{ needs.setup.outputs.topic_slug }}/plan.json'); console.log(t.title||'${{ needs.setup.outputs.stem }}')")
          node scripts/youtube-upload.cjs --file "$MP4" --title "$TITLE" --channel ${{ needs.setup.outputs.channel }}
          echo "✓ Private upload complete for ${{ needs.setup.outputs.channel }}"
      - name: Record Upload Result
        if: always()
        run: |
          echo "## Private Upload Status" >> $GITHUB_STEP_SUMMARY
          echo "- Channel: ${{ needs.setup.outputs.channel }}" >> $GITHUB_STEP_SUMMARY
          echo "- Video: ${{ needs.setup.outputs.stem }}-final.mp4" >> $GITHUB_STEP_SUMMARY
          echo "- Visibility: private (owner publishes manually)" >> $GITHUB_STEP_SUMMARY
          echo "- Accepted MP4 SHA-256: ${{ needs.final-acceptance.outputs.mp4_sha256 }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
