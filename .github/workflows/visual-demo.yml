name: Visual Demo

# Demonstration renders for the white-background and variety work. No YouTube credentials, no
# state branch and no upload step exist here, and its concurrency group is separate from autopilot.
on:
  push:
    branches:
      - demo/visual

concurrency:
  group: visual-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ["1", "2", "reel"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install production tools
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          (cd src/skills/remotion-render && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund))
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg bc jq
          pip3 install --quiet edge-tts faster-whisper
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Render and inspect
        timeout-minutes: 45
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          REMOTION_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          EDITOR_ENGINE: "1"
          RENDER_CONCURRENCY: "2"
          RENDER_CRF: "18"
        run: node scripts/autopilot/visual-demo.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-demo-${{ matrix.target }}
          retention-days: 30
          path: output/visual-demo/
