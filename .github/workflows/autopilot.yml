# AUTOPILOT (owner, 20 Nov 2026): runs without anyone. Shorts twice a day, a long form every 2 days. Each run takes the next topic from
# data/autopilot/<mode>-queue.json, writes the script ONLY from fetched Wikipedia text, sources + vision-checks a picture for every named thing, renders on GitHub,
# runs the picture-versus-words gate, and uploads PRIVATE (ship-short.yml / the ship job of pilot-render.yml). Nothing goes public from here.
# A failed run changes nothing but its own artifacts: the topic is only marked done after generation succeeds, and the next scheduled run simply takes the next topic.
name: Autopilot
on:
  schedule:
    - cron: "17 6,18 * * *"     # Shorts: 06:17 and 18:17 UTC
    - cron: "43 7 */2 * *"      # long form: every second day
  workflow_dispatch:
    inputs:
      mode: { description: "short or long", required: true, default: short }
permissions:
  contents: write
  actions: write
concurrency:
  group: autopilot-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Decide the mode
        id: mode
        run: |
          M="${{ inputs.mode }}"; [ -z "$M" ] && { [ "${{ github.event.schedule }}" = "43 7 */2 * *" ] && M=long || M=short; }
          echo "mode=$M" >> "$GITHUB_OUTPUT"
      - name: Write the script, source the pictures, build the spec
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          node platform/autopilot/make.mjs "${{ steps.mode.outputs.mode }}" | tee gen.log
          echo "slug=$(grep '^SLUG=' gen.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Commit the build to its own branch, mark the topic done on main, start the render
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name autopilot; git config user.email autopilot@users.noreply.github.com
          SLUG="${{ steps.gen.outputs.slug }}"; MODE="${{ steps.mode.outputs.mode }}"
          [ -n "$SLUG" ] || { echo "no slug: generation failed"; exit 1; }
          ID="${SLUG#ai-tested-}"; ID="${ID#hidden-past-}"
          BR=$([ "$MODE" = short ] && echo "sx/auto-$ID" || echo "auto/$SLUG")
          git checkout -b "$BR"; git add -A; git commit -qm "autopilot $MODE: $SLUG" ; git push -f origin "$BR"
          git checkout -q main; git checkout "$BR" -- data/autopilot/done.json; git add data/autopilot/done.json
          git commit -qm "autopilot: $SLUG generated (topic marked done)" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break || sleep 5; done
          [ "$MODE" = long ] && gh workflow run "Pilot render" --ref "$BR" -f episode="$SLUG" || true
      # FAST Short (owner, 20 Nov 2026: "doesn't need to be rendered"): ffmpeg + edge-tts in ~1 min instead of the 35-min Remotion render.
      - name: Picture-versus-words gate
        if: steps.mode.outputs.mode == 'short'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: node platform/shorts-sx/check-visuals.mjs "${{ steps.gen.outputs.slug }}"
      - name: Fast build
        if: steps.mode.outputs.mode == 'short'
        run: |
          sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null; pip install -q edge-tts pillow
          D=data/uploads/${{ steps.gen.outputs.slug }}; python platform/fast/fast-short.py "${{ steps.gen.outputs.slug }}" "$D/episode.mp4"
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode == 'short'
        with: { name: "short-${{ steps.gen.outputs.slug }}", path: "data/uploads/${{ steps.gen.outputs.slug }}/episode.mp4" }
      - name: Upload private
        if: steps.mode.outputs.mode == 'short'
        env:
          CH01_ID: ${{ secrets.CHANNEL_01_CLIENT_ID }}
          CH01_SECRET: ${{ secrets.CHANNEL_01_CLIENT_SECRET }}
          CH01_TOKEN: ${{ secrets.CHANNEL_01_REFRESH_TOKEN }}
          CH02_ID: ${{ secrets.CHANNEL_02_CLIENT_ID }}
          CH02_SECRET: ${{ secrets.CHANNEL_02_CLIENT_SECRET }}
          CH02_TOKEN: ${{ secrets.CHANNEL_02_REFRESH_TOKEN }}
          CH04_ID: ${{ secrets.CHANNEL_04_CLIENT_ID }}
          CH04_SECRET: ${{ secrets.CHANNEL_04_CLIENT_SECRET }}
          CH04_TOKEN: ${{ secrets.CHANNEL_04_REFRESH_TOKEN }}
        run: |
          P=data/uploads/short-plan.json; D=data/uploads/$(jq -r .dir $P); S=$(jq -r .slot $P)
          v=CH${S}_ID; export CH_CLIENT_ID=${!v}; v=CH${S}_SECRET; export CH_CLIENT_SECRET=${!v}; v=CH${S}_TOKEN; export CH_REFRESH_TOKEN=${!v}
          node scripts/clone/upload-longform.mjs "$D" "$S" "$(jq -r .expect_channel $P)" "$(jq -r .category $P)"
          cat "$D/upload-record.json"
