name: visual-director-proof

# Proof, on GitHub runners only, of the visual director loop (docs/VISUAL-DIRECTOR.md):
# direct -> gate -> materials -> render -> frames -> critic -> rebuild REBUILD/DELETE scenes -> critic again.
# Read-only: nothing is published, pushed or uploaded to YouTube (no OAuth secrets here).
# Evidence = this run's artifact visual-director-<run_id> (direction/materials/critic per round, MP4s,
# frames, contact sheets, comparison.md) and the step summary (every scene's verdict per round).
on:
  push:
    branches: [feat/vd-loop, feat/visual-director]
  workflow_dispatch:
    inputs:
      script:
        description: "One committed *-shorts-script.json to run (research = same stem without -shorts-script). Empty = the two proof scripts."
        default: ""

permissions:
  contents: read

concurrency:
  group: visual-director-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)
      - name: Visual-director unit tests (every vd-* test present on this ref)
        run: node --test scripts/__tests__/vd-*.test.js

  matrix:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        env:
          ONE: ${{ inputs.script }}
        run: |
          if [ -n "$ONE" ]; then
            R="${ONE%-shorts-script.json}.json"
            echo "list=[{\"script\":\"$ONE\",\"research\":\"$R\"}]" >> "$GITHUB_OUTPUT"
          else
            echo 'list=[{"script":"data/research/4/great-fire-of-london-shorts-script.json","research":"data/research/4/great-fire-of-london.json"},{"script":"data/research/1/aberfan-marks-60-years-since-coal-tip-collapse-shorts-script.json","research":"data/research/1/aberfan-marks-60-years-since-coal-tip-collapse.json"}]' >> "$GITHUB_OUTPUT"
          fi

  loop:
    needs: [tests, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJson(needs.matrix.outputs.list) }}
    env:
      SCRIPT: ${{ matrix.item.script }}
      RESEARCH: ${{ matrix.item.research }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/skills/remotion-render/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies (cache miss only)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd src/skills/remotion-render && npm ci --no-audit --no-fund)
      - name: Ensure ffmpeg/ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install edge-tts + rembg
        run: |
          pip install --quiet edge-tts "rembg[cpu]" pillow numpy
          python -c "from rembg import new_session; new_session('u2net'); print('u2net ready')"
      - name: Voiceover (edge-tts, word timings)
        env:
          TTS_PROVIDER: edge
        run: |
          CH=$(basename "$(dirname "$SCRIPT")")
          STEM=$(basename "$SCRIPT" .json)
          echo "CH=$CH" >> "$GITHUB_ENV"
          echo "STEM=$STEM" >> "$GITHUB_ENV"
          node src/utils/tts.js "$CH" "$SCRIPT"
          ls -la "data/tts/$CH" | head
      - name: Visual director loop
        id: loop
        env:
          VD_MAX_ROUNDS: "2"
          VD_MAX_MS: "2700000"
          VD_CRITIC_MODEL: gemini-3.8-flash
          REMOTION_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          RENDER_PROGRESS_MS: 15000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VISION_API_KEY: ${{ secrets.GEMINI_API_KEY_4 || secrets.GEMINI_API_KEY }}
          VISION_MODEL: gemini-3.5-flash-lite
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEXT_MODEL: openai/gpt-oss-120b
          GROQ_VISION_MODEL: qwen/qwen3.8-27b
          GROQ_MAX_IMAGES: "3"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set +e
          mkdir -p "out/vd/$STEM"
          node scripts/visual-director/loop.mjs --script "$SCRIPT" --research "$RESEARCH" --tts "data/tts/$CH" --channel "$CH" --out "out/vd/$STEM"
          echo "loop exit $?" | tee "out/vd/$STEM/loop-exit.txt"
          ls -R "out/vd/$STEM" | head -80
      - name: Step summary (every scene's verdict per round)
        if: always()
        run: |
          D="out/vd/$STEM"
          {
            echo "## $SCRIPT"
            cat "$D/loop-exit.txt" 2>/dev/null || echo "loop did not finish"
            echo
            if [ -f "$D/comparison.md" ]; then sed 's/^# /### /' "$D/comparison.md"; else echo "_no comparison.md_"; fi
            for r in "$D"/round-*; do
              [ -f "$r/steps.log" ] || continue
              echo "<details><summary>$(basename "$r") step exits</summary>"; echo; echo '```'; grep -E '^\$ |^exit ' "$r/steps.log" | cut -c1-220; echo '```'; echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vd-part-${{ github.run_id }}-${{ env.CH }}-${{ strategy.job-index }}
          path: |
            out/vd
            data/tts/${{ env.CH }}
          if-no-files-found: warn
          retention-days: 14

  artifact:
    needs: loop
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Merge parts into visual-director-<run>
        uses: actions/upload-artifact/merge@v4
        with:
          name: visual-director-${{ github.run_id }}
          pattern: vd-part-${{ github.run_id }}-*
          separate-directories: true
          delete-merged: true
          retention-days: 14
