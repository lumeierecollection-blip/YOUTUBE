  <text x="90" y="980" fill="#B8C4D6" font-family="Arial, sans-serif" font-size="42" >countries</text>
  <text x="90" y="1120" fill="#8FA0B8" font-family="Arial, sans-serif" font-size="24" >Source: Fortune, JLL Global State of Facilities Management Report</text>
