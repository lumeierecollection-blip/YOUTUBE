  <line x1="90" y1="230" x2="990" y2="230" stroke="#D4A574" stroke-opacity="0.5" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#F5EFE6">
    <rect x="90" y="470" width="900" height="200" fill="#2D1A12" stroke="#D4A574" stroke-opacity="0.5" stroke-width="2"/>
    <text x="130" y="545" fill="#D4A574" font-size="26" letter-spacing="4" font-weight="700">WHO MI5 DEFENDED</text>
