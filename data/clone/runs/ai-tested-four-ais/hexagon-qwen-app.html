<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbitals — spinning hexagon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05060a; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; display: block; } /* canvas paints own bg -> trail effect */

  .ui { position: fixed; inset: 0; padding: clamp(18px, 4vw, 44px);
        pointer-events: none; z-index: 10; display: flex; flex-direction: column;
        justify-content: space-between; color: #eaeef7;
        opacity: 0; animation: fadeIn 1.4s ease .25s forwards; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

  .accent { position: absolute; left: 0; top: 4px; width: 3px; height: 30px;
            background: #38bdf8; border-radius: 2px;
            box-shadow: 0 0 18px rgba(56,189,248,.8); }
  .kicker { display: block; font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
            color: #5fd0ff; font-weight: 600; margin-bottom: 9px; }
  .title { position: relative; padding-left: 16px; font-size: clamp(34px, 6.5vw, 78px);
           font-weight: 800; line-height: .92; letter-spacing: -.02em;
           text-shadow: 0 4px 44px rgba(0,0,0,.7); }
  .title span { color: #38bdf8; font-weight: 700; }

  .meta { text-align: right; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
          color: #79859a; line-height: 2.1; }
  .meta b { color: #c9d3e4; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: #34d399; margin-right: 8px; vertical-align: middle;
         box-shadow: 0 0 10px rgba(52,211,153,.9); animation: pulse 1.7s ease-in-out infinite; }

  .legend { display: flex; flex-direction: column; gap: 11px; }
  .row { display: flex; align-items: center; gap: 12px; font-size: 12.5px;
         letter-spacing: .02em; color: #b7c0d2; }
  .k { min-width: 118px; padding: 3px 11px; text-align: center; border-radius: 999px;
       background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
       color: #e6ecf6; font-weight: 600; font-size: 11px; letter-spacing: .12em;
       text-transform: uppercase; }
  .v { color: #8a94a8; font-size: 11.5px; letter-spacing: .04em; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="ui">
    <div class="top">
      <div class="brand">
        <span class="accent"></span>
        <span class="kicker">canvas · realtime physics</span>
        <h1 class="title">Orbitals<span>.</span></h1>
      </div>
      <div class="meta">
        <span><span class="dot"></span>live simulation</span>
        <span>10 bodies · 1 arena · <b>1</b> engine</span>
      </div>
    </div>

    <div class="legend">
      <div class="row"><span class="k">gravity</span><span class="v">900&nbsp;px/s²</span></div>
      <div class="row"><span class="k">bounce</span><span class="v">restitution&nbsp;0.83</span></div>
      <div class="row"><span class="k">contact</span><span class="v">rolling&nbsp;×&nbsp;0.90</span></div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---- constants ------------------------------------------------------
  const SIZE      = 6;              // hexagon sides
  const TURN_RATE = 0.16;           // rad/s -> a gentle spin
  const GRAVITY   = 900;            // px/s^2
  const WALL_REST = 0.83;           // bounciness off walls
  const WALL_FRICTION = 0.90;       // tangential velocity kept on wall contact
  const BALL_REST   = 0.86;         // bounciness ball<->ball
  const MAX_SPEED   = 2200;

  // ---- canvas ---------------------------------------------------------
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  let W, H, R, cx, cy, dpr, dprCap = 2;
  let walls = [];

  function buildWalls() {
    walls = [];
    for (let i = 0; i < SIZE; i++) {
      const a1 = (i / SIZE) * Math.PI * 2;
      const a2 = ((i + 1) / SIZE) * Math.PI * 2;
      walls.push(
        { v1: [cx + R * Math.cos(a1), cy + R * Math.sin(a1)],
          v2: [cx + R * Math.cos(a2), cy + R * Math.sin(a2)],
          nx: Math.cos(a1 + Math.PI / SIZE), ny: Math.sin(a1 + Math.PI / SIZE) }
      );
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, dprCap);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.40;
    buildWalls();
  }
  window.addEventListener("resize", resize);

    { c:"#43E6E0" }, { c:"#57CFFF" }, { c:"#A97CFF" }, { c:"#FF6ECE" },
    { c:"#FF7A7A" }, { c:"#8ab4ff" }
  ];
