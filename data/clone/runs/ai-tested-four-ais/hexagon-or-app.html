<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balls in a Spinning Hexagon</title>
<style>
  html,body{margin:0;height:100%;background:#0d1020;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, CX, CY, R;
  function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    CX = W / 2; CY = H / 2;
    R = Math.min(W, H) * 0.40;
  }
  addEventListener('resize', resize);
  resize();

  const COLORS = ['#ff5252','#ffb142','#f9ca24','#7bed9f','#2ed573',
                  '#70a1ff','#a29bfe','#e056fd','#ff6b81','#48dbfb'];
  const balls = [];
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    balls.push({
      x: CX + Math.cos(a) * R * 0.3,
      y: CY + Math.sin(a) * R * 0.3,
      vx: (Math.random() - .5) * 200,
      vy: (Math.random() - .5) * 200,
      r: 14 + Math.random() * 8,
      color: COLORS[i]
    });
  }

  const GRAV = 700, OMEGA = 0.35, WALL_REST = 0.78,
        BALL_REST = 0.94, WALL_FRIC = 0.3, DRAG = 0.12;
  let angle = 0;

  function hexVerts(a) {
    const v = [];
    for (let k = 0; k < 6; k++) {
      const t = a + k * Math.PI / 3;
      v.push([CX + Math.cos(t) * R, CY + Math.sin(t) * R]);
    }
    return v;
  }

  function physics(dt) {
    angle += OMEGA * dt;
    const verts = hexVerts(angle);
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const b of balls) {                 // gravity + air drag
        b.vy += GRAV * h;
        const drag = Math.exp(-DRAG * h);
        b.vx *= drag; b.vy *= drag;
        const sp = Math.hypot(b.vx, b.vy), max = 1600;
        if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; }
        b.x += b.vx * h; b.y += b.vy * h;
      }
      for (let i = 0; i < balls.length; i++)   // ball-ball collisions
        for (let j = i + 1; j < balls.length; j++) {
          const a = balls[i], b = balls[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const min = a.r + b.r
