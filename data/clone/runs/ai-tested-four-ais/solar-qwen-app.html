<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #c { display: block; }

  .panel {
    position: fixed; top: 22px; left: 26px; z-index: 2;
    pointer-events: none;
    padding: 18px 26px 15px;
    border-left: 2px solid rgba(255,180,80,.65);
    background: radial-gradient(circle at 0 0, rgba(20,30,55,.55), transparent 70%);
  }
  .kicker {
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #7fb2ff; margin-bottom: 7px;
    animation: flicker 5s ease-in-out infinite;
  }
  .title {
    font-size: clamp(30px, 4.6vw, 56px); font-weight: 800; line-height: .92;
    color: #f4f8ff; letter-spacing: -.5px;
    text-shadow: 0 0 26px rgba(90,140,255,.45);
  }
  .accent { color: #ffce6a; }
  .rule {
    width: 60px; height: 2px; margin: 12px 0 8px;
    background: linear-gradient(90deg, #ffb84d, transparent);
  }
  .sub {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(200,215,240,.55);
  }
  .credit {
    position: fixed; bottom: 18px; left: 0; right: 0; z-index: 2;
    text-align: center; font-size: 10px; letter-spacing: 2px;
    color: rgba(150,175,210,.4); text-transform: uppercase;
    animation: pulse 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes flicker { 0%,100%{opacity:1} 52%{opacity:.55} 60%{opacity:.95} }
  @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:.85} }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="panel">
    <div class="kicker">Live Simulation</div>
    <div class="title">The Solar<br><span class="accent">System</span></div>
    <div class="rule"></div>
    <div class="sub">Sun &amp; eight planets</div>
  </div>
  <div class="credit">Relative sizes &amp; periods &middot; distances for clarity</div>

<script>
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cx, cy, scale;
const SUN_SCREEN_R = 16;
const BASE_R = 90;               // radius reference for other screen metrics
const PLANET_R_SCALE = 0.06;
const BG_DOWNSAMPLE = 0.6;

let stars = [];
const T0 = performance.now();

const PLANETS = [
  { name:'Mercury', color:'#aaa7a2', glow:'rgba(190,185,180,.5)', r:4,  dist:1.0,   period:88,    seed:0.4 },
  { name:'Venus',   color:'#e6c389', glow:'rgba(230,195,137,.6)',r:7,  dist:1.55,  period:225,   seed:2.1 },
  { name:'Earth',   color:'#5b8fdc', glow:'rgba(91,143,220,.6)',r:7.2,dist:2.12,  period:365,   seed:3.9,
    moons:[{ r:2, dist:14, period:30, color:'#c4c4c0', off:1.0 }] },
  { name:'Mars',    color:'#d1683d', glow:'rgba(209,104,61,.6)',r:5.8,dist:2.7,   period:687,   seed:5.5 },
  { name:'Jupiter', color:'#d3a276', glow:'rgba(211,162,118,.55)',r:17,dist:3.9,   period:4333,  seed:1.3, bands:true },
  { name:'Saturn',  color:'#e6cf9e', glow:'rgba(230,207,158,.55)',r:14,dist:5.1,   period:10759, seed:4.6, rings:true },
  { name:'Uranus',  color:'#9fe0e6', glow:'rgba(159,224,230,.5)',r:9,  dist:6.3,   period:30687, seed:2.8, tilt:Math.PI*0.9 },
  { name:'Neptune', color:'#4f79d8', glow:'rgba(79,121,216,.6)',r:8.6,dist:7.5,   period:60190, seed:0.9 }
];
const MAXD = Math.max(...PLANETS.map(p => p.dist));

function resize(){
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx = W/2; cy = H/2;
  const M = Math.max(72, Math.min(W,H)*0.15);
  scale = Math.max(0.1, (Math.min(W,H)/2 - M) / BASE_R);
  buildStars();
}

function buildStars(){
  stars = [];
  const n = Math.round(W*H/6500);
  const hues = ['255,255,255','255,255,255','255,255,255','255,255,255','200,220,255','185,205,255','255,225,190','255,210,175'];
  for (let i=0;i<n;i++){
    const m = Math.random();
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: m<0.7 ? 0.4+Math.random()*0.5 : 0.5+Math.random()*1.1,
      base: 0.25+Math.random()*0.55,
      tw: 0.6+Math.random()*2.6,
      ph: Math.random()*TAU,
      c: hues[(Math.random()*hues.length)|0]
    });
  }
}

/* ---------- draw helpers ---------- */
function ring(gtx, screenR, C){
  gtx.lineWidth = 1;
  gtx.strokeStyle = 'rgba(210,222,240,.11)';
  for (const dr of [2.15, 3.15, MAXD]){ gtx.beginPath(); gtx.arc(0,0,dr*scale,0,TAU); gtx.stroke(); }
  gtx.fillStyle = 'rgba(150,175,215,.38)'; gtx.font = '9px ui-monospace,monospace'; gtx.textAlign='center'; gtx.textBaseline='middle';
  for (const dr of [2.15, 3.15, MAXD]) gtx.fillText(dr.toFixed(1)+' AU', 0, -dr*scale);
  if (C){ gtx.fillStyle='rgba(120,150,200,.32)'; gtx.fillText('0 pc', 0, Scale2px.cy); }
}

function sunScene(gtx, p){
  const pulse = (p*1.5 + 0.3) * SUN_SCREEN_R * 1.35;
  const halo = gtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, SUN_SCREEN_R*40);
  halo.addColorStop(0, 'rgba(255,175,60,.5)');
  halo.addColorStop(0.2,'rgba(255,130,40,.2)');
  halo.addColorStop(0.6,'rgba(255,90,20,.05)');
  halo.addColorStop(1,'rgba(255,80,10,0)');
  gtx.fillStyle = halo; gtx.beginPath(); gtx.arc(p.x,p.y,SUN_SCREEN_R*40,0,TAU); gtx.fill();

  gtx.save(); gtx.translate(p.x,p.y); gtx.rotate(p*0.12);
  for (let i=0;i<6;i++){
    const a=i/6*TAU, l0=SUN_SCREEN_R*2.3, l=SUN_SCREEN_R*(4.2+Math.sin(p*1.7+i*1.3)*2.3);
    const g=gtx.createLinearGradient(Math.cos(a)*l0,Math.sin(a)*l0,Math.cos(a)*l,Math.sin(a)*l);
    g.addColorStop(0,'rgba(255,190,90,.45)'); g.addColorStop(1,'rgba(255,150,40,0)');
    gtx.strokeStyle=g; gtx.lineWidth=SUN_SCREEN_R*0.3; gtx.lineCap='round';
    gtx.beginPath(); gtx.moveTo(Math.cos(a)*l0,Math.sin(a)*l0); gtx.lineTo(Math.cos(a)*l,Math.sin(a)*l); gtx.stroke();
  }
  gtx.restore();

  const core = gtx.createRadialGradient(p.x,p.y,0,p.x,p.y,SUN_SCREEN_R*1.1);
  core.addColorStop(0,'#fff8e0'); core.addColorStop(.4,'#ffe49b');
  core.addColorStop(.75,'#ffab3d'); core.addColorStop(1,'#ff7f1f');
  gtx.fillStyle = core; gtx.beginPath(); gtx.arc(p.x,p.y,SUN_SCREEN_R,0,TAU); gtx.fill();

  gtx.save(); gtx.shadowColor='rgba(255,190,80,.9)'; gtx.shadowBlur=12;
  gtx.fillStyle='#fff'; gtx.font='600 11px "Segoe UI",sans-serif'; gtx.textAlign='center'; gtx.textBaseline='middle';
  gtx.fillText('SUN', p.x, p.y+SUN_SCREEN_R+13); gtx.restore();
}

function planetScene(gtx, pl, screenR){
  gtx.save(); gtx.translate(pl.x, pl.y);

  if (pl.rings){
    gtx.beginPath(); gtx.ellipse(0,0,screenR*2.5,screenR*0.8,-0.4,0,TAU); gtx.lineWidth=1;
    gtx.strokeStyle=pl.glow; gctx=null; gtx.stroke();
    gtx.beginPath(); gtx.ellipse(0,0,screenR*1.95,screenR*0.6,-0.4,0,TAU); gtx.lineWidth=1;
    gtx.strokeStyle='rgba(200,180,140,.35)'; gtx.stroke();
  }

  const litX = pl.x - cx, litY = pl.y - cy, ll = Math.hypot(litX,litY)||1;
  let lx=-litX/ll, ly=-litY/ll;

  if (pl.bands){
    gtx.save(); gtx.beginPath(); gtx.arc(0,0,screenR,0,TAU); gtx.clip();
    gtx.fillStyle = pl.color; gtx.fillRect(-screenR,-screenR,screenR*2,screenR*2);
    for (let b=-3;b<=3;b++){
      gtx.beginPath(); gtx.ellipse(0,b*screenR/3.3,screenR,screenR/7.5,-0.4,0,TAU);
      gtx.fillStyle = b%2? 'rgba(150,95,55,.32)':'rgba(235,210,170,.18)'; gtx.fill();
    }
    gtx.beginPath(); gtx.ellipse(screenR*0.38,screenR*0.12,screenR*0.17,screenR*0.1,-0.4,0,TAU);
    gtx.fillStyle='rgba(170,80,45,.5)'; gtx.fill();
    gtx.restore();
  } else {
    const g = gtx.createRadialGradient(lx*screenR*0.5, ly*screenR*0.5, screenR*0.15, 0,0, screenR*1.05);
    g.addColorStop(0, pl.glow); g.addColorStop(1, pl.color);
    gtx.fillStyle=g; gtx.beginPath(); gtx.arc(0,0,screenR,0,TAU); gtx.fill();
    const d = gtx.createRadialGradient(-lx*screenR*0.6,-ly*screenR*0.6,screenR*0.3,0,0,screenR*1.1);
    d.addColorStop(0,'rgba(0,0,0,0)'); d.addColorStop(1,'rgba(0,0,0,.5)');
    gtx.fillStyle=d; gtx.beginPath(); gtx.arc(0,0,screenR,0,TAU); gtx.fill();
  }

  if (pl.moons) for (const m of pl.moons){
    const mAng = (pl.angle + m.off)*TAU, mx=Math.cos(mAng)*m.dist, my=Math.sin(mAng)*m.dist;
    gtx.beginPath(); gtx.arc(mx,my,m.r,0,TAU); gtx.fillStyle=m.color; gtx.fill();
  }
  gtx.restore();

  gtx.fillStyle = 'rgba(225,235,255,.92)'; gtx.font='500 12px "Segoe UI",sans-serif';
  gtx.textAlign='center'; gtx.textBaseline='middle';
  gtx.fillText(pl.name.toUpperCase(), pl.x, pl.y + screenR + 15);
}

/* ---------- two-scale compositing (view + planet-space) ---------- */
const viewCanvas = document.createElement('canvas');     // full-resolution view
const canvas2 = document.createElement('canvas');         // large planet-space canvas
const g = viewCanvas.getContext('2d');
const g2 = canvas2.getContext('2d');
let Scale2;

function renderBG(){
  const off = Math.floor((T0 - performance.now())/1000)*2;
  const hw = W/2, hh = H/2;
  const t = (W*BG_DOWNSAMPLE)/2|0, th=(H*BG_DOWNSAMPLE)/2|0;
  g.setTransform(BG_DOWNSAMPLE,0,0,BG_DOWNSAMPLE, hw*BG_DOWNSAMPLE+off*0.5, hh*BG_DOWNSAMPLE);
  g.clearRect(-hw-off,-hh, W+4, H+4);

  const g1 = g.createRadialGradient(20,-30,0,20,-30,400);
  g1.addColorStop(0,'rgba(30,52,100,.18)'); g1.addColorStop(1,'rgba(30,52,100,0)');
  g.fillStyle=g1; g.fillRect(-hw,-hh,W+4,H+4);
  const g2c = g.createRadialGradient(-150,120,0,-150,120,420);
  g2c.addColorStop(0,'rgba(110,50,40,.14)'); g2c.addColorStop(1,'rgba(110,50,40,0)');
  g.fillStyle=g2c; g.fillRect(-hw,-hh,W+4,H+4);
  g2.strokeStyle='rgba(120,150,220,.05)'; g2.lineWidth=1;
  for (let i=0;i<5;i++){ g2.beginPath(); g2.arc(0,0, (i+3)*90,0,TAU); g2.stroke(); }
  g.setTransform(1,0,0,1,0,0);
  g.drawImage(viewCanvas, 0,0, t,th, 0,0, W,H);
}

function makePlanetCanvas(){
  const R = 1000, S = Math.min(2048, R*2.2)|0;
  canvas2.width = canvas2.height = S;
  g2.setTransform(1,0,0,1,0,0);
  g2.clearRect(0,0,S,S);

  const cs = S/2, base = cs / (2.15*BASE_R);
  const P2X = p => cs + (p.x-cx)*base;
  const P2Y = p => cs + (p.y-cy)*base;
  Scale2 = { cy: P2Y({x:cx,y:cy}), sx: cs, sy: cs };

  g2.save();
  g2.lineCap='round';
  for (const pl of PLANETS){
    const screenR = Math.max(pl.r*base*PLANET_R_SCALE, 1.4);
    const px=P2X(pl), py=P2Y(pl);
    g2.beginPath(); g2.arc(Scale2.sx,Scale2.sy,pl.dist*BASE_R*base,0,TAU);
    g2.strokeStyle='rgba(120,150,200,.13)'; g2.lineWidth=1.2; g2.stroke();
    g2.beginPath(); g2.arc(px,py,screenR*2.0,0,TAU);
    const gg=g2.createRadialGradient(px,py,screenR*0.4,px,py,screenR*2.0);
    gg.addColorStop(0,pl.glow); gg.addColorStop(1,'rgba(0,0,0,0)');
    g2.fillStyle=gg; g2.fill();
    g2.beginPath(); g2.arc(px,py,screenR,0,TAU);
    g2.fillStyle = pl.bands ? '#c9a06f' : pl.color; g2.fill();
    if (pl.rings){ g2.beginPath(); g2.ellipse(px,py,screenR*2.0,screenR*0.62,-0.5,0,TAU);
      g2.lineWidth=screenR*0.17; g2.strokeStyle=pl.glow; g2.stroke(); }
    if (pl.moons){ g2.setLineDash([2,4]);
      for (const m of pl.moons){ const ma=(pl.angle+m.off)*TAU, mx=px+Math.cos(ma)*base*m.dist, my=py+Math.sin(ma)*base*m.dist;
        g2.beginPath(); g2.arc(mx,my,0.5,0,TAU); g2.fillStyle=m.color; g2.fill(); }
      g2.setLineDash([]);
    }
  }
  g2.beginPath(); g2.arc(Scale2.sx,Scale2.sy,Math.max(base*SUN_SCREEN_R,3),0,TAU);
  g2.fillStyle='#ffcf6a'; g2.fill();
  g2.beginPath(); g2.arc(Scale2.sx,Scale2.sy,Math.max(base*SUN_SCREEN_R,3)*3,0,TAU);
  const sg=g2.createRadialGradient(Scale2.sx,Scale2.sy,0,Scale2.sx,Scale2.sy,base*SUN_SCREEN_R*3);
  sg.addColorStop(0,'rgba(255,190,90,.6)'); sg.addColorStop(1,'rgba(255,190,90,0)');
  g2.fillStyle=sg; g2.fill();

  g2.lineWidth=1; g2.strokeStyle='rgba(150,175,215,.2)';
  for (const dr of [0.15,1.0,1.55,2.15,3.15,MAXD]){
    g2.beginPath(); g2.arc(Scale2.sx,Scale2.sy,dr*BASE_R*base,0,TAU); g2.stroke();
    g2.fillStyle='rgba(150,175,215,.42)'; g2.font='16px ui-monospace,monospace'; g2.textAlign='center'; g2.textBaseline='middle';
    const dd=dr*BASE_R*base; g2.fillText(dr.toFixed(2)+' AU', Scale2.sx, Scale2.sy-dd-11);
  }
  g2.setLineDash([7,6]); g2.strokeStyle='rgba(120,150,200,.13)';
  for (const dr of [0.55,1.2,2.0,3.8,6.8]){ g2.beginPath(); g2.arc(Scale2.sx,Scale2.sy,dr*BASE_R*base,0,TAU); g2.stroke(); }
  g2.setLineDash([]);
  g2.fillStyle='rgba(120,150,200,.35)'; g2.font='14px ui-monospace,monospace'; g2.textAlign='center';
  g2.fillText('2 pc', Scale2.sx, Scale2.sy-D.scale2);
  g2.restore();
}

function blitPlanetView(){
  const o = D.scaleFactor / (2*D.fitS);
  const v = ctx.createPattern(canvas2, 'repeat');
  ctx.translate(cx,cy); ctx.scale(D.scaleFactor, D.scaleFactor); ctx.translate(-o,-o);
  ctx.globalAlpha = D.palpha; ctx.fillStyle=v;
  ctx.fillRect(-D.scale2, -D.scale2, D.scale2*2, D.scale2*2);
  ctx.globalAlpha = 1;
}

/* ---------- main ---------- */
function frame(now){
  const dt = Math.min(0.05, (now - (frame._p||now))/1000) / 1000; frame._p = now;
  const time = now/1000;
  D = { rot: time*0.015,
        scale: 0.4 + 0.25*Math.sin(time*0.23 - 0.5),
        zoom: 0.85 + 0.2*Math.sin(time*0.13 + 1.0) };

  const minD = Math.min(...PLANETS.map(p=>p.dist));
  const fitS = Math.min(W,H)/2 / (2.8*BASE_R);
  const scrS = fitS * (D.scale + D.zoom);

  Scale = { t1: Math.sin(D.rot), t2: Math.cos(D.rot), s: scrS,
            cx: cx + (cx-Math.cos(D.rot)*cx)*D.zoom,
            cy: cy + (cy-Math.sin(D.rot)*cy)*D.zoom };
  const sunR = SUN_SCREEN_R * scrS / fitS;
  D.scale2 = Scale2.cy / scrS;

  // project each body: screen, planet-space, current vs next frame (parallax)
  const list = PLANETS.map(pl => {
    const a = pl.seed*TAU + TAU*time/pl.period;
    const x = cx + Math.cos(a)*pl.dist*BASE_R, y = cy + Math.sin(a)*pl.dist*BASE_R;
    const nx = cx + Math.cos(a+pl.period*dt)*pl.dist*BASE_R, ny = cy + Math.sin(a+pl.period*dt)*pl.dist*BASE_R;
    return { pl, x, y,
      si: { x: Scale.cx+(x-cx)*Scale.s, y: Scale.cy+(y-cy)*Scale.s },
      s2: { x: Scale2
